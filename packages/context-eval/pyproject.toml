[project]
name = "context-eval"
version = "0.1.0"
description = "Semantic-context evaluation harness: does injected context beat exact search?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

# Two runtime dependencies, and both are load-bearing rather than convenient.
# `pyyaml` reads the corpus. `jsonschema` is NOT optional here, unlike in
# gen-eval where validation is a dev-time concern: this harness refuses to load
# a corpus that does not satisfy the promoted contracts, so a build without a
# validator could not fail closed and would be worse than no build at all.
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

# Deliberately no dependency on `gen-eval` (design D2). Nothing in gen-eval's
# assertion vocabulary applies to retrieval scoring, and its runner drops
# unscorable scenarios out of its own denominator — the exact behaviour this
# package exists to make impossible.

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

# Exact pins, not floors. The `context-eval` CI job installs this group and runs
# lint, `mypy --strict` and the suite from it, so these four values ARE the
# gate's semantics: a floor lets a registry decide, months later, what the gate
# means. This repository has already paid for that twice — ruff 0.16 changed its
# default rule set (which is why `select` below is explicit), and `ci.yml`'s
# unpinned `@fission-ai/openspec` install let a local 1.1.1 and CI's 1.6.0
# disagree about one tree (issue #318). Bumping one of these is a reviewable
# diff, and the person who bumps it re-runs the gate.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.0",
    "mypy==2.3.0",
    # Neither jsonschema nor pyyaml ships py.typed, and `mypy --strict` cannot
    # check the two imports this package cannot do without. Without both stub
    # packages the type gate reports `import-untyped` and stops being a gate.
    "types-jsonschema==4.26.0.20260518",
    "types-PyYAML==6.0.12.20250915",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Explicit, never inherited. Ruff 0.16 changed its DEFAULT rule set, and a gate
# that silently gains or loses rules on a dependency bump is not a gate.
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
