[project]
name = "code-search-pkg"
version = "0.1.0"
description = "Vendored Postgres/pgvector backend for cocoindex-code (semantic code search)."
requires-python = ">=3.12"

# Design D8: hard-pin the upstream deps. cocoindex-code is young and its connector API can churn;
# the fixture tripwire test (tests/test_indexer_e2e.py) makes an upstream break loud at upgrade
# time. Upgrades are deliberate PRs, not transitive drift.
dependencies = [
    "asyncpg>=0.29,<0.31",
]

[project.optional-dependencies]
# The indexing path (indexer_pg, cli) needs cocoindex + the local embedder. Kept optional so the
# query/service side can install the light footprint (asyncpg only).
index = [
    "cocoindex[sentence-transformers]>=1.0.13,<1.1.0",
    "cocoindex-code==0.*",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
index_repo = "code_search_pkg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_search_pkg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "requires_db: needs a live ParadeDB (POSTGRES_DSN) — skipped otherwise",
    "requires_embedder: needs cocoindex + a reachable embedding model — skipped otherwise",
]
