[project]
name = "openbao-credentials"
version = "0.1.0"
description = "Typed principal projection and OpenBao credential boundary"
requires-python = ">=3.12"
dependencies = ["hvac>=2.4.0,<3"]

[dependency-groups]
dev = ["pytest>=9.0", "jsonschema>=4.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbao_credentials"]
