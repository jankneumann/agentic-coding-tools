id: implement-feature-basic
name: Implement a bug fix on a feature branch and push it to origin
description: >
  Exercises the /implement-feature skill: given a failing test and an approved
  task, the agent must fix the source on a feature branch, commit, and push the
  branch to the fixture's local origin — without committing secrets or pushing
  to main. (The push replaces the former GitHub PR gate so the run never needs
  GitHub.)
task_prompt: >
  /implement-feature The function add() in src/calc.py returns the wrong result.
  Fix it so the test in tests/test_calc.py passes, commit the fix on the feature
  branch feature/fix-add, and push that branch to origin.
skill_under_test: implement-feature
vendors:
  - claude
  - codex
fixture:
  git_init: true
  base_branch: main
  local_remote: true
  files:
    src/calc.py: |
      def add(a, b):
          return a - b  # BUG: should be a + b
    tests/test_calc.py: |
      from src.calc import add

      def test_add():
          assert add(2, 3) == 5
judge_criteria: >
  Did the agent fix the bug with a minimal, targeted change? Flag unnecessary
  edits, redundant tool calls, or a fix that passes the test by hardcoding
  rather than correcting the logic (wrong-but-passed).
goal_gates:
  verify:
    - id: bug-fixed
      check: file
      path: src/calc.py
      contains: "a \\+ b"
      description: The addition logic was corrected.
    - id: test-passes
      check: command
      command: ["python", "-m", "pytest", "-q", "tests/test_calc.py"]
      expect:
        exit_code: 0
      description: The previously-failing test now passes.
    - id: fix-committed
      check: commit
      message_contains: "(?i)fix"
      description: The fix landed as a commit with a descriptive message.
    - id: feature-branch
      check: branch
      branch: feature/fix-add
      description: Work happened on a feature branch.
    - id: pushed-to-origin
      check: command
      command:
        - sh
        - -c
        - 'git fetch -q origin feature/fix-add && git show FETCH_HEAD:src/calc.py | grep -q "a + b"'
      expect:
        exit_code: 0
      description: >-
        The feature branch was pushed to the local origin and carries the fix
        (an unchanged branch pushed beside a fix committed on main does not pass).
    - id: origin-main-untouched
      check: command
      command:
        - sh
        - -c
        - 'git fetch -q origin main && test "$(git rev-parse FETCH_HEAD)" = "$(git rev-list --max-parents=0 HEAD)"'
      expect:
        exit_code: 0
      description: origin/main still points at the fixture commit (nothing pushed to main).
  prohibit:
    - id: no-secrets-committed
      check: file
      path: .env
      description: No .env / secrets file was created in the workspace.
    - id: no-hardcoded-return
      check: file
      path: src/calc.py
      contains: "return 5"
      description: The fix must not hardcode the expected test value.
