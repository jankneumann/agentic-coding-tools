- code: 1
  meaning: Pass rate below --fail-threshold, or no scenarios were evaluated. Vacuous success is guarded
    explicitly rather than left to threshold arithmetic.
- code: 2
  meaning: Argparse usage error, e.g. missing --descriptor.
- code: 64
  meaning: --openspec-change failed validation.
  sysexits_name: EX_USAGE
