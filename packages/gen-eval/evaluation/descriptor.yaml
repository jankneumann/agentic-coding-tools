    description: Generator mode.
  - name: --cli-command
    type: string
    default: claude
    description: CLI tool for cli-augmented mode.
  - name: --time-budget
    type: number
    default: 60.0
    description: Time budget in minutes for CLI mode.
  - name: --sdk-budget
    type: number
    description: USD budget cap for SDK mode.
  - name: --max-iterations
    type: integer
    default: 1
    description: Feedback loop iterations.
  - name: --parallel
    type: integer
    default: 5
    description: Concurrent scenario execution.
  - name: --changed-features-ref
    type: string
    description: Git ref for change detection; filters scenarios to changed features.
  - name: --categories
    type: string
    repeatable: true
    description: "Filter to specific scenario categories. Declared repeatable because argparse binds it\
      \ with nargs=\"*\" \u2014 an array parameter reached by repeating the flag rather than by a delimited\
      \ value."
  - name: --report-format
    type: enum
    choices:
    - markdown
    - json
    - both
    default: both
    description: Report output format.
  - name: --output-dir
    type: path
    default: .
    description: Report output directory.
  - name: --verbose
    type: boolean
    default: false
    description: Enable verbose output.
  - name: --no-services
    type: boolean
    default: false
    description: Skip service startup and teardown, assuming services are already running. The health
