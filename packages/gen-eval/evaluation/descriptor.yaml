commands:
- name: ''
  description: gen-eval has no subcommands. The single invocation form is `gen-eval --descriptor <path>
    [options]`, equivalently `python -m gen_eval --descriptor <path> [...]`.
  flags:
  - name: --print-contract-version
    type: boolean
    description: Print the published JSON Schema contract version (one line) and exit 0. Short-circuits
