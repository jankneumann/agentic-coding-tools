[project]
name = "skill-scripts"
version = "0.2.0"
description = "Shared Python dependencies for infrastructure skills"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25.2,<1.0",
    "tree-sitter-sql>=0.3,<1.0",
    "tree-sitter-python>=0.25.0,<1.0",
    "tree-sitter-typescript>=0.23.2,<1.0",
    "hvac>=2.4.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
sdk = [
    "anthropic>=0.40",
    "openai>=2.31.0",
]
test = [
    "pytest>=9.0.3",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.13.0",
    # Lint tooling lives here so CI can run `uv run ruff` from this directory.
    # Pinned to the same floor as agent-coordinator so both trees are linted by
    # one ruff version and cannot disagree about what is an error.
    "ruff>=0.15.21",
]

[tool.uv]
override-dependencies = [
    # CVE-2026-69247: cryptography 44.0.0-49.x reports the outcome of PKCS#7
    # RecipientInfo decryption in distinguishable ways (and observably by
    # timing), giving an attacker a Bleichenbacher oracle against the
    # content-encryption key. Fixed in 50.0.0. Transitive here; force the
    # patched version until an upstream parent floor covers it.
    "cryptography>=50.0.0",
    # PYSEC-2026-3444: httplib2 < 0.32.0 performs unbounded decompression of
    # gzip/deflate response bodies, letting a malicious server OOM the client.
    # Brought in transitively via google-api-python-client / google-auth-httplib2
    # (pulled by the sdk extra); force the patched version until an upstream
    # parent floor covers it.
    "httplib2>=0.32.0",
]

[tool.pytest.ini_options]
# Multiple sibling test directories ship `test_skill_md.py`; without importlib
# mode, pytest's default rootdir-based import causes module-name collisions.
addopts = ["--import-mode=importlib"]
# Make tests/_shared importable as `from skill_invariants import ...` from any
# per-skill test_skill_md.py file. See skills/tests/_shared/skill_invariants.py.
pythonpath = ["tests/_shared"]
testpaths = [
    "shared/tests",
    "worktree/scripts/tests",
    "coordination-bridge/scripts/tests",
    "validate-packages/scripts/tests",
    "validate-flows/scripts/tests",
    "refresh-architecture/scripts/tests",
    "bao-vault/scripts/tests",
    "changelog-version/tests",
    # Engineering-methodology skills (added by add-engineering-methodology-skills change).
    # Phase 0 scaffold:
    "tests/_shared",
    "tests/install_sh",
    # Context-impact declarations (ri-08). Lives under tests/ rather than
    # validate-packages/scripts/tests/ so install.sh does not ship it.
    "tests/validate-packages",
    # Phase 1 new methodology skills (added per-skill by Phase 1 work packages):
    "tests/test-driven-development",
    "tests/debugging-and-error-recovery",
    "tests/context-engineering",
    # `coordination-bridge/scripts/tests` (the in-skill legacy dir) was already
    # listed, but `tests/coordination-bridge` was not — so everything there,
    # including the pre-existing test_archetype_resolve.py, was invisible to the
    # default CI sweep. A test CI never runs fails the same way as one that
    # always passes.
    "tests/coordination-bridge",
    "tests/source-driven-development",
    "tests/performance-optimization",
    "tests/frontend-ui-engineering",
    "tests/api-and-interface-design",
    "tests/browser-testing-with-devtools",
    "tests/deprecation-and-migration",
    "tests/documentation-and-adrs",
    # Phase 2 ADAPT-target invariant tests (added per-skill by Phase 2 work packages):
    "tests/implement-feature",
    "tests/plan-feature",
    "tests/simplify",
    "tests/parallel-review-plan",
    "tests/parallel-review-implementation",
    "tests/security-review",
    "tests/bug-scrub",
    "tests/tech-debt-analysis",
    "tests/cleanup-feature",
    "tests/explore-feature",
    "tests/parallel-infrastructure",
    "tests/project-context-runtime",
    "tests/project-context-refresh",
    # trace-requirements-to-contracts task 5.7b. `tests/validate-feature` was
    # never listed, so test_gen_eval_mode_selection.py had never run in CI —
    # the same fail-open this list already recorded for tests/coordination-bridge
    # above. The wider problem this note described (24 more unlisted dirs, ~1182
    # hidden tests, 23 real failures, flat-module shadowing when collected
    # together) is now fixed: the failures are repaired and every one of those
    # directories runs in the isolated per-directory loop in ci.yml, which is
    # the mechanism that survives the shadowing.
    "tests/validate-feature",
    # cite-requirements walkthrough (trace-requirements-to-contracts): the
    # deterministic text-manipulation core; resolution glue needs the gen-eval
    # venv and is exercised by use, not by this suite.
    "tests/cite-requirements",
    # vision: content invariants plus the localization guards that keep the
    # upstream-adapted evidence ladder and verdict channel from regressing on a
    # future upstream sync.
    "tests/vision",
    "expedite/scripts/tests",
    # The CI-coverage guard itself. It used to sit loose in skills/tests, which
    # no testpaths entry names, so the test that asserts "every test directory
    # is run by CI" was the one directory CI never ran — and its own
    # working-directory bug went unnoticed for that reason. It has no skill
    # imports, so it is safe in the shared session.
    "tests/ci_coverage",
    # NOTE: validate-feature/scripts/tests, autopilot/scripts/tests,
    # security-review/tests, parallel-infrastructure/tests and most dirs under
    # skills/tests/ are deliberately absent. Skills import siblings by flat
    # module name and twelve of those names are defined by more than one skill,
    # so a single pytest session resolves the wrong one — and the breakage is
    # not only at collection time: tests/project-context-refresh passes alone
    # and fails 25 tests when collected alongside tests/agent-coordinator. CI
    # runs them in separate processes instead (see the "Run in-skill test suites
    # (isolated processes)" step in ci.yml).
    # tests/ci_coverage/test_ci_test_coverage.py fails if any test directory is
    # reached by neither mechanism.
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Declared EXPLICITLY rather than inheriting ruff's default. The default rule
# set is not stable across ruff releases: 0.16 turned on UP, I, RUF, PLW and
# EXE by default, which takes this tree from 0 errors to 1498 without a single
# line of code changing. An implicit rule set means a routine tool bump lands as
# a red gate full of unrelated findings, so the gate pins its own semantics.
#
# This is the historical default (pycodestyle subset + pyflakes) and is what the
# tree was cleaned against. Broadening toward agent-coordinator's
# ["E", "F", "I", "N", "W", "UP"] is deliberate follow-up work, done by fixing a
# family at a time -- not by switching it on with a red baseline.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # E402 (module-level import not at top of file) is unavoidable here and is
    # not debt. Skills are installed as standalone payloads and import their
    # siblings by flat module name, which requires inserting the sibling's
    # scripts/ directory onto sys.path *before* the import runs:
    #
    #     sys.path.insert(0, str(_RUNTIME_DIR))
    #     from checkpoint import CheckpointManager
    #
    # Every one of the 84 occurrences is that pattern. Enforcing E402 would
    # pressure authors to break a working convention, so it is ignored tree-wide
    # rather than suppressed file-by-file with noqa comments that would need
    # maintaining on every new skill.
    "E402",
]
