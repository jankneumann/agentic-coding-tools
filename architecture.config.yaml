# Architecture Report Configuration
#
# Controls the behavior of scripts/reports/architecture_report.py.
# All fields are optional — missing keys fall back to sensible defaults.
# See scripts/reports/config_schema.py for the full schema.

project:
  name: "agent-coordinator"
  description: "Multi-agent coordination MCP server"
  primary_language: "python"          # Override auto-detection
  protocol: "mcp"                     # "mcp", "http", "grpc", "cli", or "auto"

paths:
  input_dir: "docs/architecture-analysis"
  output_report: "docs/architecture-analysis/architecture.report.md"

report:
  sections:                           # List of sections to include (order matters)
    - system_overview
    - module_map
    - dependency_layers
    - entry_points
    - health
    - impact_analysis
    - code_health
    - parallel_zones
    - cross_layer_flows               # Omitted if no flows exist regardless
    - diagrams

gates:
  architecture:                       # Fitness-function gate for the Architecture phase
    mode: advisory                    # "advisory" | "blocking" (default advisory when absent)
                                      # advisory: findings are reported prominently but
                                      #   never fail a run
                                      # blocking: "Architecture" joins REQUIRED_PHASES in
                                      #   skills/validate-feature/scripts/gate_logic.py and
                                      #   a new dependency cycle fails the pre-merge gate
    block_on:                         # Categories that fail the gate once mode is blocking
      new_dependency_cycles: true
    clean_runs_before_flip: 3         # Ratchet criterion: flip mode to "blocking" only after
                                      # this many clean advisory runs. Documented, not enforced —
                                      # the flip is a one-line PR recording date + rationale.
    severity_thresholds:              # Gate-side category -> severity, graded {critical, major,
                                      # minor}. Deliberately separate from health.severity_thresholds
                                      # above: that key belongs to the architecture report and is
                                      # graded {error, warning, info}. One key serving two
                                      # vocabularies is how a threshold silently filters nothing.
      new_cycle: critical             # A newly introduced dependency cycle blocks (once blocking)
      cross_layer_violation: major    # Import crossing a layer boundary the layer map forbids
      file_size: minor                # File over the configured max line count

health:
  expected_categories:                # Diagnostic categories to mark "(expected)"
    - disconnected_flow
  category_explanations:              # Override/extend explanations per category
    disconnected_flow: "MCP routes have no frontend callers — expected (clients are AI agents)"
  severity_thresholds: {}             # Report-side filtering, graded {error, warning, info}.
                                      # Gate thresholds live under gates.architecture below —
                                      # they use a different vocabulary and a different consumer.

best_practices:                       # Files whose content contextualizes findings
  - path: "CLAUDE.md"
    sections: ["Architecture Artifacts"]
  - path: "docs/agent-coordinator.md"
    sections: ["Design Principles"]
