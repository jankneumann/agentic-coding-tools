schema_version: 4

# Host class of the machine serving the `local` provider (ASUS Ascent GX10 /
# NVIDIA GB10: 128 GB unified LPDDR5x at ~273 GB/s). Decode throughput is
# BANDWIDTH-bound, not capacity-bound, so the local roster is chosen by active
# parameters (MoE-first), not by what fits in 128 GB. Enforced at coordinator
# startup by agents_config._validate_local_roster — see OpenSpec change
# add-local-model-provider-tier (D4) and contracts/local-roster-entry.schema.json.
local_host_class:
  name: gb10
  active_params_ceiling_b: 12
  dense_params_limit_b: 30

# `frontier` is an OPTIONAL tier: providers that omit it resolve frontier
# requests to their premium model (graceful degradation in agents_config).
#
# A tier entry is either a bare model id or {model, thinking}. Thinking level
# is part of the model definition — it shifts cost and capability enough that
# tiers are tuned for cost per successful task, not cost per token (the same
# model at different thinking levels can sit in different tiers). Thinking
# vocabularies are vendor-specific; the dispatch adapter translates them.
# Tests derive expectations from this file — tune tiers here freely.
model_aliases:
  # Refreshed 2026-10-11 from each CLI's live catalog. A tier is the current
  # generation's model at the vendor-recommended effort for that job. The
  # effort step above the recommendation is reserved for frontier. Max, ultra,
  # and priced-up "fast" SKUs are left off: they cost more per successful task
  # than the recommended point. This block is the sole authored tier→model map.
  claude_code:
    # Pinned ids from the Claude Code 2.1.296 catalog, not the floating
    # aliases. `opus` still names Opus 5 (`claude-opus-5`), which is a
    # different model from Opus 5.5. Fable 5.1 (`claude-fable-5-1`) is
    # $10/$50 per Mtok. Opus 5.5 is $4/$20 and is the judgment model for
    # supervisor, planning, and review. Sonnet 5.5 is $2/$10. Haiku 5.5 is
    # $0.10/$0.50. The catalog badges medium as the rate-limit effort for
    # Opus 5.5; high is the deliberate spend for the judgment tiers.
    frontier:
      model: claude-opus-5-5
      thinking: high
    premium:
      model: claude-opus-5-5
      thinking: high
    standard:
      model: claude-sonnet-5-5
      thinking: medium
    economy:
      model: claude-haiku-5-5
      thinking: low
  codex:
    # codex 0.156.1 catalog: gpt-6-astra (frontier), gpt-6-sol (workhorse),
    # gpt-6-luna (fast). Catalog default effort is medium. gpt-5.6 is the
    # previous generation.
    frontier:
      model: gpt-6-astra
      thinking: high
    premium:
      model: gpt-6-sol
      thinking: high
    standard:
      model: gpt-6-sol
      thinking: medium
    economy:
      model: gpt-6-luna
      thinking: low
  antigravity:
    # agy 1.3.3. Effort is the model-slug suffix; the dispatch adapter does
    # not pass --effort. Newest flash is 3.8, so every tier stays on it.
    # frontier omitted → falls back to premium.
    premium: gemini-3.8-flash-high
    standard: gemini-3.8-flash-medium
    economy: gemini-3.8-flash-low
  grok:
    # grok 1.0.50 catalog. grok-4.7 is the frontier model. high is marked
    # "Recommended". grok-4.7-build-fast is 2x the price and is not used.
    frontier:
      model: grok-4.7
      thinking: xhigh
    premium:
      model: grok-4.7
      thinking: high
    standard:
      model: grok-4.7
      thinking: medium
    economy:
      model: grok-4.7
      thinking: low
  pi:
    # OpenRouter slugs via pi 0.85.1. The adapter does not forward a thinking
    # field, so tiers differ by model. standard stays qwen/qwen3-coder
    # (configuration spec). Frontier stays Kimi K3.
    frontier: moonshotai/kimi-k3
    premium: qwen/qwen3.8-max-0902
    standard: qwen/qwen3-coder
    economy: qwen/qwen3.8-flash
  # Always-on local host (see local_host_class above). Entries use the extended
  # form {model, total_params_b, active_params_b, reviewed} so the MoE-first
  # rule is validated, not merely documented; `reviewed` is the operator's
  # sign-off date and must be re-signed when the roster rotates. `frontier` and
  # `premium` are deliberately omitted — they degrade to the best defined tier
  # (`standard`), and the archetype trust boundary keeps premium-critical
  # phases off `local` entirely.
  local:
    standard:
      model: gpt-oss-120b
      total_params_b: 117
      active_params_b: 5.1
      reviewed: "2026-08-16"
    economy:
      model: qwen3-coder-30b-a3b
      total_params_b: 30.5
      active_params_b: 3.3
      reviewed: "2026-08-16"

archetypes:
  # Every archetype declares `write_capable` explicitly. The runner's archetype
  # resolver enforces this structured field directly — it does NOT substring-match
  # over system_prompt text (per design D3). Write-capable phases MUST resolve to
  # an archetype with `write_capable: true`; the resolver fails fast otherwise.
  architect:
    write_capable: true
    # frontier: planning is where weaker models get lost; implementer stays
    # standard (with premium escalation), so frontier spend is planning-only.
    model: frontier
    # goal-directed (add-skill-audit D3): frontier planning pays for scaffolding
    # it would derive itself; deviations are logged as skill-procedure-deviation.
    procedure_mode: goal-directed
    system_prompt: |
      You are a software architect. Focus on cross-cutting concerns, dependency
      ordering, interface contracts, and long-term maintainability. Think deeply
      before committing to a design. Identify risks and trade-offs explicitly.

  analyst:
    write_capable: false
    model: standard
    system_prompt: |
      You are a codebase analyst. Read thoroughly, synthesize findings concisely,
      and identify patterns, gaps, and conflicts. Report structured findings
      without making changes.

  implementer:
    write_capable: true
    model: standard
    system_prompt: |
      You are a focused implementer. Follow the work-package contract exactly.
      Do not refactor beyond scope. Write tests for new code. Keep changes
      minimal and well-scoped. If you encounter ambiguity, prefer the simpler
      interpretation.
    escalation:
      escalate_to: premium
      max_write_dirs: 3
      max_dependencies: 2
      loc_threshold: 100

  validator:
    write_capable: true
    model: standard
    system_prompt: |
      You are a validator. Your job is to exercise the change under test
      end-to-end and produce a structured evidence record. Run the validation
      phases as specified (spec, evidence, deploy, smoke, security, e2e),
      aggregate findings, classify each phase pass/fail/skipped, and write
      the resulting PhaseRecord handoff. You produce evidence artifacts
      (reports, logs) and the handoff JSON. If a validation fails, return
      outcome 'failed' and the orchestrator will dispatch a fix.

  reviewer:
    write_capable: true
    model: premium
    system_prompt: |
      You are a code reviewer. Evaluate correctness, security, performance, and
      adherence to contracts. Identify issues by severity. Be specific about
      locations and fixes. Do not rewrite code — describe what should change.

  runner:
    write_capable: false
    model: economy
    # verbatim (add-skill-audit D3): economy phases INIT and SUBMIT_PR omit
    # steps when unguided, so the runner follows the written procedure as-is.
    procedure_mode: verbatim
    system_prompt: |
      Execute the requested command and report results. Include exit codes,
      error output, and pass/fail summary. Do not analyze or suggest fixes.

  documenter:
    write_capable: true
    model: standard
    system_prompt: |
      You are a documentation writer. Update specs, changelogs, and architecture
      artifacts to match implementation reality. Be precise and concise. Follow
      existing formatting conventions.

  supervisor:
    write_capable: false
    # frontier: the supervisor decomposes the objective, routes each work
    # package to the best-fit archetype/vendor, and adjudicates every gate.
    # On Claude that tier is Opus 5.5 at high, pinned as claude-opus-5-5,
    # the same model planning and review use. It is a read-only orchestrator
    # (write_capable: false):
    # it never edits code itself, it dispatches write-capable workers. The
    # archetype resolver rejects any config that marks it write_capable.
    model: frontier
    system_prompt: |
      You are the supervisor. You own decomposition, delegation, and gate
      adjudication for a multi-agent run — you do NOT implement. Break the
      objective into well-scoped, independently verifiable work packages;
      route each to the archetype and vendor best suited to it; and sequence
      them by dependency. At every gate (plan, implementation, validation),
      weigh the evidence and decide proceed / rework / escalate, stating your
      reasoning. You never edit code, specs, tests, or configuration yourself
      — dispatch a write-capable worker archetype for any change. Your
      outputs are decisions, delegations, and adjudications, never diffs.

  gatekeeper:
    write_capable: false
    model: premium
    system_prompt: |
      You are the autopilot gatekeeper — a read-only judge that decides whether
      a change can run autonomously through implementation. Evaluate two things,
      NOT raw size: (1) the VERIFIABILITY of the intended outcomes (do specs,
      tasks, and testable acceptance criteria exist so success can be checked
      objectively?) and (2) the RISK of autonomous execution (blast radius and
      reversibility). Account for the downstream safeguards every autopilot run
      already has: multi-vendor plan/implementation review convergence, a
      validation phase, and a mandatory human merge gate. Bias toward letting
      verifiable work proceed — large but well-specified changes are acceptable.
      Reserve escalation for work whose outcomes cannot be verified or whose risk
      is both high and hard to reverse. Make changes to no files.

# ---------------------------------------------------------------------------
# Phase mapping (OpenSpec change add-per-phase-archetype-resolution, D11).
#
# Maps each non-terminal autopilot phase to an archetype. Per-phase signal
# lists tell the skills-side _extract_signals_for_phase what to lift from
# state_dict; coordinator-side resolve_archetype_for_phase silently drops
# any signal whose key is not in this list.
#
# Tunable in this YAML — no code changes needed.
# ---------------------------------------------------------------------------
phase_mapping:
  PLAN:
    archetype: architect
    signals: [capabilities_touched]
  PLAN_ITERATE:
    archetype: architect
    signals: [capabilities_touched, iteration_count]
  PLAN_REVIEW:
    archetype: reviewer
    signals: [proposal_loc, capabilities_touched]
  PLAN_FIX:
    archetype: architect
    signals: [findings_severity, findings_count]
  IMPLEMENT:
    archetype: implementer
    signals: [loc_estimate, write_allow, dependencies, complexity]
  IMPL_ITERATE:
    archetype: implementer
    signals: [iteration_count, write_allow]
  IMPL_REVIEW:
    archetype: reviewer
    signals: [files_changed, lines_changed]
  IMPL_FIX:
    archetype: implementer
    signals: [findings_severity, findings_count]
  VALIDATE:
    archetype: validator
    signals: [test_count, suite_duration]
  VAL_REVIEW:
    archetype: reviewer
    signals: [findings_severity]
  VAL_FIX:
    archetype: implementer
    signals: [findings_severity]
  INIT:
    archetype: runner
    signals: []
  GATEKEEPER:
    archetype: gatekeeper
    signals: [gate_signals]
  SUBMIT_PR:
    archetype: runner
    signals: []
