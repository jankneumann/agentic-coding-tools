[project]
name = "agent-coordinator"
version = "0.1.0"
description = "Multi-agent coordination system for AI coding assistants"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4.0",
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    # Floor >=5.1.1: 5.1.0 and earlier are affected by CVE-2026-53533
    # (SMTP command injection via unneutralized CR/LF in caller-supplied
    # addresses passed to mail()/rcpt()/vrfy()/expn()/sendmail()).
    "aiosmtplib>=5.1.1",
    "aioimaplib>=2.0.1",
    "email-validator>=2.3.0",
    "urllib3>=2.7.0",
    # gen-eval framework is now a sibling package (see [tool.uv.sources]).
    # We install with the [mcp] extra so coordinator's MCP service surface
    # keeps working (it serves /gen-eval/* tools via gen_eval.mcp_service).
    "gen-eval[mcp]",
    # Shared immutable-index query types and adapter. This is a non-editable
    # monorepo dependency so local, test, and container installs use the same
    # supported package boundary.
    "code-search-pkg",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.136.1",
    "uvicorn>=0.49.0",
    # IMPL_REVIEW claude_code#12: sse-starlette is imported at runtime in
    # coordination_api.py:2759 (EventSourceResponse) for the /events/work SSE
    # endpoint. PyJWT is imported in event_stream.py for mint/verify of the
    # short-lived SSE auth token. Both were transitively present in uv.lock
    # but absent from [api] — any environment installed via `pip install
    # .[api]` would fail at runtime.
    "sse-starlette>=2.1.0",
    # [crypto] pulls in `cryptography` for RS256 — required by both the SSE
    # token flow (HS256) and Cloudflare Access origin verification (RS256,
    # src/cloudflare_access.py), which validates Cloudflare's RSA-signed JWKS.
    "PyJWT[crypto]>=2.13.0",
]
postgres = [
    "asyncpg>=0.31.0",
]
cedar = [
    "cedarpy>=4.8.6",
]
sdk = [
    "anthropic>=0.117.0",
    "openai>=2.38.0",
]
analysis = [
    "psycopg2-binary>=2.9.0",
]
observability = [
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-exporter-prometheus>=0.62b1",
    "prometheus-client>=0.25.0",
    "langfuse>=4.14.0,<5.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright>=0.8.0",
    "respx>=0.23.1",
    "PyJWT[crypto]>=2.13.0",
    "ruff>=0.15.21",
    "mypy>=2.1.0",
    "hypothesis>=6.152.7",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright>=0.8.0",
    "respx>=0.23.1",
    "PyJWT[crypto]>=2.13.0",
    "ruff>=0.15.21",
    "mypy>=2.1.0",
    "types-PyYAML>=6.0",
    "asyncpg>=0.31.0",
    "cedarpy>=4.8.6",
]

[project.scripts]
coordination-mcp = "src.coordination_mcp:main"
coordination-api = "src.coordination_api:main"
coordination-cli = "src.coordination_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
override-dependencies = [
    # CVE-2026-53538/53539/53540: python-multipart < 0.0.31 has DoS and
    # parser-differential vulnerabilities (negative Content-Length unbounded
    # read; semicolon-separator quadratic scan; semicolon field-smuggling).
    # Brought in transitively via mcp -> fastmcp; force the resolver to pick
    # the patched version until upstream constraints catch up.
    "python-multipart>=0.0.31",
    # CVE-2026-49852 (HIGH — HMAC empty-key auth bypass) and CVE-2026-48990
    # (RFC7797 payload-size-limit bypass) affect joserfc < 1.6.8. Brought in
    # transitively via the auth stack; force the patched version until an
    # upstream parent floor covers it.
    "joserfc>=1.6.8",
    # PYSEC-2026-3444: httplib2 < 0.32.0 performs unbounded decompression of
    # gzip/deflate response bodies, letting a malicious server OOM the client.
    # Brought in transitively via google-api-python-client / google-auth-httplib2;
    # force the patched version until an upstream parent floor covers it.
    "httplib2>=0.32.0",
    # CVE-2026-52869/52870 (session hijack + cross-session task access on the
    # MCP HTTP transports) and CVE-2026-59950 (missing Host/Origin validation in
    # the deprecated WebSocket transport) affect mcp < 1.28.1. Brought in
    # transitively via fastmcp; force the patched version until fastmcp's floor
    # covers it.
    "mcp>=1.28.1",
]

# Resolve `gen-eval` to the sibling package in this monorepo. Per design
# decision D5, the install is NON-editable: uv builds gen-eval into a wheel
# and copies the contents into the coordinator's venv. This keeps the
# multi-stage agent-coordinator/Dockerfile safe (the runtime image stage
# copies only /app/.venv from the builder stage, and gen_eval is fully
# self-contained inside .venv/lib/python3.X/site-packages/gen_eval/).
[tool.uv.sources]
gen-eval = { path = "../packages/gen-eval" }
code-search-pkg = { path = "../packages/code-search" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring local Supabase (docker-compose up -d)",
    "e2e: end-to-end tests against running services (docker-compose up -d)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
