id: "http-memory-work-sweep"
name: "HTTP memory and work queue endpoint sweep"
description: "Exercise HTTP memory and work endpoints: POST /memory/store, POST /memory/query, GET /work/queue, POST /work/cancel"
category: "cross-interface"
priority: 2
interfaces: ["http"]
tags: ["memory", "work-queue", "http", "sweep"]

# The `/memory/working/update` and `/memory/working/get` steps were replaced
# with the episodic store/query pair: ri-15 dropped the working-memory layer
# (migration 031) and those routes no longer exist. Keeping the memory half of
# this cross-interface sweep matters — dropping it outright would have quietly
# narrowed the scenario to work-queue-only coverage.

steps:
  - id: memory_store
    transport: http
    method: POST
    endpoint: /memory/store
    body:
      event_type: "test"
      summary: "http sweep memory"
      tags: ["http-sweep"]
    expect:
      status: 200

  - id: memory_query
    transport: http
    method: POST
    endpoint: /memory/query
    body:
      tags: ["http-sweep"]
    expect:
      status: 200

  - id: work_queue
    transport: http
    method: GET
    endpoint: /work/queue
    expect:
      status: 200

  - id: submit_work
    transport: http
    method: POST
    endpoint: /work/submit
    body:
      task_type: "test"
      description: "sweep cancel target"
    expect:
      status: 200

  - id: cancel_work
    transport: http
    method: POST
    endpoint: /work/cancel
    body:
      task_id: "sweep-cancel-task"
    expect:
      status: 200
