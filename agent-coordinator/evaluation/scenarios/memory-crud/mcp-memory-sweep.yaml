id: "mcp-memory-sweep"
name: "MCP memory tool sweep"
description: "Exercise the MCP memory tools: remember and recall"
category: "memory-crud"
priority: 3
interfaces: ["mcp"]
tags: ["memory", "mcp", "sweep"]

# The working/procedural steps this sweep used to carry were removed with
# ri-15: migration 031 dropped `memory_working` / `memory_procedural`, and the
# `update_working_memory` / `get_working_memory` / `learn_procedure` tools no
# longer exist on any interface. Episodic is the whole memory surface now, so
# this sweep covers all of it.

steps:
  - id: remember
    transport: mcp
    tool: remember
    params:
      event_type: "test"
      summary: "mcp sweep test"
      tags: ["mcp-sweep"]
    expect:
      body:
        success: true

  - id: recall
    transport: mcp
    tool: recall
    params:
      tags: ["mcp-sweep"]
    expect:
      body:
        success: true
      not_empty: true
