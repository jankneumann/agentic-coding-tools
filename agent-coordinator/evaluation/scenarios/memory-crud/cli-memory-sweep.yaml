id: "cli-memory-sweep"
name: "CLI memory command sweep"
description: "Exercise all CLI memory commands: memory store, memory query"
category: "memory-crud"
priority: 2
interfaces: ["cli"]
tags: ["memory", "cli", "sweep"]

steps:
  - id: cli_store
    transport: cli
    command: "memory store --event-type test --summary 'cli sweep memory' --tags cli-sweep"
    expect:
      exit_code: 0

  - id: cli_query
    transport: cli
    command: "memory query --tags cli-sweep --limit 5"
    expect:
      exit_code: 0

# The `memory working-update` / `memory working-get` steps were removed with
# ri-15: migration 031 dropped the backing tables and the commands no longer
# exist. Episodic store/query is the whole CLI memory surface.
