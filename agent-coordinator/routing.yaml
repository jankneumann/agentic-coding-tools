schema_version: 1
policy_version: ri18-v1

# First feasible tier wins. Availability and model eligibility are checked by
# the registry before this ladder is applied; exhausted subscription windows
# therefore fall through to the next tier. Utility ranks only within a tier.
cost_policy:
  tiers:
    - id: subscription-local
      location: local
      endpoint_kinds: [vendor-cli]
    - id: subscription-cloud
      location: cloud
      endpoint_kinds: [vendor-sdk]
    - id: metered-api
      location: local
      endpoint_kinds: [openrouter]

defaults:
  dispatch_mode: quick
  phase_dispatch_modes:
    PLAN_REVIEW: review
    IMPL_REVIEW: review
    VAL_REVIEW: review
    GATEKEEPER: review

# Rules are evaluated in order. The first matching rule that mentions a
# dimension owns that dimension; later rules may still constrain other ones.
rules:
  - id: direct-secrets-local
    when:
      secret_need: direct
    constrain:
      location: local
  - id: interactive-local
    when:
      interactivity: interactive
    constrain:
      location: local
  - id: read-only-review
    when:
      scope: read-only
    constrain:
      dispatch_mode: review

# This order is a deterministic local-fallback tie breaker, not an isolation
# strength or enforcement policy.
fallback:
  location_order: [local, cloud, unknown]
  isolation_order: [worktree, sandbox, none]
  dispatch_mode_order: [review, alternative, quick, sdk]
