# agents.yaml — Single source of truth for agent identity and permissions.
# Referenced by profile_loader and setup-coordinator skill.
#
# Naming convention: <vendor>-<local|remote>
#   local  = CLI runs on the developer's machine
#   remote = CLI dispatches to vendor's cloud infrastructure
#
# The optional `cli` section configures vendor dispatch for multi-vendor
# review orchestration.  Only agents with a `cli` section can be targets
# for CLI subprocess dispatch (review or alternative generation).
# The review_type (plan vs implementation) determines what is being
# reviewed/generated; the dispatch mode controls sandbox permissions.
#
# The optional `sdk` section configures SDK-based API dispatch as a
# fallback when the vendor's CLI is not installed.  API keys are resolved
# via OpenBao at runtime (using `openbao_role_id`), falling back to the
# environment variable named in `api_key_env`.
#
# The optional `archetypes` field declares which agent archetypes (defined in
# archetypes.yaml) this agent can fulfill. When set, the coordinator work
# queue filters claims by archetype compatibility — a task submitted with
# `agent_requirements.archetype = "architect"` will only be claimed by agents
# whose archetypes list includes "architect". Agents with no archetypes
# field (or an empty list) are backward-compatible and can claim any task.

# vendor_diversity policy: when a worker (implementer) and a validator (reviewer
# or behavioral validator) are dispatched to the same OpenSpec change, the
# dispatcher selects them from different vendors. This avoids shared
# training-data biases between the agent that wrote the code and the agent that
# reviews it — a validator with the same training distribution is more likely
# to confirm the worker's design choices than to challenge them.
#
# When only one vendor is available (single-vendor environment, or rate limits
# exhausted alternatives), the dispatcher logs a warning and continues with the
# single vendor (fallback: warn_and_continue). The policy can be disabled by
# setting `enforce_for` to an empty list. Scope `per_change` means the
# constraint applies across all packages within one OpenSpec change.
policies:
  vendor_diversity:
    enforce_for: [worker_vs_validator]
    fallback: warn_and_continue
    scope: per_change

agents:
  # ---------------------------------------------------------------------------
  # Claude Code
  # ---------------------------------------------------------------------------

  claude-local:
    type: claude_code
    profile: claude_code_local
    trust_level: 3
    transport: mcp
    isolation: worktree
    capabilities: [lock, queue, memory, guardrails, handoff, discover, audit]
    archetypes: [architect, analyst, implementer, reviewer, runner, documenter]
    description: Local Claude Code CLI agent with full coordination access
    cli:
      command: claude
      dispatch_modes:
        review:
          args: ["--print", "--allowedTools", "Read,Grep,Glob"]
        alternative:
          args: ["--print", "--allowedTools", "Read,Grep,Glob,Write,Edit,Bash"]
        quick:
          args: ["--print", "--allowedTools", "Read,Grep,Glob,Write,Edit,Bash"]
      model_flag: "--model"
      model: null
      model_fallbacks: ["claude-sonnet-4-6"]
      prompt_via_stdin: true

  claude-remote:
    type: claude_code
    profile: claude_code_remote
    trust_level: 2
    transport: http
    isolation: none
    api_key: "${CLAUDE_WEB_API_KEY}"
    openbao_role_id: claude-code-web
    capabilities: [lock, queue, memory, guardrails, handoff, discover, feature_registry]
    archetypes: [analyst, implementer, reviewer, documenter]
    description: Remote Claude Code agent (runs on Anthropic infrastructure)
    cli:
      command: claude
      dispatch_modes:
        review:
          # Sync: --print --remote blocks and returns stdout
          args: ["--print", "--remote", "--allowedTools", "Read,Grep,Glob"]
        alternative:
          # Async: --remote without --print returns immediately
          args: ["--remote"]
          async: true
          poll:
            # Poll via RemoteTrigger API or `claude --resume` (session-based)
            # For now, use `claude tasks` to check status
            command_template: ["claude", "--resume", "{task_id}", "--print"]
            task_id_pattern: "session[_\\s:]+([a-f0-9-]+)"
            success_pattern: "completed|finished|done"
            failure_pattern: "failed|error|cancelled"
            interval_seconds: 60
            timeout_seconds: 1800
        quick:
          args: ["--print", "--allowedTools", "Read,Grep,Glob,Write,Edit,Bash"]
      model_flag: "--model"
      model: null
      model_fallbacks: ["claude-sonnet-4-6"]
      prompt_via_stdin: true
    sdk:
      package: anthropic
      method: messages.create
      model: claude-sonnet-4-6
      model_fallbacks: [claude-haiku-4-5-20251001]
      api_key_env: ANTHROPIC_API_KEY
      max_tokens: 16384

  # ---------------------------------------------------------------------------
  # Codex
  # ---------------------------------------------------------------------------

  codex-local:
    type: codex
    profile: codex_local
    trust_level: 3
    transport: mcp
    isolation: worktree
    capabilities: [lock, queue, memory, guardrails, handoff, discover, audit]
    archetypes: [architect, analyst, implementer, reviewer, runner, documenter]
    description: Local Codex worker with full coordination access
    cli:
      command: codex
      dispatch_modes:
        review:
          args: ["exec", "-s", "read-only"]
        alternative:
          args: ["exec", "-s", "workspace-write"]
        quick:
          args: ["exec", "-s", "workspace-write"]
      model_flag: "-m"
      model: "gpt-5.5"
      model_fallbacks: ["gpt-5.4", "gpt-5.4-mini"]
      thinking_flag: "-c"
      thinking_values:
        medium: "model_reasoning_effort=medium"
        xhigh: "model_reasoning_effort=xhigh"

  codex-remote:
    type: codex
    profile: codex_remote
    trust_level: 2
    transport: http
    isolation: sandbox
    api_key: "${CODEX_API_KEY}"
    openbao_role_id: codex-cloud
    capabilities: [lock, queue, memory, guardrails, handoff, feature_registry]
    archetypes: [implementer, reviewer]
    description: Remote Codex agent (runs on OpenAI infrastructure)
    cli:
      command: codex
      dispatch_modes:
        review:
          # codex cloud exec requires --env; set CODEX_CLOUD_ENV in environment
          # All cloud exec is async — submit + poll
          args: ["cloud", "exec", "--env", "${CODEX_CLOUD_ENV}"]
          async: true
          poll:
            command_template: ["codex", "cloud", "status", "{task_id}"]
            task_id_pattern: "task[_\\s:]+([\\w-]+)"
            success_pattern: "completed|succeeded"
            failure_pattern: "failed|cancelled|error"
            interval_seconds: 30
            timeout_seconds: 600
        alternative:
          args: ["cloud", "exec", "--env", "${CODEX_CLOUD_ENV}"]
          async: true
          poll:
            command_template: ["codex", "cloud", "status", "{task_id}"]
            task_id_pattern: "task[_\\s:]+([\\w-]+)"
            success_pattern: "completed|succeeded"
            failure_pattern: "failed|cancelled|error"
            interval_seconds: 30
            timeout_seconds: 1800
      model_flag: "-m"
      model: "gpt-5.4"
      model_fallbacks: ["gpt-5.3-codex"]
      thinking_flag: "-c"
      thinking_values:
        medium: "model_reasoning_effort=medium"
        xhigh: "model_reasoning_effort=xhigh"
    sdk:
      package: openai
      method: chat.completions.create
      model: gpt-5.4
      model_fallbacks: [gpt-5.4-mini]
      thinking_parameter: "reasoning_effort"
      thinking_values:
        medium: medium
        xhigh: xhigh
      api_key_env: OPENAI_API_KEY
      max_tokens: 16384

  # ---------------------------------------------------------------------------
  # Antigravity (agy) — Gemini-family models, Claude-shaped CLI
  #
  # Dispatch shape verified empirically in Phase 1 (design.md § Empirical CLI
  # findings, checkpoint 1.4). E7: agy ignores stdin — the prompt is the VALUE
  # of --prompt (prompt_via_flag), so dispatch_modes.args carry only mode and
  # permission flags. Tier slugs (E1) live in DEFAULT_PROVIDER_MODEL_MAP.
  # ---------------------------------------------------------------------------

  antigravity-local:
    type: antigravity
    profile: antigravity_local
    trust_level: 3
    transport: mcp
    isolation: worktree
    capabilities: [lock, queue, memory, guardrails, handoff, discover, audit]
    archetypes: [architect, analyst, implementer, reviewer, runner, documenter]
    description: Local Antigravity (agy) worker with full coordination access
    cli:
      command: agy
      dispatch_modes:
        review:
          # --mode plan: planning only, no edits — read-only-shaped review.
          #
          # --dangerously-skip-permissions is REQUIRED even though this mode
          # makes no edits. Headless agy cannot prompt for tool permission, so
          # without it every tool call is auto-denied and the CLI emits
          #   "jetski: no output produced — a tool required the read_file
          #    permission that headless mode cannot prompt for"
          # instead of JSON. A reviewer that cannot read files produces nothing
          # useful, and the dispatcher reported only "Invalid JSON output"
          # because it discards stdout on parse failure.
          #
          # Read-only-ness comes from --mode plan (no edits), not from
          # withholding permissions. This was the only dispatch mode missing
          # the flag.
          args: ["--mode", "plan", "--dangerously-skip-permissions"]
        alternative:
          args: ["--mode", "accept-edits", "--dangerously-skip-permissions"]
        quick:
          args: ["--mode", "accept-edits", "--dangerously-skip-permissions"]
      model_flag: "--model"
      model: "gemini-3.6-flash-medium"
      model_fallbacks: ["gemini-3.6-flash-low"]
      prompt_via_flag: "--prompt"

  # ---------------------------------------------------------------------------
  # Grok (xAI / X subscription — routed through the `grok` binary, never
  # OpenRouter). E2: prompt delivered via --prompt-file /dev/stdin under a
  # subprocess pipe. E5: single model grok-4.5, tiers by --reasoning-effort
  # (added by the dispatching adapter from the tier's `thinking` value). E6:
  # --output-format json yields a .structuredOutput envelope (task 2.6 / 3.x
  # add --json-schema with the schema content inlined by the adapter).
  # ---------------------------------------------------------------------------

  grok-local:
    type: grok
    profile: grok_local
    trust_level: 3
    transport: mcp
    isolation: worktree
    capabilities: [lock, queue, memory, guardrails, handoff, discover, audit]
    archetypes: [architect, analyst, implementer, reviewer, runner, documenter]
    description: Local Grok worker with full coordination access
    cli:
      command: grok
      dispatch_modes:
        review:
          # --json-schema is REQUIRED, not optional polish. review_dispatcher's
          # _extract_findings unwraps grok's `structuredOutput` key, but grok
          # only populates that key when --json-schema is passed. With
          # --output-format json alone the answer comes back as a JSON *string*
          # under `text`, structuredOutput is absent, the unwrap returns None,
          # and the dispatcher reports "Invalid JSON output".
          #
          # This is the "--json-schema ... inlined by the adapter" step noted in
          # the E6 comment above, which was never implemented adapter-side.
          # Carrying it here makes the vendor work with the dispatcher as it
          # already exists — no code change required.
          #
          # --always-approve matches the other modes: a reviewer must be able to
          # read files and run commands. Read-only-ness is a property of the
          # review prompt, not of withholding tool access.
          args:
            - "--prompt-file"
            - "/dev/stdin"
            - "--output-format"
            - "json"
            - "--always-approve"
            - "--json-schema"
            - >-
              {"type":"object","required":["findings"],"properties":{"findings":
              {"type":"array","items":{"type":"object","required":["id","type",
              "criticality","description","disposition","axis","severity"],
              "properties":{"id":{"type":"integer"},"type":{"enum":["spec_gap",
              "contract_mismatch","architecture","security","performance","style",
              "correctness","observability","compatibility","resilience",
              "behavioral_failure"]},"criticality":{"enum":["low","medium","high",
              "critical"]},"description":{"type":"string"},"resolution":
              {"type":"string"},"disposition":{"enum":["fix","regenerate","accept",
              "escalate"]},"axis":{"enum":["correctness","readability",
              "architecture","security","performance"]},"severity":{"enum":
              ["critical","nit","optional","fyi","none"]},"file_path":
              {"type":"string"}}}}}}
        alternative:
          args: ["--prompt-file", "/dev/stdin", "--always-approve"]
        quick:
          args: ["--prompt-file", "/dev/stdin", "--always-approve"]
      model_flag: "-m"
      model: "grok-4.5"
      model_fallbacks: []
      thinking_flag: "--reasoning-effort"
      thinking_values:
        low: low
        medium: medium
        high: high
      prompt_via_stdin: true

  # ---------------------------------------------------------------------------
  # pi (OpenRouter models — reaches models outside the subscription harnesses,
  # e.g. Kimi 3, Qwen3-Coder). E3: resolves OPENROUTER_API_KEY from the
  # subprocess env. E8: prompt is a trailing positional (default delivery);
  # --mode json emits an NDJSON event stream.
  # ---------------------------------------------------------------------------

  pi-local:
    type: pi
    profile: pi_local
    trust_level: 3
    transport: mcp
    isolation: worktree
    capabilities: [lock, queue, memory, guardrails, handoff, discover, audit]
    archetypes: [architect, analyst, implementer, reviewer, runner, documenter]
    description: Local pi worker (OpenRouter) with full coordination access
    cli:
      command: pi
      dispatch_modes:
        review:
          # --no-tools REMOVED. Its presence was the most damaging of the three
          # vendor bugs, because unlike the others it failed SILENTLY.
          #
          # The intent ("text-only, no edits — read-only-shaped review") was
          # right; the mechanism was wrong. --no-tools removes READ access too,
          # so a review prompt asking pi to examine artifacts and run commands
          # got answered from the prompt text alone. Probed directly, the model
          # says out loud:
          #     "I need to read the openspec/contracts/README.md"
          # and then returns {"findings": []} in ~2s.
          #
          # agy and grok failed loudly and the dispatcher marked them
          # unsuccessful. pi returned success=True with an empty findings list,
          # so it COUNTED TOWARD QUORUM having read nothing. A reviewer that
          # inspected no artifact voting "no problems found" is worse than one
          # that errors — it manufactures false consensus.
          #
          # Read-only-ness is a property of the review prompt, not of blinding
          # the reviewer. --approve matches alternative/quick.
          args: ["-p", "--provider", "openrouter", "--mode", "json", "--approve"]
        alternative:
          args: ["-p", "--provider", "openrouter", "--approve"]
        quick:
          args: ["-p", "--provider", "openrouter", "--approve"]
      model_flag: "--model"
      model: "qwen/qwen3-coder"
      model_fallbacks: ["qwen/qwen3-coder-flash"]
