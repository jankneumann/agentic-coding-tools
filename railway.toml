# Railway deployment configuration for the Coordination API
#
# ─── THIS FILE MUST LIVE AT THE REPO ROOT ──────────────────────────────────
#
# Railway resolves railway.toml RELATIVE TO the service's Source > Root
# Directory. The Coordination API service has Root Directory = `/` (see
# below), so Railway looks for the config at `/railway.toml`. If this file is
# moved back under agent-coordinator/ it becomes invisible, Railway ignores
# dockerfilePath, falls back to Railpack, and the build fails ("no recognized
# manifest at repo root"). Keep it here.
#
# ─── DASHBOARD PREREQUISITE (D8 Strategy A) ────────────────────────────────
#
# The gen-eval framework is a sibling package at packages/gen-eval/ (see
# OpenSpec change extract-gen-eval-package). The Dockerfile (at
# agent-coordinator/Dockerfile) uses a repo-root build context so it can
# COPY both agent-coordinator/ and packages/gen-eval/ in a single build.
#
# The Coordination API service must be configured with:
#
#   Settings → Source → Root Directory: /   (NOT agent-coordinator)
#
# Root Directory is dashboard-only (config-as-code cannot set it). Once it is
# `/`, this file is discovered and [build] below takes effect — so the
# Dockerfile Path does NOT need to be set manually in the dashboard.
#
# ─── ROLLBACK ────────────────────────────────────────────────────────────────
# If the dashboard change cannot be made, revert the commit on the deployed
# branch that introduced the Dockerfile Strategy A pivot (see git log
# --oneline for `feat(gen-eval): migrate agent-coordinator`).  The reverted
# Dockerfile uses the old agent-coordinator/ build context and does not
# require packages/gen-eval/ to be in-context.
#
# ─── TWO-SERVICE ARCHITECTURE ────────────────────────────────────────────────
#   Service 1: ParadeDB Postgres
#     - Add via Railway dashboard: Docker image → paradedb/paradedb
#     - Accessible on private network: postgres://...@paradedb.railway.internal:5432/coordinator
#     - Configure persistent volume for /var/lib/postgresql
#
#   Service 2: Coordination API (this config)
#     - Builds from agent-coordinator/Dockerfile with repo-root context
#     - Connects to Postgres via POSTGRES_DSN on private network
#     - Public HTTPS endpoint for cloud agents
#
# Required environment variables (set in Railway dashboard):
#   POSTGRES_DSN=postgresql://postgres:<password>@<service>.railway.internal:5432/coordinator
#   DB_BACKEND=postgres
#   COORDINATION_API_KEYS=<comma-separated API keys>
#   COORDINATION_API_KEY_IDENTITIES=<JSON mapping keys to agent identities>
#
# Optional:
#   API_WORKERS=2
#   API_TIMEOUT_KEEP_ALIVE=65
#   API_ACCESS_LOG=true

[build]
# Effective once the Railway dashboard Source > Root Directory is set to `/`.
dockerfilePath = "agent-coordinator/Dockerfile"
# Root Directory and rebuild-trigger scope are SEPARATE concerns on Railway.
# Root Directory = `/` is required only so the Docker build CONTEXT can see
# both agent-coordinator/ and its sibling packages/gen-eval/ (D8 Strategy A).
# It does NOT mean "rebuild on any repo change": watchPatterns below restrict
# redeploys to the two source trees that actually go into the coordinator
# image (mirror of the Dockerfile COPYs). Edits to skills/, apps/, docs/, etc.
# will not trigger a coordinator rebuild. Add a pattern here if the Dockerfile
# starts COPYing from a new path outside these two trees.
watchPatterns = [
  "agent-coordinator/**",
  "packages/gen-eval/**",
]

[deploy]
healthcheckPath = "/live"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
