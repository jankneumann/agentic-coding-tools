name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

# Same rule as ci.yml: cancel superseded pull_request runs only. A push to main
# or a merge_group entry must finish, since nothing re-runs it later. The group
# key is workflow-scoped, so CI and Security cancel independently.
concurrency:
  # Safety lives in the GROUP, not in the flag.
  #
  # This previously read `cancel-in-progress: ${{ github.event_name ==
  # 'pull_request' }}`, which *looks* like "only cancel PR runs" and is not.
  # A `${{ }}` expression yields a string, and a non-empty string — including
  # "false" — is truthy for this field, so every event cancelled its
  # predecessor. Pushes to main share the group `CI-refs/heads/main`, so a merge
  # landing while the previous merge was still building killed that run.
  #
  # Observed, not theorised: 3 of the last 40 main runs were cancelled. On
  # 2026-09-10 three merges 13s apart produced ok / CANCELLED / ok, and on
  # 2026-09-04 the same shape. In both clusters the last run survives and the
  # middle one dies, which is what `cancel-in-progress: true` does. Two pushes
  # 40s apart (8efb87d1 -> b47dcaad) both survived, because a run that already
  # finished cannot be cancelled. `1ad5da69` is on main today with no CI verdict
  # of its own — exactly what the old comment here promised could not happen.
  #
  # Keying the group on `github.run_id` for anything that is not a pull request
  # makes each such run a singleton: nothing else can join its group, so nothing
  # can cancel it, whatever the flag evaluates to. Pull requests still key on the
  # PR number and still supersede properly. The flag is now plainly `true`
  # because that is what it always effectively was; writing it honestly is what
  # stops the next reader trusting a condition that never applied.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Space-separated list of CVE/PYSEC IDs to ignore in pip-audit runs.
  # Each entry must have a written justification (disputed advisory, no fix
  # available, or scoped-to-environment-we-don't-use); add a comment when
  # appending. Reviewed periodically — when a fix lands upstream, drop the
  # entry rather than carrying it forward forever.
  #
  # - CVE-2026-3219: affects pip itself. GitHub Advisory Database lists no
  #   patched version as of 2026-05-04.
  # - PYSEC-2025-183: pyjwt "weak encryption" advisory, disputed by supplier
  #   (the key length is chosen by the calling application; library users
  #   benefit from a minimum value but it's not a library defect). No fix
  #   version. Added 2026-05-20 to unblock kanban-viz PR #178.
  PIP_AUDIT_IGNORED_VULNS: >-
    CVE-2026-3219
    PYSEC-2025-183

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for gitleaks
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit-coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-coordinator
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pip-audit
        run: |
          uv pip install pip-audit
          # shellcheck disable=SC2086  # word-split is intentional — CVE IDs are alnum+hyphen
          IGNORE_ARGS=$(printf -- '--ignore-vuln %s ' $PIP_AUDIT_IGNORED_VULNS)
          uv run pip-audit --desc on $IGNORE_ARGS --format json --output pip-audit-results.json || true
          uv run pip-audit --desc on $IGNORE_ARGS

  dependency-audit-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skills
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pip-audit
        run: |
          uv pip install pip-audit
          # shellcheck disable=SC2086  # word-split is intentional — CVE IDs are alnum+hyphen
          IGNORE_ARGS=$(printf -- '--ignore-vuln %s ' $PIP_AUDIT_IGNORED_VULNS)
          uv run pip-audit --desc on $IGNORE_ARGS --format json --output pip-audit-results.json || true
          uv run pip-audit --desc on $IGNORE_ARGS
