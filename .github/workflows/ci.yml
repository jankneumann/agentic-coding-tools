name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-coordinator

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src/

      - name: Run pytest
        run: uv run pytest -m "not e2e and not integration"

  test-infra-skills:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      # Lint runs before the slower install/test steps so a style-only break
      # fails in seconds rather than after the full suite.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Validate standalone skill install payload
        run: |
          bash install.sh --check
          uv run python validate-feature/scripts/linters/dependency_direction.py --skills-root .

      - name: Run infrastructure skill tests
        run: uv run pytest -v

  test-skills:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras
        working-directory: agent-coordinator

      - name: Run skills tests
        run: agent-coordinator/.venv/bin/python -m pytest skills/bug-scrub/tests/ skills/fix-scrub/tests/ -v

  validate-specs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install openspec
        run: npm install -g @fission-ai/openspec

      - name: Validate specs
        run: openspec validate --strict --all

  # Read-only deterministic freshness gate over every generated context artifact:
  # the decision index, the documentation/contract inventories, architecture
  # provenance, and the OpenSpec projection. Nothing here is about `.claude/skills/`
  # mirror drift.
  #
  # This is the single freshness authority for the decision index. It replaces
  # the retired regenerate-and-`git diff` job, which compared content only and
  # was therefore blind to an orphaned `docs/decisions/<capability>.md` — a file
  # whose *presence*, not content, is what goes stale (see design D9 of
  # add-deterministic-context-drift-gates; pinned by test_decision_index_orphan.py).
  #
  # Exit 2 is drift, exit 1 is an apparatus failure; both fail the job.
  context-drift-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The gate scopes work-package context-impact validation to
          # `git diff main...HEAD`; a shallow clone has no `main` to diff against
          # and would silently validate nothing.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install skills deps
        working-directory: skills
        run: uv sync --all-extras

      - name: Run deterministic context drift gate
        run: |
          if make context-drift-gate PYTHON=skills/.venv/bin/python; then
            exit 0
          fi
          echo "::error::Deterministic context drift. The stale artifacts and their remediation commands are listed above. Reproduce locally with 'make context-drift-gate'."
          exit 1

  # Static contract check: does every local package imported from src/
  # have a matching COPY statement in the Dockerfile runtime stage?
  # Catches the class of bug where a lazy import references a directory
  # that isn't COPY'd (e.g., `from gen_eval import ...` when
  # the gen-eval wheel isn't in .venv or evaluation/ isn't bundled).
  check-docker-imports:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-coordinator

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Verify Dockerfile COPY coverage for src/ imports
        run: |
          uv run python scripts/check_docker_imports.py \
            --data-dir cedar \
            --data-dir profiles \
            --verbose

  # Container smoke-import test: build the real Docker image and verify
  # that every module imported by src/coordination_api.py and
  # src/coordination_mcp.py loads without error inside the built container.
  # This catches runtime import failures that the static check might miss
  # (e.g., missing system libraries, PYTHONPATH issues, lazy imports from
  # third-party code).
  docker-smoke-import:
    runs-on: ubuntu-latest
    # Build context is now repo root (D8 Strategy A) so the Dockerfile can
    # COPY both agent-coordinator/ and packages/gen-eval/ in a single build.
    # No working-directory override — the build-push-action uses context: .

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          # context is repo root; file points at agent-coordinator/Dockerfile
          # (per D8 Strategy A — gen-eval is a sibling package, not a subdir)
          context: .
          file: agent-coordinator/Dockerfile
          load: true
          tags: coord-api-ci:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-import all modules inside the container
        run: |
          docker run --rm \
            -e POSTGRES_DSN="postgresql://localhost:1/nope" \
            coord-api-ci:smoke \
            /app/.venv/bin/python -c "
          import importlib, sys

          # Every top-level entry point we expect to work in the built image.
          # Keep this list aligned with what the MCP server and HTTP API load.
          # gen_eval.mcp_service — the canonical path since extract-gen-eval-package.
          modules = [
              'src.coordination_api',
              'src.coordination_mcp',
              'src.http_proxy',
              'src.config',
              'gen_eval.mcp_service',
          ]

          failures = []
          for name in modules:
              try:
                  importlib.import_module(name)
                  print(f'OK  {name}')
              except Exception as exc:
                  print(f'FAIL {name}: {type(exc).__name__}: {exc}')
                  failures.append((name, exc))

          # Verify we can actually construct the FastAPI app factory.
          try:
              from src.coordination_api import create_coordination_api
              app = create_coordination_api()
              route_count = len([r for r in app.routes if hasattr(r, 'path')])
              print(f'OK  FastAPI app factory constructed ({route_count} routes)')
          except Exception as exc:
              print(f'FAIL FastAPI app factory: {type(exc).__name__}: {exc}')
              failures.append(('app_factory', exc))

          if failures:
              print(f'\\n{len(failures)} import(s) failed inside the built container.')
              sys.exit(1)
          print('\\nAll module imports succeeded inside the built container.')
          "

  formal-coordination:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run TLA+ model checks (non-blocking)
        run: .github/scripts/run_tlc.sh

  test-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: paradedb/paradedb:v0.22.2
        ports:
          - 54322:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: cd agent-coordinator && uv sync --all-extras

      - name: Apply database migrations
        run: |
          sudo apt-get install -y postgresql-client
          for f in agent-coordinator/database/migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -f "$f"
          done

      - name: Wait for DB readiness
        run: cd agent-coordinator && uv run python scripts/wait_for_db.py
        env:
          POSTGRES_DSN: postgresql://postgres:postgres@localhost:54322/postgres

      - name: Run integration and E2E tests (DirectPostgresClient)
        run: cd agent-coordinator && uv run pytest tests/integration/postgres/ tests/e2e/postgres/ -v
        env:
          DB_BACKEND: postgres
          POSTGRES_DSN: postgresql://postgres:postgres@localhost:54322/postgres
          AGENT_ID: ci-test-agent
          AGENT_TYPE: test_agent
          COORDINATOR_PROFILE: local

  gen-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-coordinator

    services:
      postgres:
        image: paradedb/paradedb:v0.22.2
        ports:
          - 54322:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Apply database migrations
        run: |
          sudo apt-get install -y postgresql-client
          for f in database/migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -f "$f"
          done

      - name: Run gen-eval extraction contract tests
        # test_gen_eval_extraction.py asserts (a) gen_eval.mcp_service is
        # importable with the [mcp] extra, (b) /gen-eval/scenarios responds.
        # The gen-eval unit tests have been relocated to packages/gen-eval/tests/
        # (extract-gen-eval-package wp-package-tests); the gen-eval-tests job
        # below runs them against the package directly.
        run: uv run pytest tests/test_gen_eval_extraction.py -v --tb=short
        env:
          DB_BACKEND: postgres
          POSTGRES_DSN: postgresql://postgres:postgres@localhost:54322/postgres
          GEN_EVAL_DATA_DIR: evaluation

      - name: Start coordinator services
        run: |
          uv run python -m src.coordination_api &
          sleep 3
          curl -sf http://localhost:8081/health || echo "Coordinator not ready"
        env:
          DB_BACKEND: postgres
          POSTGRES_DSN: postgresql://postgres:postgres@localhost:54322/postgres
          AGENT_ID: ci-gen-eval
          AGENT_TYPE: test_agent
          COORDINATION_API_KEYS: test-key
          GEN_EVAL_DATA_DIR: evaluation

  gen-eval-tests:
    # Package-level unit tests for packages/gen-eval/ (task 3.4, D10).
    # Runs in parallel with other jobs; does NOT require a live DB.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/gen-eval

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install gen-eval package with all extras
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ scripts/

      - name: Type-check (mypy)
        run: uv run mypy src/gen_eval/ --strict --ignore-missing-imports
        continue-on-error: true

      - name: Contract schemas are up to date
        # Fails if src/gen_eval/contracts/*.json drifted from the pydantic
        # models they are generated from. tests/test_contract_schemas.py
        # asserts the same thing; this step surfaces it as its own signal
        # with the regeneration command in the log.
        run: uv run python scripts/generate_contract_schemas.py --check

      - name: Tool descriptor matches its CLI contract
        # D2/D3. evaluation/descriptor.yaml is derived from
        # openspec/contracts/gen-eval-framework/cli/gen-eval.yaml; this fails
        # if someone edited the artifact instead of the contract, if the
        # derivation produced an empty declared surface, or if the unit count
        # drifted from what the contract declares.
        #
        # Bare invocation on purpose: --check asserts byte identity against
        # what it would generate from its own argv, so passing flags here that
        # the write step does not (or vice versa) reports drift on a
        # perfectly up-to-date file.
        #
        # No sibling step for generate_service_descriptor.py: it takes
        # --contract and --out as required arguments and this repo checks in
        # no derived service descriptor, because the coordinator OpenAPI
        # contract it would derive from does not exist yet (out of scope by
        # design). Its behaviour is covered by the unit suite above; there is
        # simply no artifact here for it to guard.
        run: uv run python scripts/generate_tool_descriptor.py --check

      - name: Run gen-eval unit tests
        run: uv run pytest -v -m "not e2e and not integration" --tb=short
        env:
          AGENT_ID: ci-gen-eval-pkg

      - name: Dogfood — gen-eval evaluates its own CLI surface
        # Drives the *installed console script* through gen-eval's own
        # descriptor, generator, CLI transport, evaluator and report writer.
        # The unit suite above only ever imports gen_eval and drives Python
        # objects, which is why it never noticed that the console script
        # named by [project.scripts] had been broken in every release (UP-1).
        #
        # Blocking, at --fail-threshold 1.0: this is a contract suite.
        run: make dogfood
        env:
          AGENT_ID: ci-gen-eval-dogfood

      - name: Upload dogfood report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gen-eval-dogfood-report
          path: packages/gen-eval/evaluation/.reports/
          if-no-files-found: ignore

  # Full-capability requirement-traceability sweep (task 5.7, design D12).
  #
  # ONE job on all three declared events (`push` to main, `pull_request`,
  # `merge_group`) — deliberately NOT guarded by an `if:`, because a required
  # check that does not run on `merge_group` is not a check on the merge
  # candidate, and an unguarded job on an event with no rule below is the
  # unfalsifiable green this gate exists to prevent. The event set is
  # normative in the spec delta ("The full sweep blocks opted-in surfaces and
  # reports the rest"), not a CI implementation detail.
  #
  # `pull_request` and `merge_group` derive a change id (or, on `merge_group`,
  # a SET of change ids) from the diff against the event's own base commit and
  # invoke the gate once per id with `--change <id>` — BLOCKING. `push` to
  # main omits `--change` (union of every on-branch delta) and never blocks:
  # a run that fires after the merge cannot stop it going red. Every blocking
  # invocation supplies `--change`; union mode is used by exactly that one
  # non-blocking run — see D12 for why this is an invariant, not a
  # coincidence.
  requirement-traceability-sweep:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Change-id derivation diffs against the PR/merge-group base
          # commit; a shallow clone has no history to diff against.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install gen-eval package
        working-directory: packages/gen-eval
        run: uv sync --all-extras

      - name: Full-capability requirement traceability sweep
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -uo pipefail
          # GitHub Actions runs a `run:` step with no `shell:` key as `bash -e {0}`,
          # so errexit is ON here by default. Every branch below deliberately
          # inspects a command's status rather than dying on it: a diff that touches
          # no change directory is a SKIP at exit 0, the post-merge run must never
          # block whatever the gate returns, and the merge_group loop must visit
          # every batched id instead of stopping at the first failure. Under errexit
          # all three of those collapse into "abort with the gate's status", so turn
          # it off explicitly and check each status by hand. The suite drives this
          # fragment with `bash -e` for the same reason.
          set +e

          TRACE_GATE="packages/gen-eval/scripts/check_traceability.py"
          TRACE_PYTHON="packages/gen-eval/.venv/bin/python"
          if [ ! -f "$TRACE_PYTHON" ]; then TRACE_PYTHON="python3"; fi

          # Change-id derivation (task 5.7). Five conditions, each
          # load-bearing: --no-renames so the derived set does not depend on
          # git's similarity heuristic; --diff-filter=d (exclude deletions) so
          # the source half of an archive `git mv` does not name the change
          # being archived; grep -v archive so the destination half does not
          # name the literal id `archive`. Dropping either of those two breaks a
          # real archive pull request (see design D12's measured table).
          #
          # grep -E '^openspec/changes/[^/]+/' enforces the spec's "under a
          # directory matching openspec/changes/<id>/" literally. Without it the
          # sed leaves a path with no `/` after the changes/ segment untouched, so
          # a file sitting directly under openspec/changes/ is emitted verbatim as
          # though it were a change id, and alongside a real change it trips the
          # ambiguity rule and hard-blocks a single-change pull request.
          #
          # core.quotePath=false because git otherwise C-quotes the WHOLE path when
          # any byte in it is non-ASCII. The leading `"` then fails the anchor
          # above and the change directory is dropped — a blocking gate silently
          # not running, on an ordinary ASCII change id that merely touched a file
          # with an accented name.
          derive_change_ids() {
            # Returns 2 — distinct from "resolved the base and derived nothing" —
            # when git cannot resolve the base commit. Run as a single pipeline the
            # two are indistinguishable: `fatal: bad object` and "grep matched
            # nothing" both arrive as a non-zero status with empty stdout, and the
            # caller then takes the no-change SKIP path on a base it never read.
            # The spec puts those on different exit paths, so the git status is
            # captured on its own before anything is piped.
            local raw
            raw="$(git -c core.quotePath=false diff --no-renames --diff-filter=d --name-only "$1" HEAD \
              -- openspec/changes/)" || return 2
            printf '%s\n' "$raw" \
              | grep -E '^openspec/changes/[^/]+/' \
              | sed 's#^openspec/changes/\([^/]*\)/.*#\1#' \
              | sort -u \
              | grep -v '^archive$'
            return 0
          }

          run_gate() {
            # $1: a change id, or empty string for union mode (--change
            # omitted). Bare invocation, never piped — a pipeline's $? is the
            # last stage's status.
            if [ -n "$1" ]; then
              "$TRACE_PYTHON" "$TRACE_GATE" --scope capability --change "$1"
            else
              "$TRACE_PYTHON" "$TRACE_GATE" --scope capability
            fi
          }

          case "$EVENT_NAME" in
            pull_request)
              if [ -z "${PR_BASE_SHA:-}" ]; then
                echo "::error::requirement-traceability sweep: unresolvable base for pull_request (github.event.pull_request.base.sha is empty)"
                exit 1
              fi
              CHANGE_IDS="$(derive_change_ids "$PR_BASE_SHA")"
              if [ $? -eq 2 ]; then
                echo "::error::requirement-traceability sweep: unresolvable base for pull_request (github.event.pull_request.base.sha='$PR_BASE_SHA' could not be resolved against this checkout)"
                exit 1
              fi
              if [ -z "$CHANGE_IDS" ]; then
                echo "SKIP: requirement-traceability sweep — no openspec/changes/<id>/ directory touched on ${PR_HEAD_REF:-this branch}"
                exit 0
              fi
              COUNT=$(printf '%s\n' "$CHANGE_IDS" | grep -c .)
              if [ "$COUNT" -gt 1 ]; then
                echo "::error::requirement-traceability sweep: ambiguous — pull request touches multiple change directories: $(printf '%s' "$CHANGE_IDS" | tr '\n' ' ')"
                exit 1
              fi
              run_gate "$CHANGE_IDS"
              exit $?
              ;;
            merge_group)
              if [ -z "${MERGE_GROUP_BASE_SHA:-}" ]; then
                echo "::error::requirement-traceability sweep: unresolvable base for merge_group (github.event.merge_group.base_sha is empty)"
                exit 1
              fi
              CHANGE_IDS="$(derive_change_ids "$MERGE_GROUP_BASE_SHA")"
              if [ $? -eq 2 ]; then
                echo "::error::requirement-traceability sweep: unresolvable base for merge_group (github.event.merge_group.base_sha='$MERGE_GROUP_BASE_SHA' could not be resolved against this checkout)"
                exit 1
              fi
              if [ -z "$CHANGE_IDS" ]; then
                echo "SKIP: requirement-traceability sweep — no openspec/changes/<id>/ directory touched in merge group ${MERGE_GROUP_REF:-<unknown>}"
                exit 0
              fi
              # No ambiguity rule here: a merge group's diff spans every
              # batched pull request, so several change directories is the
              # ordinary case. Iterate and block if any invocation fails.
              OVERALL=0
              while IFS= read -r id; do
                [ -z "$id" ] && continue
                echo "requirement-traceability sweep: evaluating batched change '$id'"
                run_gate "$id"
                [ $? -ne 0 ] && OVERALL=1
              done <<< "$CHANGE_IDS"
              exit "$OVERALL"
              ;;
            push)
              # Union mode: every on-branch delta shadows the archive at once.
              # Report-only — its exit status must not depend on what it found.
              echo "requirement-traceability sweep: post-merge report (union of every on-branch delta, non-blocking)"
              run_gate ""
              echo "requirement-traceability sweep: post-merge run never blocks; exiting 0 regardless of the result above"
              exit 0
              ;;
            *)
              echo "::error::requirement-traceability sweep: unhandled event '$EVENT_NAME' — no rule for this trigger"
              exit 1
              ;;
          esac
