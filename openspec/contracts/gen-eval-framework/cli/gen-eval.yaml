# gen-eval's own CLI contract (design D8).
#
# Ground truth for deriving gen-eval's tool descriptor. This is the flat
# flag-only archetype: one command with an empty name, whose flags are the
# coverage units. There are no subcommands to name, which is exactly why the
# interface model needed flag-level identifiers — see the "flag-only CLIs have
# no nameable interfaces" limitation recorded in evaluation/README.md.
#
# Validates against ../schemas/cli-contract.schema.json.
#
# `--help` is deliberately NOT declared. argparse supplies it rather than the
# application, and D11's coverage arithmetic counts the 17 application-declared
# long flags. The argparse subset verifier (task 4.7) must treat it as a
# declared exclusion, not an undocumented flag.

contract_version: "1"

tool:
  name: gen-eval
  executable: gen-eval
  description: >-
    Generator-evaluator framework for agentic-system testing. Runs
    scenario-driven behavioural tests against live services and emits
    structured verdicts.

commands:
  - name: ""
    description: >-
      gen-eval has no subcommands. The single invocation form is
      `gen-eval --descriptor <path> [options]`, equivalently
      `python -m gen_eval --descriptor <path> [...]`.

    flags:
      - name: --print-contract-version
        type: boolean
        short_circuits: true
        description: >-
          Print the published JSON Schema contract version (one line) and exit
          0. Short-circuits before --descriptor is enforced, so a consumer can
          probe an arbitrary gen-eval on PATH without owning a descriptor.
        traceability:
          requirements:
            - gen-eval-framework.descriptor-reclamation-is-announced

      - name: --descriptor
        type: path
        required: true
        description: Path to the interface descriptor YAML.
        traceability:
          requirements:
            - gen-eval-framework.interface-descriptor
            - gen-eval-framework.contract-as-descriptor-source-of-truth
            - gen-eval-framework.service-and-tool-descriptor-archetypes

      - name: --mode
        type: enum
        choices:
          - template-only
          - cli-augmented
          - sdk-only
        default: template-only
        description: Generator mode.
        traceability:
          requirements:
            - gen-eval-framework.scenario-generation

      - name: --cli-command
        type: string
        default: claude
        description: CLI tool for cli-augmented mode.
        traceability:
          requirements:
            - gen-eval-framework.scenario-generation

      - name: --time-budget
        type: number
        default: 60.0
        description: Time budget in minutes for CLI mode.
        traceability:
          requirements:
            - gen-eval-framework.budget-management

      - name: --sdk-budget
        type: number
        description: USD budget cap for SDK mode.
        traceability:
          requirements:
            - gen-eval-framework.budget-management

      - name: --max-iterations
        type: integer
        default: 1
        description: Feedback loop iterations.
        traceability:
          requirements:
            - gen-eval-framework.feedback-loop

      - name: --parallel
        type: integer
        default: 5
        description: Concurrent scenario execution.
        traceability:
          requirements:
            - gen-eval-framework.orchestration

      - name: --changed-features-ref
        type: string
        description: Git ref for change detection; filters scenarios to changed features.
        traceability:
          requirements:
            - gen-eval-framework.orchestration
            - gen-eval-framework.scenario-generation

      - name: --categories
        type: string
        repeatable: true
        description: >-
          Filter to specific scenario categories. Declared repeatable because
          argparse binds it with nargs="*" — an array parameter reached by
          repeating the flag rather than by a delimited value.
        traceability:
          requirements:
            - gen-eval-framework.scenario-model
            - gen-eval-framework.scenario-generation

      - name: --report-format
        type: enum
        choices:
          - markdown
          - json
          - both
        default: both
        description: Report output format.
        traceability:
          requirements:
            - gen-eval-framework.orchestration

      - name: --output-dir
        type: path
        default: "."
        description: Report output directory.
        traceability:
          requirements:
            - gen-eval-framework.orchestration

      - name: --verbose
        type: boolean
        default: false
        description: Enable verbose output.
        traceability:
          excluded:
            reason: >-
              Diagnostic output only; serves no contracted behaviour. Neither
              annotation model nor the operator found a governing requirement.

      - name: --no-services
        type: boolean
        default: false
        description: >-
          Skip service startup and teardown, assuming services are already
          running. The health check still runs, so an unreachable service is
          still caught.
        traceability:
          requirements:
            - gen-eval-framework.orchestration
            - gen-eval-framework.interface-descriptor

      - name: --fail-threshold
        type: number
        default: 0.95
        description: >-
          Minimum pass rate to exit 0. A run that evaluated zero scenarios
          always exits 1 regardless of this value.
        traceability:
          requirements:
            - gen-eval-framework.pass-rate-gating-governs-exit-status

      - name: --min-coverage
        type: number
        default: 0.0
        description: >-
          Minimum interface coverage to exit 0, as a PERCENT (0-100) — the same
          number the report prints, unlike --fail-threshold which is a rate.
          Checked independently of the pass rate: a run that gets every answer
          right on a tenth of the declared surface fails this gate. Default 0,
          which gates nothing. Values between 0 and 1 are rejected as a usage
          error: they are almost always a rate typed into a percent flag, and
          as a percent they would pass silently.
        traceability:
          requirements:
            - gen-eval-framework.operation-and-surface-coverage-model
            - gen-eval-framework.orchestration

      - name: --openspec-change
        type: string
        description: >-
          OpenSpec change-id whose Requirement+Scenario blocks augment the
          cli-augmented prompt as constraints. Must match ^[a-zA-Z0-9_-]+$;
          effective only with --mode cli-augmented.
        traceability:
          requirements:
            - gen-eval-framework.multi-source-scenario-bootstrap

exit_codes:
  - code: 0
    meaning: Pass rate met --fail-threshold.
  - code: 1
    meaning: >-
      Pass rate below --fail-threshold, or no scenarios were evaluated.
      Vacuous success is guarded explicitly rather than left to threshold
      arithmetic.
  - code: 2
    meaning: Argparse usage error, e.g. missing --descriptor.
  - code: 64
    meaning: --openspec-change failed validation.
    sysexits_name: EX_USAGE
