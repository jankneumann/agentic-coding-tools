    reason: >-
      Served by the framework engine; the CLI contract exposes no flag surface
      for this behaviour — it is exercised by every run, not configured by any
      flag.
  - requirement: gen-eval-framework.descriptor-model-naming-levels
    reason: >-
      A naming rule over the package's published Python type names (`*Spec` for
      one surface element or a per-surface container, `*Descriptor` for a whole
      document). It constrains what the library's symbols are called, not what
      any HTTP operation does; the contract has no surface that could cite it.
      Enforced instead by the type names themselves and by the import test that
      the requirement's own second scenario describes.
  - requirement: gen-eval-framework.distributable-python-package
    reason: >-
      A packaging rule — the framework builds and installs as a standalone
      distribution. Served by `pyproject.toml`, the wheel build and its
      install test; the CLI is a consumer of that packaging, not a surface
      that configures it.
  - requirement: gen-eval-framework.documented-consumer-adoption-contract
    reason: >-
      A documentation obligation: consumers are told how to depend on the
      package. Served by the package README and the adoption docs, which no
      contracted operation exposes.
