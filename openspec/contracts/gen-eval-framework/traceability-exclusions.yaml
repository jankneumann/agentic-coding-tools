# Reverse-traceability exclusions for gen-eval-framework (D13).
# Every entry is one operator decision; reasons are the artifact.
# Managed by skills/cite-requirements — hand edits are fine, the
# walkthrough re-reads this file and never overwrites reasons.
exclusions:
  - requirement: gen-eval-framework.behavioral-findings-schema-conformance
    reason: >-
      A conformance rule over the JSON the findings emitter writes
      (`review-findings.schema.json`). It constrains output shape, which every
      run produces and no flag selects; the emitter and its schema test serve
      it, not the CLI surface.
  - requirement: gen-eval-framework.browser-driving-behavioral-validation-via-playwright-cli
    reason: >-
      Served by the `playwright-validator` peer skill, packaged separately per
      design D2 of factory-missions-architecture-alignment precisely so its
      Node and browser-binary dependencies stay out of the gen-eval Python
      runtime. The gen-eval CLI dispatches to it; it exposes no flag of its
      own for the browser-driving behaviour.
  - requirement: gen-eval-framework.canonical-module-name-gen-eval
    reason: >-
      A rule about the package's importable top-level module name (`gen_eval`).
      It is served by the package layout and `pyproject.toml`, and verified at
      import time; no CLI invocation can configure or observe it.
  - requirement: gen-eval-framework.citations-may-name-requirements-in-another-capability
    reason: >-
      Served by the traceability gate (check_traceability.py) and its CI
      wiring, not by the gen-eval CLI; this contract exposes no surface for
      it.
  - requirement: gen-eval-framework.completeness-is-evaluated-per-capability
    reason: >-
      Served by the traceability gate (check_traceability.py) and its CI
