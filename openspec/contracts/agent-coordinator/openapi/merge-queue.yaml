# agent-coordinator merge-queue contract (task 5.1, trace-requirements-to-contracts;
# extended and opted in by the issue #377 attribution change).
#
# AUTHORED FROM openspec/specs/agent-coordinator/spec.md — NOT generated from
# the running application (D1; app.openapi() describing itself would verify a
# copy against itself). Operation descriptions cite spec line provenance as of
# the issue #377 attribution change. FORWARD-ENFORCED (D6): every operation
# carries an x-traceability block.
openapi: 3.1.0
info:
  title: "agent-coordinator: Merge queue"
  version: 1.0.0
  description: >-
    Merge queue lifecycle: enqueue, listing, pre-merge checks, next-to-merge,
    merged, and removal. Spec lines 1479-1489, 2003-2009 (HTTP-10).
paths:
  /merge-queue:
    get:
      operationId: getMergeQueue
      summary: List queued features in priority order
      description: >-
        Spec 1484-1485: with a valid API key returns a JSON array of queued
        features in priority order.
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.merge-queue-http-endpoints
      responses:
        "200": {description: Queued features in priority order (spec 1485)}
  /merge-queue/check/{feature_id}:
    post:
      operationId: runPreMergeChecks
      summary: Run pre-merge checks for a feature
      description: >-
        Spec 1488-1489: with a valid API key returns a JSON object with
        passed, checks, issues, and conflicts fields.
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.merge-queue-http-endpoints
      parameters:
        - name: feature_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Pre-merge check result (spec 1489)
          content:
            application/json:
              schema:
                type: object
                properties:
                  passed: {type: boolean}
                  checks: {type: array, items: {type: object}}
                  issues: {type: array, items: {type: object}}
                  conflicts: {type: array, items: {type: object}}
  /merge-queue/enqueue:
    post:
      operationId: enqueueMerge
      summary: Add a registered feature to the merge queue
      description: >-
        Spec 2006 (HTTP-10): adds a registered feature to the merge queue,
        mirroring the enqueue_merge MCP tool (spec 1469-1477). Spec 2605-2620
        (R13): accepts the decomposition parameter for stacked-diff features.
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.merge-queue-http-endpoints
          - agent-coordinator.merge-queue-enqueue-decomposition-parameter-r13
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature_id]
              properties:
                feature_id: {type: string}
      responses:
        "200": {description: Queue entry with feature_id, merge_status, and merge_priority (spec 1471)}
        "401": {description: Missing or invalid X-API-Key}
  /merge-queue/next:
    get:
      operationId: getNextMerge
      summary: Get the highest-priority feature ready to merge
      description: >-
        Spec 2007 (HTTP-10): returns the highest-priority feature ready to
        merge, mirroring the get_next_merge MCP tool (spec 1469).
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.merge-queue-http-endpoints
      responses:
        "200": {description: Next feature ready to merge, or an empty result (spec 2007)}
  /merge-queue/merged/{feature_id}:
    post:
      operationId: markMerged
      summary: Mark a feature merged and deregister it
      description: >-
        Spec 2008 (HTTP-10): marks a feature merged and deregisters it,
        mirroring the mark_merged MCP tool (spec 1469).
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.merge-queue-http-endpoints
      parameters:
        - name: feature_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Merge recorded and feature deregistered (spec 2008)}
        "401": {description: Missing or invalid X-API-Key}
  /merge-queue/{feature_id}:
    delete:
      operationId: removeFromMergeQueue
      summary: Remove a feature from the queue without merging
      description: >-
        Spec 2009 (HTTP-10): removes a feature from the queue without merging,
        mirroring the remove_from_merge_queue MCP tool (spec 1469).
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.merge-queue-http-endpoints
      parameters:
        - name: feature_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Feature removed from the queue (spec 2009)}
        "401": {description: Missing or invalid X-API-Key}
components:
  securitySchemes:
    coordinatorApiKey:
      type: apiKey
      in: header
      name: X-API-Key
