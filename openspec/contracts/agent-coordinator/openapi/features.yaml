# agent-coordinator features contract (task 5.1, trace-requirements-to-contracts;
# extended and opted in by the issue #377 attribution change).
#
# AUTHORED FROM openspec/specs/agent-coordinator/spec.md — NOT generated from
# the running application (D1; app.openapi() describing itself would verify a
# copy against itself). Operation descriptions cite spec line provenance as of
# the issue #377 attribution change. FORWARD-ENFORCED (D6): every operation
# carries an x-traceability block.
openapi: 3.1.0
info:
  title: "agent-coordinator: Feature registry"
  version: 1.0.0
  description: >-
    Feature registration, conflict analysis, and active-feature listing.
    Spec lines 1455-1465, 1995-2001 (HTTP-9).
paths:
  /features/active:
    get:
      operationId: listActiveFeatures
      summary: List active features by merge priority
      description: >-
        Spec 1460-1461: with a valid API key returns a JSON array of active
        features ordered by merge priority. Spec 1464-1465: without an API key
        returns 401.
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.feature-registry-http-endpoints
      responses:
        "200": {description: Active features ordered by merge priority (spec 1461)}
        "401": {description: Missing API key (spec 1464-1465)}
  /features/register:
    post:
      operationId: registerFeature
      summary: Register a feature with its resource claims
      description: >-
        Spec 1998 (HTTP-9): registers a feature with its resource claims.
        Spec 1445-1451: mirrors the register_feature MCP tool delegating to
        FeatureRegistryService.register().
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.feature-registry-http-endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature_id, resource_claims]
              properties:
                feature_id: {type: string}
                resource_claims: {type: array, items: {type: string}}
                title: {type: string}
      responses:
        "200": {description: Registration result with success, feature_id, and action (spec 1448)}
        "401": {description: Missing or invalid X-API-Key}
  /features/deregister:
    post:
      operationId: deregisterFeature
      summary: Deregister a completed or cancelled feature
      description: >-
        Spec 1999 (HTTP-9): deregisters a completed or cancelled feature,
        mirroring the deregister_feature MCP tool (spec 1445).
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.feature-registry-http-endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature_id]
              properties:
                feature_id: {type: string}
      responses:
        "200": {description: Deregistration result (spec 1999)}
        "401": {description: Missing or invalid X-API-Key}
  /features/{feature_id}:
    get:
      operationId: getFeature
      summary: Get a single feature's details
      description: >-
        Spec 2000 (HTTP-9): returns a single feature's details, mirroring the
        get_feature MCP tool (spec 1445).
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.feature-registry-http-endpoints
      parameters:
        - name: feature_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Feature details (spec 2000)}
        "404": {description: Unknown feature_id}
  /features/conflicts:
    post:
      operationId: analyzeFeatureConflicts
      summary: Analyze resource conflicts against active features
      description: >-
        Spec 2001 (HTTP-9): analyzes resource conflicts between a candidate
        feature and active features, mirroring the analyze_feature_conflicts
        MCP tool (spec 1445).
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.feature-registry-http-endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200": {description: Conflict analysis result (spec 2001)}
        "401": {description: Missing or invalid X-API-Key}
components:
  securitySchemes:
    coordinatorApiKey:
      type: apiKey
      in: header
      name: X-API-Key
