# agent-coordinator work-queue contract (issue #377 attribution change).
#
# AUTHORED FROM openspec/specs/agent-coordinator/spec.md — NOT generated from
# the running application (D1; app.openapi() describing itself would verify a
# copy against itself). Operation descriptions cite spec line provenance as of
# the issue #377 attribution change. FORWARD-ENFORCED (D6): every operation
# carries an x-traceability block.
openapi: 3.1.0
info:
  title: "agent-coordinator: Work queue"
  version: 2.0.0
  description: >-
    Task claiming, completion, submission, and unclaimed reads. Spec lines
    114-145, 941-963, 1950-1956 (HTTP-7).
paths:
  /work/claim:
    post:
      operationId: claimWork
      summary: Atomically claim the highest-priority eligible task
      description: >-
        Spec 1953 (HTTP-7): atomically claims the highest-priority eligible
        task. Spec 123-126: returns task_id, task_type, task_description, and
        input_data on success. Spec 128-130: with no eligible tasks returns
        success false with reason no_tasks_available. Spec 142-144: tasks with
        unmet dependencies are never returned.
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.work-queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_types: {type: array, items: {type: string}}
      responses:
        "200": {description: Claimed task or no_tasks_available (spec 123-130)}
        "401": {description: Missing or invalid X-API-Key}
  /work/complete:
    post:
      operationId: completeWork
      summary: Mark a claimed task completed or failed
      description: >-
        Spec 1954 (HTTP-7): marks a claimed task completed or failed.
        Spec 132-135: returns success with status completed, and dependent
        tasks become unblocked if applicable.
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.work-queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, success]
              properties:
                task_id: {type: string}
                success: {type: boolean}
                result: {type: object}
                error_message: {type: string}
      responses:
        "200": {description: Completion recorded, dependents unblocked (spec 133-135)}
        "401": {description: Missing or invalid X-API-Key}
  /work/submit:
    post:
      operationId: submitWork
      summary: Create a new task in the queue
      description: >-
        Spec 1955 (HTTP-7): creates a new task in the queue. Spec 137-139:
        returns success with the new task_id.
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.work-queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_type, task_description]
              properties:
                task_type: {type: string}
                task_description: {type: string}
                input_data: {type: object}
                priority: {type: integer}
                depends_on: {type: array, items: {type: string}}
                agent_requirements: {type: object}
                projection_key:
                  $ref: "#/components/schemas/ProjectionKey"
      responses:
        "200":
          description: Task created with its task_id (spec 138-139)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionMutationResult"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "409":
          $ref: "#/components/responses/Problem409"
        "422":
          $ref: "#/components/responses/Problem422"
  /work/reconcile:
    post:
      operationId: reconcileWorkProjection
      summary: Reconcile one authoritative projection generation
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - skill-workflow.coordinated-autopilot-phase-projection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projection_key, task_type, task_description]
              properties:
                projection_key:
                  $ref: "#/components/schemas/ProjectionKey"
                task_type: {type: string}
                task_description: {type: string}
                input_data: {type: object}
                priority: {type: integer}
                agent_requirements: {type: object}
      responses:
        "200":
          description: Canonical generation ensured and stale rows cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionMutationResult"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "409":
          $ref: "#/components/responses/Problem409"
        "422":
          $ref: "#/components/responses/Problem422"
  /work/get:
    post:
      operationId: getWork
      summary: Read a task's current state without claiming it
      description: >-
        Spec 1956 (HTTP-7): returns a task's current state by task_id without
        claiming it. Spec 943-947 (Task Read API): the response includes
        task_id, task_type, status, input_data, result, error_message,
        priority, created_at, and completed_at, and reading never changes
        status or ownership.
      security:
        - coordinatorApiKey: []
      x-traceability:
        requirements:
          - agent-coordinator.complete-http-api-coverage
          - agent-coordinator.task-read-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id: {type: string}
      responses:
        "200": {description: Task state without claiming (spec 943-947)}
        "401": {description: Missing or invalid X-API-Key}
        "404": {description: Unknown task_id (spec 955-957)}
components:
  schemas:
    ProjectionKey:
      type: object
      additionalProperties: false
      required: [change_id, phase, transition_sequence]
      properties:
        change_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,127}$"
        phase:
          type: string
          enum: [INIT, GATEKEEPER, PLAN, PLAN_ITERATE, PLAN_REVIEW, PLAN_FIX, IMPLEMENT, IMPL_ITERATE, IMPL_REVIEW, IMPL_FIX, VALIDATE, VAL_REVIEW, VAL_FIX, SUBMIT_PR, ESCALATE, DONE]
        transition_sequence:
          type: integer
          minimum: 0
          maximum: 2147483647
    ProjectionMutationResult:
      type: object
      required: [success, task_id]
      properties:
        success: {type: boolean}
        task_id: {type: string}
        created: {type: boolean}
        deduplicated: {type: boolean}
        status: {type: string}
        cancelled_task_ids:
          type: array
          items: {type: string}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
  responses:
    Problem401:
      description: Projection authentication required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem403:
      description: Projection operation forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem409:
      description: Projection generation conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem422:
      description: Projection request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  securitySchemes:
    coordinatorApiKey:
      type: apiKey
      in: header
      name: X-API-Key
