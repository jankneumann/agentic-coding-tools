openapi: 3.1.0
info:
  title: "agent-coordinator: Agent discovery"
  version: 1.0.0
  description: >-
    Agent registration, listing, heartbeat, and cleanup. Spec lines 1922-1929, 2817, 2829.
paths:
  /discovery/register:
    post:
      operationId: registerAgent
      summary: Register an agent
      description: 'Spec 1924: accepts agent registration; requires API key.'
      security:
        - coordinatorApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: Agent registered (spec 1924)}
  /discovery/agents:
    get:
      operationId: listActiveAgents
      summary: List active agents
      description: >-
        Spec 1925: returns active agents. Spec 2817, 2829: each AgentInfo
        record exposes phase_archetype.
      responses:
        "200": {description: Active agents with phase_archetype per AgentInfo (spec 1925, 2817)}
  /discovery/heartbeat:
    post:
      operationId: agentHeartbeat
      summary: Update an agent's heartbeat
      description: 'Spec 1926: updates agent heartbeat; requires API key.'
      security:
        - coordinatorApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: Heartbeat updated (spec 1926)}
  /discovery/cleanup:
    post:
      operationId: cleanupDeadAgents
      summary: Remove dead agents
      description: 'Spec 1927: removes dead agents; requires API key.'
      security:
        - coordinatorApiKey: []
      responses:
        "200": {description: Dead agents removed (spec 1927)}
components:
  securitySchemes:
    coordinatorApiKey:
      type: apiKey
      in: header
      name: X-API-Key
