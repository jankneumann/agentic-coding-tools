schema_version: 1

feature:
  id: add-the-shared-system-one-decision-helper-fallback-only
  title: "system-one-decisions — fallback-only decision helper"
  plan_revision: 1
  created_by: claude-code

contracts:
  revision: 1
  openapi:
    # No OpenAPI surface — pure Python library. README is the contracts
    # entrypoint per repo convention.
    primary: "openspec/changes/add-the-shared-system-one-decision-helper-fallback-only/contracts/README.md"
    files:
      - "openspec/changes/add-the-shared-system-one-decision-helper-fallback-only/contracts/README.md"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 60
  retry_budget: 2
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-main
    title: "system-one-decisions — fallback-only helper, full scope"
    task_type: implementation
    description: |
      Create packages/system-one-decisions with Decision, decide (stub), and
      decide_intent (always-fallback), and declare it as a dependency from the
      three consuming runtimes (skills venv, gen-eval's decisions extra,
      coordinator path dependency + Dockerfile COPY). Single-package scope
      with no internal parallelism to decompose.
    role: implementer
    archetype: implementer
    priority: 1
    depends_on: []
    locks:
      files:
        - "skills/pyproject.toml"
        - "packages/gen-eval/pyproject.toml"
        - "agent-coordinator/pyproject.toml"
        - "agent-coordinator/Dockerfile"
      keys:
        - "feature:add-the-shared-system-one-decision-helper-fallback-only:main"
      ttl_minutes: 120
      reason: "Full-scope implementation of the fallback-only decision helper"
    scope:
      write_allow:
        - "packages/system-one-decisions/**"
        - "skills/pyproject.toml"
        - "skills/uv.lock"
        - "packages/gen-eval/pyproject.toml"
        - "agent-coordinator/pyproject.toml"
        - "agent-coordinator/Dockerfile"
        - "agent-coordinator/uv.lock"
        # Corrected during implementation: proving "docker-smoke-import
        # covers `import system_one_decisions`" (this item's own acceptance
        # outcome) requires adding the module to that CI job's assertion
        # list, not just wiring the Dockerfile. Lockfiles are regenerated by
        # `uv lock`/`uv sync`, never hand-edited.
        - ".github/workflows/ci.yml"
      read_allow:
        - "**"
      deny: []
    worktree:
      name: system-one-decisions-wp-main
      mode: isolated
    timeout_minutes: 60
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "system-one-decisions test suite is green"
          kind: command
          command: "python3 -m pytest packages/system-one-decisions/tests -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "system_one_decisions_tests_green"
        - name: "Package imports with zero optional extras"
          kind: command
          command: "bash -c 'cd /tmp && python3 -m venv .s1d-smoke && .s1d-smoke/bin/pip install -q /home/user/agentic-coding-tools/packages/system-one-decisions && .s1d-smoke/bin/python -c \"import system_one_decisions\"'"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "system_one_decisions_import_clean"
    outputs:
      result_keys:
        - "system_one_decisions_tests_green"
        - "system_one_decisions_import_clean"
