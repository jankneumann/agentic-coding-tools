schema_version: 1

feature:
  id: retain-static-model-until-routing-evidence
  title: "Retain the static model until routing evidence exists"
  plan_revision: 1
  created_by: claude_code
  created_at: "2026-09-23T00:00:00Z"
  deployable: true

contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/retain-static-model-until-routing-evidence/contracts/openapi/v1.2.yaml"
    files:
      - "openspec/changes/retain-static-model-until-routing-evidence/contracts/openapi/v1.2.yaml"
      - "openspec/changes/retain-static-model-until-routing-evidence/contracts/events/routing-decision-record.schema.json"
      - "openspec/changes/retain-static-model-until-routing-evidence/contracts/generated/models.py"

defaults:
  priority: 5
  lock_ttl_minutes: 180
  timeout_minutes: 120
  retry_budget: 1
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-main
    title: "Evidence-gated incumbent retention in select_model, forwarded from phase resolution"
    task_type: implementation
    description: >-
      Single sequential package, chosen by the user at planning. The task graph is a chain:
      evidence predicate, then retention core, then exploration gating, then service/API wiring,
      then MCP/HTTP parity, then client forwarding. Every step reads the previous step's function
      signature, and all of it sits in one module (model_routing) plus two thin surfaces, so a
      split would only produce packages blocked on each other.
    role: implementation
    priority: 1
    depends_on: []
    timeout_minutes: 180
    retry_budget: 1
    min_trust_level: 2
    locks:
      files:
        - "agent-coordinator/src/model_routing/api.py"
        - "agent-coordinator/src/model_routing/resolver.py"
        - "agent-coordinator/src/model_routing/exploration.py"
        - "agent-coordinator/src/agents_config.py"
        - "agent-coordinator/src/coordination_mcp.py"
        - "agent-coordinator/src/http_proxy.py"
      keys:
        - "api:POST /routing/select_model"
      ttl_minutes: 180
      reason: "Incumbent retention changes select_model request/response and phase delegation"
    scope:
      write_allow:
        - "agent-coordinator/src/model_routing/**"
        - "agent-coordinator/src/agents_config.py"
        - "agent-coordinator/src/coordination_mcp.py"
        - "agent-coordinator/src/http_proxy.py"
        - "agent-coordinator/tests/**"
        - "agent-coordinator/CLAUDE.md"
        - "openspec/changes/retain-static-model-until-routing-evidence/**"
      read_allow:
        - "**"
      deny:
        - "openspec/specs/**"
        - "openspec/changes/archive/**"
        - "skills/**"
    context_impact:
      surfaces:
        - "apis"               # contracts/openapi/v1.2.yaml, MCP tool signature
        - "capabilities"       # specs/model-routing, specs/agent-archetypes
        - "semantic_code"      # model_routing service, resolver, exploration, agents_config
        - "documentation"      # agent-coordinator/CLAUDE.md env var
    worktree:
      name: wp-main
      mode: isolated
    verification:
      tier_required: B
      steps:
        - name: "Model-routing and phase-resolution suites"
          kind: command
          command: "cd agent-coordinator && uv run pytest tests/model_routing tests/test_phase_archetype_resolution.py -q"
          evidence:
            artifacts:
              - "agent-coordinator/tests/model_routing/test_resolver.py"
              - "agent-coordinator/tests/model_routing/test_service.py"
              - "agent-coordinator/tests/model_routing/test_delegation.py"
            result_keys: ["routing_suites_pass"]
        - name: "Coordinator unit suite"
          kind: command
          command: "cd agent-coordinator && uv run pytest -m 'not e2e and not integration' -q"
          evidence:
            artifacts:
              - "agent-coordinator/tests"
            result_keys: ["coordinator_suite_pass"]
        - name: "Strict typing"
          kind: command
          command: "cd agent-coordinator && uv run mypy --strict src/"
          evidence:
            artifacts:
              - "agent-coordinator/src/model_routing"
            result_keys: ["mypy_clean"]
        - name: "Lint"
          kind: command
          command: "cd agent-coordinator && uv run ruff check ."
          evidence:
            artifacts:
              - "agent-coordinator/src/model_routing"
            result_keys: ["ruff_clean"]
    outputs:
      result_keys: ["routing_suites_pass", "coordinator_suite_pass", "mypy_clean", "ruff_clean"]
    metadata:
      loc_estimate: 450
      package_kind: backend
