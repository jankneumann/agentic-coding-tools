schema_version: 1

feature:
  id: route-parked-escalations-through-the-escalate-resume-gate
  title: "Route parked escalations through the escalate-resume gate"
  plan_revision: 1
  created_by: autopilot-roadmap
  deployable: false

contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/route-parked-escalations-through-the-escalate-resume-gate/contracts/README.md"
    files:
      - "openspec/changes/route-parked-escalations-through-the-escalate-resume-gate/contracts/README.md"

defaults:
  priority: 2
  lock_ttl_minutes: 90
  timeout_minutes: 90
  retry_budget: 2
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-escalation-routing
    title: "Persisted policy-pause escalation routing"
    task_type: implementation
    description: |
      Add TDD coverage and wire newly persisted supervised policy pauses through
      gate_router.resolve_parked, returning a bounded resolution summary and
      documenting the immediate route in the supervise skill.
    role: implementer
    priority: 1
    depends_on: []
    locks:
      files:
        - "skills/supervise/scripts/execution.py"
        - "skills/supervise/SKILL.md"
      keys:
        - "feature:route-parked-escalations-through-the-escalate-resume-gate:write"
        - "contract:supervise.escalation-routing"
      ttl_minutes: 90
      reason: "Single post-persist gate-routing seam"
    scope:
      write_allow:
        - "skills/supervise/scripts/execution.py"
        - "skills/supervise/SKILL.md"
        - "skills/tests/supervise/**"
        - "openspec/changes/route-parked-escalations-through-the-escalate-resume-gate/**"
        - ".claude/skills/supervise/**"
        - ".agents/skills/supervise/**"
        - "docs/decisions/**"
      read_allow:
        - "**"
      deny:
        - "**/.venv/**"
    context_impact:
      surfaces:
        - "semantic_code"
        - "documentation"
        - "capabilities"
        - "decisions"
    worktree:
      name: escalation-routing
      mode: isolated
    timeout_minutes: 120
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Supervise routing suite"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/supervise -q"
          evidence:
            artifacts: []
            result_keys: ["supervise_suite"]
        - name: "Affected orchestration recovery suites"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/autopilot-roadmap skills/tests/phase-record-compaction/test_phase_agent_recovery.py -q"
          evidence:
            artifacts: []
            result_keys: ["orchestration_suite"]
        - name: "Strict change validation"
          kind: command
          command: "openspec validate route-parked-escalations-through-the-escalate-resume-gate --strict"
          evidence:
            artifacts: []
            result_keys: ["openspec_strict"]
    metadata:
      loc_estimate: 180
      complexity: low
      package_kind: integration
    outputs:
      result_keys: ["supervise_suite", "orchestration_suite", "openspec_strict"]
