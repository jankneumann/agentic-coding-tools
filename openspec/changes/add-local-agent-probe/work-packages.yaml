schema_version: 1
feature:
  id: add-local-agent-probe
  title: "Tiered local vendor CLI probe with per-machine cache"
  plan_revision: 2
  created_by: claude_code
  deployable: false
contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/add-local-agent-probe/contracts/cli-probe-block.schema.json"
    files:
      - "openspec/changes/add-local-agent-probe/contracts/cli-probe-block.schema.json"
      - "openspec/changes/add-local-agent-probe/contracts/vendor-probe-cache.schema.json"
      - "openspec/changes/add-local-agent-probe/contracts/README.md"
defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 90
  retry_budget: 1
  verification_tier_required: B
  min_trust_level: 2
packages:
  - package_id: wp-contracts
    title: "Probe block and cache contracts"
    task_type: contracts
    description: "Tasks 1.1 — contract tests pinning accept/reject cases for both schemas."
    role: contracts-author
    priority: 1
    depends_on: []
    locks:
      files: []
      keys: ["contract:vendor-probe-cache", "contract:agents-yaml-cli-probe"]
      ttl_minutes: 60
      reason: "Canonical probe contract boundary"
    scope:
      write_allow:
        - "openspec/changes/add-local-agent-probe/contracts/**"
        - "skills/tests/parallel-infrastructure/test_vendor_probe_contracts.py"
      read_allow: ["**"]
    worktree: {name: probe-contracts, mode: isolated}
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: C
      steps:
        - name: "Contract tests"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/parallel-infrastructure/test_vendor_probe_contracts.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [contract_tests_passed]}
    metadata: {loc_estimate: 150, complexity: low, package_kind: config}
    inputs: {}
    outputs: {result_keys: [contract_tests_passed]}

  - package_id: wp-probe-core
    title: "vendor_probe.py tiers, cache and report"
    task_type: backend
    description: "Tasks 2.1-2.8 — stdlib-only tiered probe, per-user cache, report CLI."
    role: backend-implementer
    archetype: implementer
    priority: 2
    depends_on: [wp-contracts]
    locks:
      files: ["skills/parallel-infrastructure/scripts/vendor_probe.py"]
      keys: ["contract:vendor-probe-cache"]
      ttl_minutes: 120
      reason: "New probe module"
    scope:
      write_allow:
        - "skills/parallel-infrastructure/scripts/vendor_probe.py"
        - "skills/tests/parallel-infrastructure/test_vendor_probe.py"
        - "skills/tests/parallel-infrastructure/test_vendor_probe_cache.py"
        - "skills/tests/parallel-infrastructure/test_vendor_probe_report.py"
      read_allow: ["**"]
    worktree: {name: probe-core, mode: isolated}
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Probe unit tests"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/parallel-infrastructure/test_vendor_probe.py skills/tests/parallel-infrastructure/test_vendor_probe_cache.py skills/tests/parallel-infrastructure/test_vendor_probe_report.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [probe_tests_passed]}
        - name: "Probe lint"
          kind: command
          command: "skills/.venv/bin/python -m ruff check skills/parallel-infrastructure/scripts/vendor_probe.py"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [probe_lint_passed]}
    metadata: {loc_estimate: 450, complexity: medium, package_kind: algorithm}
    inputs: {}
    outputs: {result_keys: [probe_tests_passed, probe_lint_passed]}

  - package_id: wp-config
    title: "agents.yaml cli.probe schema and declarations"
    task_type: backend
    description: "Tasks 4.1-4.3 — AGENTS_SCHEMA, CliConfig, dispatch-configs, agents.yaml probe blocks."
    role: backend-implementer
    archetype: implementer
    priority: 2
    depends_on: [wp-contracts]
    locks:
      files: ["agent-coordinator/src/agents_config.py", "agent-coordinator/agents.yaml"]
      keys: ["contract:agents-yaml-cli-probe", "api:GET /agents/dispatch-configs"]
      ttl_minutes: 120
      reason: "Coordinator config schema"
    scope:
      write_allow:
        - "agent-coordinator/src/agents_config.py"
        - "agent-coordinator/agents.yaml"
        - "agent-coordinator/tests/test_agents_config_probe.py"
      read_allow: ["**"]
    worktree: {name: probe-config, mode: isolated}
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Config tests"
          kind: command
          command: "agent-coordinator/.venv/bin/python -m pytest agent-coordinator/tests/test_agents_config_probe.py agent-coordinator/tests/test_agents_config.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [config_tests_passed]}
    metadata: {loc_estimate: 150, complexity: low, package_kind: config}
    inputs: {}
    outputs: {result_keys: [config_tests_passed]}

  - package_id: wp-dispatch
    title: "vendor_health and review_dispatcher integration"
    task_type: backend
    description: "Tasks 3.1-3.6 — delegate health/check-vendors to the probe, cache filter, runtime write-back."
    role: backend-implementer
    archetype: implementer
    priority: 3
    depends_on: [wp-probe-core]
    locks:
      files:
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
        - "skills/parallel-infrastructure/scripts/vendor_health.py"
        - "agent-coordinator/Dockerfile"
        - "agent-coordinator/src/watchdog.py"
      keys: []
      ttl_minutes: 120
      reason: "Dispatcher vendor selection"
    scope:
      write_allow:
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
        - "skills/parallel-infrastructure/scripts/vendor_health.py"
        - "agent-coordinator/Dockerfile"
        - "agent-coordinator/src/watchdog.py"
        - "agent-coordinator/tests/test_watchdog_vendor.py"
        - "skills/tests/parallel-infrastructure/test_vendor_health_probe.py"
        - "skills/tests/parallel-infrastructure/test_dispatch_probe_cache.py"
      read_allow: ["**"]
    worktree: {name: probe-dispatch, mode: isolated}
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Dispatch + health tests"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/parallel-infrastructure -q"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [dispatch_tests_passed]}
        - name: "Watchdog loader"
          kind: command
          command: "agent-coordinator/.venv/bin/python -m pytest agent-coordinator/tests/test_watchdog_vendor.py agent-coordinator/tests/test_dockerfile_vendor_registry.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [watchdog_tests_passed]}
    metadata: {loc_estimate: 350, complexity: high, package_kind: integration}
    inputs: {}
    outputs: {result_keys: [dispatch_tests_passed, watchdog_tests_passed]}

  - package_id: wp-install
    title: "install.sh --check probe report"
    task_type: backend
    description: "Tasks 5.1-5.2 — exit-code-neutral report and vendor-status docs."
    role: backend-implementer
    archetype: implementer
    priority: 3
    depends_on: [wp-probe-core]
    locks:
      files: ["skills/install.sh", "skills/vendor-status/SKILL.md"]
      keys: []
      ttl_minutes: 90
      reason: "Installer check output"
    scope:
      write_allow:
        - "skills/install.sh"
        - "skills/vendor-status/SKILL.md"
        - "skills/tests/install_sh/test_install_probe_report.py"
      read_allow: ["**"]
    worktree: {name: probe-install, mode: isolated}
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Install tests"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/install_sh -q"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [install_tests_passed]}
    metadata: {loc_estimate: 120, complexity: low, package_kind: config}
    inputs: {}
    outputs: {result_keys: [install_tests_passed]}

  - package_id: wp-integration
    title: "Merged-tree gates and real-CLI verification"
    task_type: integration
    description: "Tasks 6.1-6.3 — cross-source fingerprint test, merged-tree gates, real-CLI verification."
    role: integrator
    priority: 4
    depends_on: [wp-dispatch, wp-config, wp-install]
    locks: {files: [], keys: [], ttl_minutes: 60, reason: "Integration"}
    scope:
      write_allow:
        - "openspec/changes/add-local-agent-probe/validation-report.md"
        - "agent-coordinator/tests/test_probe_fingerprint_sources.py"
      read_allow: ["**"]
    worktree: {name: probe-integration, mode: isolated}
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: A
      steps:
        - name: "Cross-source fingerprint"
          kind: command
          command: "agent-coordinator/.venv/bin/python -m pytest agent-coordinator/tests/test_probe_fingerprint_sources.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [fingerprint_sources_passed]}
        - name: "Skills regression"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests -q -m 'not e2e and not integration'"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [skills_regression_passed]}
        - name: "Coordinator regression"
          kind: command
          command: "agent-coordinator/.venv/bin/python -m pytest agent-coordinator/tests -q -m 'not e2e and not integration'"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [coordinator_regression_passed]}
        - name: "OpenSpec strict"
          kind: command
          command: "openspec validate add-local-agent-probe --strict"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [openspec_strict_passed]}
        - name: "Install check"
          kind: command
          command: "bash skills/install.sh --check"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [install_check_passed]}
        - name: "Ruff on touched modules"
          kind: command
          command: "agent-coordinator/.venv/bin/python -m ruff check agent-coordinator/src/agents_config.py agent-coordinator/src/watchdog.py skills/parallel-infrastructure/scripts/vendor_probe.py skills/parallel-infrastructure/scripts/vendor_health.py skills/parallel-infrastructure/scripts/review_dispatcher.py"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [ruff_passed]}
        - name: "Mypy on touched coordinator modules"
          kind: command
          command: ".venv/bin/python -m mypy src/agents_config.py src/watchdog.py"
          cwd: "agent-coordinator"
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [mypy_passed]}
        - name: "Real-CLI probe report (task 6.3)"
          kind: command
          command: "skills/.venv/bin/python skills/parallel-infrastructure/scripts/vendor_probe.py report"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: ["openspec/changes/add-local-agent-probe/validation-report.md"], result_keys: [real_cli_probe_recorded]}
    metadata: {loc_estimate: 20, complexity: medium, package_kind: integration}
    inputs: {}
    outputs:
      result_keys: [fingerprint_sources_passed, skills_regression_passed, coordinator_regression_passed, openspec_strict_passed, install_check_passed, ruff_passed, mypy_passed, real_cli_probe_recorded]
      artifacts: ["openspec/changes/add-local-agent-probe/validation-report.md"]
