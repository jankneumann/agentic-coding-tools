    worktree:
      name: phase-lifecycle-registry
      mode: isolated
    timeout_minutes: 240
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Registry and guard tests"
          kind: command
          command: "uv run --project skills pytest skills/worktree/scripts/tests skills/shared/tests/test_active_agents.py skills/tests/worktree -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [registry_guard_tests]
        - name: "Registry contracts parse"
          kind: command
          command: "uv run --project skills python -c \"import json; from jsonschema import Draft202012Validator; Draft202012Validator.check_schema(json.load(open('openspec/changes/phase-scoped-worktree-lifecycle/contracts/schemas/worktree-registry-v2.schema.json')))\""
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [registry_contract_valid]
