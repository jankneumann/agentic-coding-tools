          kind: command
          command: "uv run --project skills pytest skills/tests/implement-feature/test_prerequisite_preflight.py skills/tests/implement-feature/test_coordinated_preflight.py skills/parallel-infrastructure/scripts/tests/test_dag_scheduler.py -q"
