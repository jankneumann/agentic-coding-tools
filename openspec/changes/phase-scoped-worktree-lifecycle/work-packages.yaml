packages:
  - package_id: wp-baseline-preflight
    title: "Authoritative prerequisite preflight and barrier bootstrap"
    task_type: validation
    description: |
      Tasks 0.1-0.5, executed in bootstrap order 0.1, 0.2, 0.3, 0.4,
      scheduler reload/reinstantiation, then 0.5. First implement, test, and
      commit the feature-HEAD completion barrier. A fresh scheduler runtime
      loaded from that commit then resolves both named prerequisite pull
      requests from authoritative repository metadata, verifies merged/base/
      ancestry and named surfaces, records the implementation diff base, and
      atomically publishes schema-valid baseline evidence in the managed shared
      feature worktree. Under the branch lock, that fresh runtime reverifies
      evidence on the exact feature HEAD, records it as the minimum dependent
      base, and only then satisfies dependencies or creates dependent
      worktrees. This shared package uses the already managed feature checkout;
      it MUST NOT create or switch to another checkout.
    role: integration-engineer
    archetype: analyst
    priority: 1
    depends_on: []
    locks:
      files:
        - "skills/implement-feature/scripts/prerequisite_preflight.py"
        - "skills/implement-feature/SKILL.md"
        - "skills/parallel-infrastructure/scripts/dag_scheduler.py"
        - "skills/parallel-infrastructure/scripts/integration_orchestrator.py"
        - "openspec/changes/phase-scoped-worktree-lifecycle/tasks.md"
        - "openspec/changes/phase-scoped-worktree-lifecycle/baseline-gates.json"
      keys:
        - "feature:phase_lifecycle:preflight"
      ttl_minutes: 60
      reason: "Fail-closed prerequisite reconciliation"
    scope:
      write_allow:
        - "skills/implement-feature/scripts/prerequisite_preflight.py"
        - "skills/implement-feature/SKILL.md"
        - "skills/parallel-infrastructure/scripts/dag_scheduler.py"
        - "skills/parallel-infrastructure/scripts/integration_orchestrator.py"
        - "skills/parallel-infrastructure/scripts/tests/test_dag_scheduler.py"
        - "skills/tests/implement-feature/test_prerequisite_preflight.py"
        - "skills/tests/implement-feature/test_coordinated_preflight.py"
        - "openspec/changes/phase-scoped-worktree-lifecycle/tasks.md"
        - "openspec/changes/phase-scoped-worktree-lifecycle/baseline-gates.json"
      read_allow:
        - "**"
    context_impact:
      surfaces: [architecture, decisions, semantic_code]
    worktree:
