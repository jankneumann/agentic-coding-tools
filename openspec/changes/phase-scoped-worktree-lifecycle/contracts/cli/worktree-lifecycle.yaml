contract_version: "2.0"
name: worktree-lifecycle
executable: skills/worktree/scripts/worktree.py
description: >-
  Local repository-owned CLI contract for activity leases and retention. All
  mutations serialize on one registry lock, validate the current document, and
  atomically replace it with a schema-v2 document.

defaults:
  lease_ttl_seconds: 1800
  setup_reservation_ttl_seconds: 1800
  heartbeat_interval_seconds: 300
  lock_timeout_seconds: 10

registry:
  path: .git-worktrees/.registry.json
  lock_path: .git-worktrees/.registry.lock
  write_schema: ../schemas/worktree-registry-v2.schema.json#/$defs/registryV2
  accepted_read_schemas:
    - ../schemas/worktree-registry-v2.schema.json#/$defs/registryV2
    - ../schemas/worktree-registry-v2.schema.json#/$defs/registryV1
  mutation_guarantees:
    - exclusive_file_lock
    - validate_before_rewrite
    - atomic_replace
    - owner_checked
    - idempotent_same_owner_retry

durability_target_rules:
  - git-remote-url-v1 requires exactly one configured fetch URL. For URI syntax remove the complete userinfo component; for scp syntax remove the prefix through @; otherwise preserve every remaining UTF-8 byte without case, percent, path, slash, port, or trailing-.git normalization, then hash it with SHA-256. Secrets MUST NOT appear in registry data or diagnostics.
  - A stored ref MUST be a remote-tracking ref and its remote path component MUST exactly equal remote_name.
  - Before any takeover, recreation, or disposal proof, read the current configured URL and compare its canonical digest with the stored digest, fetch that exact remote/ref outside the registry lock, and bind the observed tip OID to the entry generation and target used under the lock.
  - A URL-digest mismatch, remote/ref mismatch, failed fetch, or changed observed tip is indeterminate and MUST refuse automatic mutation rather than falling back to another ref.

process_evidence:
  path: .git-worktrees/.lifecycle-processes/<sha256(versioned-length-prefix(change_id,agent_id-or-null,entry_generation,lease_id))>.json
  schema: ../schemas/worktree-process-evidence.schema.json
  fields: [change_id, agent_id, entry_generation, lease_id, owner, pid, process_start_token, host_id, controller_instance_id, written_at, last_seen_at]
  rules:
    - The lifecycle controller atomically writes evidence before publishing an automatic lease and refreshes it with renewal.
    - Every evidence read, refresh, archive, or delete validates the exact entry key, entry_generation, owner, lease_id, and controller_instance_id; lease ids need not be registry-global.
    - Same-host pid plus exact process_start_token is live; absent pid or token mismatch is stale, including PID reuse.
    - Missing, unreadable, unsupported, or cross-host evidence is indeterminate and quarantines expired takeover.
    - Evidence may veto expired takeover but never grants ownership.

identity:
  entry_key: [change_id, agent_id]
  lease_owner:
    type: string
    min_length: 1
    examples:
      - phase:PLAN:run-123
      - phase:IMPLEMENT:run-123
      - autopilot:run-456
  lease_id:
    type: string
    min_length: 1
    description: Client-generated single-acquisition fencing token.
  controller_instance_id:
    type: string
    min_length: 1
    description: Per-process controller identity generated once and never persisted as resumable workflow identity.
  legacy_entry_generation:
    algorithm: legacy-v1-entry-sha256
    format: legacy-v1-entry:<sha256(versioned-length-prefix(change_id,agent_id-or-null,branch,worktree_path,created_at))>
    description: Deterministic generation exposed by v1 inspection and migration-report and persisted unchanged by the first v2 rewrite.

global_exit_codes:
  0: success_or_idempotent_noop
  1: invalid_arguments_or_entry_not_found
  2: invalid_or_corrupt_registry
  3: live_lease_owned_by_another_owner
  4: owner_mismatch
  5: lock_timeout
  6: expired_absent_or_fencing_mismatch
  7: recovery_required

commands:
  - name: setup
    synopsis: >-
      worktree.py setup CHANGE_ID [--agent-id ID] [--branch BRANCH]
      [--prefix PREFIX] [--branch-prefix prototype] [--no-bootstrap] [--sibling]
      [--durability-remote REMOTE --durability-ref REF] [--json]
    mutation: true
    required: [change_id]
    behavior:
      - Preserve the complete existing setup and branch-override invocation, isolation behavior, bootstrap/package layout, and shell output. When both optional durability arguments are omitted, store null and report that later assessed acquisition requires explicit operator recovery.
      - Require durability-remote and durability-ref together, reject mismatched remote/ref components, and create the checkout plus an unleased registry entry with a fresh entry_generation and canonicalized durability target for explicit non-workflow setup.
      - Package and automatic workflow callers MUST use setup-and-acquire and store the parent feature remote ref as the durability target, not a disposable child branch.
      - Any later acquisition treats the separately visible unleased entry as pre-existing state and runs the full adoption assessment.
    json_output:
      required: [change_id, agent_id, branch, worktree_path, entry_generation, durability_target, created]

  - name: setup-and-acquire
    synopsis: >-
      worktree.py setup-and-acquire CHANGE_ID [--agent-id ID]
      --setup-id SETUP_ID --durability-remote REMOTE --durability-ref REF --owner OWNER
      --lease-id LEASE_ID --controller-instance-id CONTROLLER
      [--session-id SESSION_ID] --phase PHASE --reason REASON
      [--mode standalone|continuous] [--ttl-seconds N]
      [--setup-reservation-ttl-seconds N] [--json]
    mutation: true
    required: [change_id, setup_id, durability_remote, durability_ref, owner, lease_id, controller_instance_id, phase, reason]
    behavior:
      - Under the lifecycle lock, atomically create a non-active setup reservation containing caller-generated setup_id, exact entry generation, target, timestamp-free lease intent, state=reserved, ttl_seconds, and expires_at=created_at+ttl_seconds; reservations never satisfy activity or ownership assertions and conservatively block sync points as indeterminate provisioning, including after expiry until explicit reconciliation.
      - Create the Git checkout outside the lock, then advance the same-generation reservation through checkout-created and evidence-created using locked atomic registry rewrites. In one final locked transaction, derive acquired_at and last_heartbeat from one publication timestamp, derive expires_at from that timestamp plus the intent TTL, publish the schema-valid entry and first lease, and remove the reservation.
      - While the reservation is unexpired, retry reconciles only the exact same setup_id, generation, entry identity, target, and requested ownership triple. It verifies or completes each side effect idempotently; a different setup/controller cannot consume the reservation. After reservation expiry, setup-and-acquire refuses and only setup reconcile may classify its side effects.
      - Fresh automatic workflow operation therefore creates the checkout, schema-valid entry, exact durability target, exact-entry process evidence, and first lease as one crash-reconciled lifecycle operation without pretending Git and registry writes are one filesystem transaction.
      - If a completed entry already stores the same setup_id, entry generation, entry identity, target, and requested ownership triple, return the original successful result idempotently without renewing or changing the lease. Refuse every other existing entry; callers must use assessed acquire, resume, or explicit recovery instead.
      - A package entry MUST store the parent feature remote ref as its durability target.
    json_output:
      required: [setup_id, change_id, agent_id, branch, worktree_path, entry_generation, durability_target, owner, lease_id, controller_instance_id, acquired]

  - name: setup reconcile
    synopsis: >-
      worktree.py setup reconcile SETUP_ID --entry-generation GENERATION
      --actor ACTOR --reason REASON --confirm-terminated [--json]
    mutation: true
    required: [setup_id, entry_generation, actor, reason, confirm_terminated]
    behavior:
      - Explicit audited recovery operation for an expired setup reservation; an unexpired reservation remains reserved for the exact setup-and-acquire retry and MUST NOT be reconciled.
      - Require the exact setup_id and entry generation, inspect only checkout and evidence side effects attributable to that reservation, and refuse matching locally live process evidence. Missing, unreadable, unsupported, or cross-host evidence requires explicit termination confirmation and never permits silent cleanup.
      - When no attributable side effects exist, remove only the reservation. When any checkout or evidence side effect exists, atomically replace the reservation with an unleased recovery_required entry using the same setup_id and generation, source=setup-failure, and preserved evidence; never delete or clean the checkout.
      - In the same registry replacement, append a setup-reconciled audit event with actor, rationale, prior intended ownership, process-evidence key, termination confirmation, and outcome. A wrong generation or a different completed entry is a non-mutating conflict.
    json_output:
      required: [setup_id, change_id, agent_id, entry_generation, reconciled, outcome, recovery_required, recovery_audit_event]

  - name: lease acquire
    synopsis: >-
      worktree.py lease acquire CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID --controller-instance-id CONTROLLER
      [--session-id SESSION_ID] --phase PHASE --reason REASON
      [--mode standalone|continuous|manual] [--ttl-seconds N] [--json]
    mutation: true
    required: [change_id, owner, lease_id, controller_instance_id, phase, reason]
    defaults:
      mode: standalone
      ttl_seconds: 1800
    behavior:
      - Treat every unleased entry, including normalized legacy and separately created setup state, as unknown and run the full locked adoption assessment; missing durability or stale-process proof quarantines it.
      - Refuse an unpublished setup reservation with exit code 7; acquire handles published entries only and never consumes provisioning intent.
      - Refresh the stored durability remote/ref outside the global registry lock, then under the lock revalidate entry_generation and durability_target before proving HEAD reachable from the exact ref. Network I/O is forbidden while the registry lock is held.
      - Before replacing an expired lease, inspect worktree/submodule cleanliness, stored-target reachability, and schema-valid process evidence bound to the exact entry and old lease; unsafe, live-writer, or indeterminate state MUST be quarantined with recovery_context and return exit code 7.
      - Only a clean, durable expired entry with stale same-host evidence may be acquired, and replacement MUST use a new lease_id.
      - Retry by the same owner, lease_id, and controller_instance_id is idempotent and renews expiry; a different controller cannot reuse that token.
      - Refuse a live lease with a different owner using exit code 3 and a different lease_id using exit code 6.
      - Refuse automatic acquisition of recovery_required entries with exit code 7.
    json_output:
      required: [change_id, agent_id, owner, lease_id, controller_instance_id, session_id, phase, lifecycle_mode, acquired_at, last_heartbeat, expires_at, acquired]

  - name: lease resume
    synopsis: >-
      worktree.py lease resume CHANGE_ID [--agent-id ID] --owner OWNER
      --prior-lease-id OLD --prior-controller-instance-id OLD_CONTROLLER
      --lease-id NEW --controller-instance-id CONTROLLER
      --phase PHASE --reason REASON [--session-id SESSION_ID] [--json]
    mutation: true
    required: [change_id, owner, prior_lease_id, prior_controller_instance_id, lease_id, controller_instance_id, phase, reason]
    behavior:
      - Require the supplied prior owner, lease, and controller to match the stored triple, then rotate both lease and controller identity only after exact old-entry evidence is stale on the same host and checkout state is safe and reachable from the stored durability target; both new values must differ from their predecessors.
      - Reject live old-controller evidence and quarantine missing, unreadable, unsupported, cross-host, or identity-mismatched evidence; TTL expiry alone never proves process death.
      - Use the same refresh-outside-lock and generation/target revalidation protocol as assessed acquire.
    json_output:
      required: [change_id, agent_id, owner, prior_lease_id, prior_controller_instance_id, lease_id, controller_instance_id, resumed, recovery_required]

  - name: lease renew
    synopsis: >-
      worktree.py lease renew CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID --controller-instance-id CONTROLLER [--phase PHASE]
      [--ttl-seconds N] [--json]
    mutation: true
    required: [change_id, owner, lease_id, controller_instance_id]
    defaults:
      ttl_seconds: 1800
    behavior:
      - Renew only a non-expired lease held by the exact owner, lease_id, and controller_instance_id.
      - A non-empty controller_instance_id is mandatory. Nullable-controller legacy renewal exists only in the heartbeat compatibility handler.
      - An optional phase updates the current phase without changing ownership.
      - Refuse a different owner with exit code 4 and a fencing mismatch/expired lease with exit code 6; an expired lease must be acquired again with a new lease_id.
    json_output:
      required: [change_id, agent_id, owner, lease_id, controller_instance_id, phase, last_heartbeat, expires_at, renewed]

  - name: lease release
    synopsis: >-
      worktree.py lease release CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID [--controller-instance-id CONTROLLER]
      [--recovery-reason REASON] [--json]
    mutation: true
    required: [change_id, owner, lease_id]
    behavior:
      - This is an abandonment/recovery operation for a preserved checkout, not the successful finalization path. Clear only a lease held by the exact owner, lease_id, and controller_instance_id.
      - controller-instance-id may be omitted only when the stored lease is the normalized manual LEGACY lease with controller_instance_id=null and the supplied owner and lease id exactly equal its deterministic synthetic identity. Every other lease requires a non-empty controller id; null is never a wildcard.
      - When the checkout remains, atomically mark recovery_required and retain recovery_context plus matching process evidence before clearing the lease; normal successful finalization invokes teardown while the lease is live and never releases first. recovery_context.source is always explicit-release; if recovery-reason is omitted, use recovery_reason=explicit-lease-release, otherwise preserve the supplied non-empty reason.
      - Releasing an already absent lease is an idempotent success that makes no assertion about prior ownership.
      - Refuse a different live owner with exit code 4 or fencing mismatch with exit code 6.
    json_output:
      required: [change_id, agent_id, owner, lease_id, controller_instance_id, released, recovery_required]

  - name: lease release-owner
    synopsis: worktree.py lease release-owner --owner OWNER [--json]
    mutation: true
    required: [owner]
    behavior:
      - Explicit recovery operation that handles every lease with an exact owner match under the lifecycle lock.
      - For every matching checkout still present, atomically set recovery_required with an owner-recovery reason before clearing the lease; never return preserved state to ordinary-acquire eligibility.
      - Preserve matching process evidence and bind its key and prior controller identity into recovery_context for later termination assessment.
      - Never releases leases owned by another run, even when owner prefixes match.
      - Repeating the command is an idempotent success.
    json_output:
      required: [owner, released_count, quarantined_count, released_entries]

  - name: lease release-session
    synopsis: worktree.py lease release-session --session-id SESSION_ID [--json]
    mutation: true
    required: [session_id]
    behavior:
      - Best-effort session-end operation that handles every lease with an exact non-empty session_id match under the lifecycle lock.
      - Null, missing, empty, prefix, and owner matches are never treated as session matches.
      - For every matching checkout not already removed by explicit finalization, atomically set recovery_required with a session-termination reason before clearing the lease; never return preserved state to ordinary-acquire eligibility.
      - Preserve matching process evidence and bind its key and prior controller identity into recovery_context for later termination assessment.
      - Never delete a worktree; a missing entry or one already removed by explicit finalization is an idempotent no-op.
      - Repeating the command is an idempotent success.
    json_output:
      required: [session_id, released_count, quarantined_count, released_entries]

  - name: recovery adopt
    synopsis: >-
      worktree.py recovery adopt CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID --controller-instance-id CONTROLLER --reason REASON [--session-id SESSION_ID]
      [--ttl-seconds N] [--durability-remote REMOTE --durability-ref REF] [--json]
    mutation: true
    required: [change_id, owner, lease_id, controller_instance_id, reason]
    behavior:
      - Explicit operator action that requires stale same-host prior-process evidence, then atomically clears active recovery metadata while acquiring a new fenced manual lease.
      - When the stored durability target is null, require durability-remote and durability-ref together, validate and fetch that exact bound target outside the lock, then revalidate entry_generation and atomically establish it with adoption. When a target already exists, reject replacement arguments; target rotation is outside this command.
      - The resulting lease stores owner and lease_id, nullable session_id, phase RECOVERY, the supplied reason, lifecycle_mode manual, acquired_at and last_heartbeat set to now, expires_at=now+ttl_seconds, and the default 1800-second TTL when omitted.
      - Live or indeterminate prior-process evidence returns 7 without mutation. Once termination is proven, intentionally preserved dirty/non-durable contents may be adopted for inspection under the manual lease.
      - Ordinary phase workflows MUST NOT pass this operation implicitly.
    json_output:
      required: [change_id, agent_id, owner, lease_id, controller_instance_id, session_id, phase, reason, lifecycle_mode, acquired_at, last_heartbeat, expires_at, ttl_seconds, adopted, recovery_required]

  - name: recovery force-adopt
    synopsis: >-
      worktree.py recovery force-adopt CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID --controller-instance-id CONTROLLER --actor ACTOR
      --reason REASON --confirm-terminated
      [--durability-remote REMOTE --durability-ref REF] [--json]
    mutation: true
    required: [change_id, owner, lease_id, controller_instance_id, actor, reason, confirm_terminated]
    behavior:
      - Separately named audited operator path for missing or cross-host evidence; never invoked by automatic workflows.
      - When the stored target is null, a complete durability pair MAY be supplied and established as for recovery adopt. If omitted, force-adopt MAY issue the manual recovery lease with a null target so the operator can inspect and push preserved legacy work; every operation except exact release, force-teardown, and recovery bind-target MUST refuse while the target remains null.
      - The force-adopt audit records the newly established target digest when this path supplies it and null otherwise.
      - In the same registry transaction that rotates ownership and clears active recovery_context, append actor, rationale, explicit termination confirmation, prior identity, new identity, and timestamp to recovery_audit; successful adoption MUST NOT erase this history.
      - Refuse when matching prior-process evidence is locally live.
    json_output:
      required: [change_id, agent_id, owner, lease_id, controller_instance_id, adopted, recovery_required, recovery_audit_event]

  - name: recovery bind-target
    synopsis: >-
      worktree.py recovery bind-target CHANGE_ID [--agent-id ID]
      --entry-generation GENERATION --owner OWNER --lease-id LEASE_ID
      --controller-instance-id CONTROLLER --durability-remote REMOTE
      --durability-ref REF --actor ACTOR --reason REASON [--json]
    mutation: true
    required: [change_id, entry_generation, owner, lease_id, controller_instance_id, durability_remote, durability_ref, actor, reason]
    behavior:
      - Operator-only completion of a null-target manual RECOVERY lease. Require the exact live owner, lease, controller, and entry generation; refuse automatic or non-RECOVERY leases and every entry whose target is already non-null.
      - Validate the remote URL identity, fetch the exact ref, and prove checkout HEAD reachable from it outside the lock; under the lock reload and revalidate generation, exact triple, null target, URL digest, ref, and observed tip before atomically storing the target.
      - A dirty checkout MAY bind after the operator has deliberately preserved and pushed it, but a failed fetch, non-reachable HEAD, changed observation, or fencing mismatch is non-mutating. The command never changes lease identity or clears recovery audit history.
    json_output:
      required: [change_id, agent_id, entry_generation, owner, lease_id, controller_instance_id, durability_target, bound]

  - name: teardown
    synopsis: >-
      worktree.py teardown CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID --controller-instance-id CONTROLLER
      --entry-generation GENERATION [--json]
    mutation: true
    required: [change_id, owner, lease_id, controller_instance_id, entry_generation]
    behavior:
      - Refresh the stored durability target outside the global lock, then hold the exclusive registry lock from generation/target and live owner/lease/controller verification through dirty and submodule checks, HEAD-reachability proof, Git worktree removal, and registry-entry removal.
      - Permit a branch not merged into main when HEAD is reachable from the stored durable remote ref; caller-supplied alternate refs are forbidden.
      - On dirty, dirty-submodule, or non-durable state, preserve the worktree, atomically enter recovery quarantine, and clear the exact lease before returning; the caller MUST NOT issue a second release.
      - Never run destructive submodule deinitialization before dirtiness is proven absent.
      - The automatic command has no force mode. A supplied legacy --force option MUST be rejected with instructions naming the separate recovery force-teardown command; coordinators MUST NOT invoke recovery force-teardown.
      - Repeating teardown after the registry entry and worktree are already absent is an idempotent success and does not attest prior ownership.
      - If Git removal succeeded but the exact generation and owner/lease/controller registry entry remain after a crash, repeated teardown SHALL reconcile the missing checkout by removing that entry and matching process evidence; a wrong generation, owner, lease_id, or controller_instance_id remains a non-mutating conflict.
    json_output:
      required: [change_id, agent_id, entry_generation, owner, lease_id, controller_instance_id, removed, recovery_required, reason]

  - name: recovery teardown
    synopsis: >-
      worktree.py recovery teardown CHANGE_ID [--agent-id ID]
      --entry-generation GENERATION --actor ACTOR --reason REASON
      --confirm-terminated [--json]
    mutation: true
    required: [change_id, entry_generation, actor, reason, confirm_terminated]
    behavior:
      - Explicit lease-free disposal for an entry whose activity_lease is null. Refuse any present lease, wrong entry generation, or matching locally live process evidence; this command never adopts or invents ownership.
      - When the checkout exists, fetch and bind the exact stored durability target outside the lock, then under the lifecycle lock revalidate generation and target and require a clean checkout, clean submodules, and HEAD reachable from that target. A present checkout with a null target, failed fetch, changed observation, dirty state, or non-durable HEAD refuses without mutation.
      - Hold the lifecycle lock through Git removal and atomic entry/evidence removal. A missing checkout with the exact unleased generation is a recoverable orphan and may be removed; if Git removal fails, preserve both registry entry and evidence.
      - Append a recovery-torn-down audit event in the same registry replacement with the nullable prior lease identity, discard_confirmed=false, and a clean-durable or missing-checkout outcome. The audit survives entry removal.
    json_output:
      required: [change_id, agent_id, entry_generation, removed, reason, recovery_audit_event]

  - name: recovery force-teardown
    synopsis: >-
      worktree.py recovery force-teardown CHANGE_ID [--agent-id ID]
      --entry-generation GENERATION --actor ACTOR --reason REASON
      --confirm-terminated --confirm-discard [--owner OWNER --lease-id LEASE_ID
      --controller-instance-id CONTROLLER] [--json]
    mutation: true
    required: [change_id, entry_generation, actor, reason, confirm_terminated, confirm_discard]
    behavior:
      - Separately named, audited operator-only destructive path for intentionally discarding dirty, null-target, or non-durable state. Automatic workflows and coordinator kick/finalization MUST NOT invoke it, and bare teardown --force is rejected.
      - Require the exact entry generation. When activity_lease is non-null, additionally require the exact owner, lease id, and controller id; the controller may be omitted only for the exact normalized manual LEGACY null-controller lease. Refuse matching locally live process evidence even with both confirmations.
      - Hold the lifecycle lock through forced Git removal and atomic entry/evidence removal. If Git removal fails, preserve the registry entry and evidence; never clear registry state merely because force was requested.
      - Append a recovery-torn-down audit event in the same registry replacement with actor, rationale, termination confirmation, prior lease identity, discard_confirmed=true, process-evidence key, and removed-explicit-discard outcome. The audit survives entry removal.
    json_output:
      required: [change_id, agent_id, entry_generation, removed, discard_confirmed, reason, recovery_audit_event]

  - name: lease status
    synopsis: >-
      worktree.py lease status [CHANGE_ID] [--agent-id ID] [--owner OWNER]
      [--include-expired] [--json]
    mutation: false
    behavior:
      - Report live versus expired using the caller's current clock.
      - Retention is reported independently and never changes lease liveness.
    json_output:
      required: [schema_version, inspected_at, entries]

  - name: lease assert-owned
    synopsis: >-
      worktree.py lease assert-owned CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID --controller-instance-id CONTROLLER [--json]
    mutation: false
    required: [change_id, owner, lease_id, controller_instance_id]
    behavior:
      - Succeed only when the lease is live and owner, lease_id, and controller_instance_id all match.
      - Return exit code 4 for owner mismatch and exit code 6 for expiry, absence, or fencing mismatch.
    json_output:
      required: [change_id, agent_id, owner, lease_id, controller_instance_id, owned, expires_at]

  - name: retention set
    synopsis: >-
      worktree.py retention set CHANGE_ID [--agent-id ID] --reason REASON [--json]
    mutation: true
    required: [change_id, reason]
    behavior:
      - Set retained=true and retention_reason without acquiring activity.
      - Retry with the same reason is an idempotent success.

  - name: retention clear
    synopsis: worktree.py retention clear CHANGE_ID [--agent-id ID] [--json]
    mutation: true
    required: [change_id]
    behavior:
      - Set retained=false and retention_reason=null without releasing activity.
      - Repeating the command is an idempotent success.

  - name: inspect
    synopsis: worktree.py inspect [CHANGE_ID] [--agent-id ID] [--json]
    mutation: false
    behavior:
      - Report schema version, migration interpretation, retention, lease liveness, setup reservation expiry/reconciliation status, and the deterministic entry generation that legacy normalization would persist.
      - Never rewrites the registry or deletes a worktree.

  - name: migration-report
    synopsis: worktree.py migration-report [--json]
    mutation: false
    behavior:
      - Validate the current registry and preview each v1-to-v2 interpretation.
      - Interpret pinned=true as retention and heartbeat freshness only as transitional activity evidence, and report the same deterministic legacy entry generation that the first v2 rewrite will persist.
      - Never rewrites the registry.

compatibility_aliases:
  pin:
    maps_to: retention set
    default_reason: legacy-pin
    warning: >-
      Deprecated compatibility alias. Pinning protects from GC but does not
      acquire an activity lease or block a sync point.
  unpin:
    maps_to: retention clear
    warning: Deprecated compatibility alias; does not release an activity lease.
  heartbeat:
    maps_to: v1 canonicalization or compatibility renewal
    constraints:
      - For a v1 entry, heartbeat CHANGE_ID [--agent-id ID] atomically writes the complete deterministic synthetic lease mapping, with last_heartbeat=now, expires_at=now+3600, and ttl_seconds=3600.
      - The synthetic lease uses owner legacy:<change-id>:<agent-id-or-parent>, lease_id legacy-v1:<sha256(change-id|agent-id-or-parent|created-at)>, null session_id, phase LEGACY, reason legacy-heartbeat-migration, lifecycle_mode manual, and acquired_at=min(created_at,last_heartbeat).
      - Once an entry is v2, explicit --owner and --lease-id are required. If the stored lease is the normalized manual LEGACY lease and controller_instance_id is null, the compatibility handler renews only that exact synthetic owner/lease pair without a controller argument. Every non-null-controller v2 lease requires --controller-instance-id and delegates to lease renew.
      - New workflows use lease renew directly.

safety_invariants:
  - Expiry makes activity non-blocking but never removes a worktree or branch.
  - Ordinary takeover of an expired lease is allowed only after a locked clean/durable/process-evidence assessment; unsafe or indeterminate state is quarantined.
  - Remote refresh happens outside the global registry lock; the locked mutation revalidates entry_generation and the stored durability target before using the observation.
  - Setup reservations are non-active, generation-fenced intents; crash recovery either completes their exact side effects or quarantines them and never publishes an ordinary unleased entry.
  - Reservation expiry ends the original setup's exclusive retry window but does not unblock sync points; only explicit setup reconcile removes the reservation or converts attributable side effects to recovery quarantine.
  - GC skips retained entries and refuses dirty or unmerged worktrees unless an existing explicit operator force path separately authorizes removal.
  - Automatic teardown requires a live matching owner, lease_id, and controller_instance_id and holds the exclusive registry lock through revalidation, dirty/submodule checks, remote-reachability proof, git removal, and registry removal.
  - Lease-free recovery teardown requires a null lease and clean durable state. Intentional discard is available only through separately named audited recovery force-teardown; bare teardown never accepts force.
  - The lifecycle controller runs teardown with the resolved main repository as cwd, never from inside the worktree being removed.
  - A pushed but unmerged branch is disposable when HEAD is reachable from the entry's stored durability target; an unpushed commit or dirty submodule is not.
  - Clean teardown happens while the exact lease remains live. Unsafe teardown atomically quarantines before exact-triple release; nested phases cannot release a continuous parent lease.
  - Session release quarantines every preserved matching checkout before clearing the lease and never deletes a worktree.
  - A workflow pushes durable output before tearing down its standalone phase worktree while the exact lease remains live.
  - Cloud isolation may make local registry mutations no-ops, but command output remains shape-compatible.
