contract_version: "1.0"
name: worktree-lifecycle
executable: skills/worktree/scripts/worktree.py
description: >-
  Local repository-owned CLI contract for activity leases and retention. All
  mutations serialize on one registry lock, validate the current document, and
  atomically replace it with a schema-v2 document.

defaults:
  lease_ttl_seconds: 1800
  heartbeat_interval_seconds: 300
  lock_timeout_seconds: 10

registry:
  path: .git-worktrees/.registry.json
  lock_path: .git-worktrees/.registry.lock
  write_schema: ../schemas/worktree-registry-v2.schema.json#/$defs/registryV2
  accepted_read_schemas:
    - ../schemas/worktree-registry-v2.schema.json#/$defs/registryV2
    - ../schemas/worktree-registry-v2.schema.json#/$defs/registryV1
  mutation_guarantees:
    - exclusive_file_lock
    - validate_before_rewrite
    - atomic_replace
    - owner_checked
    - idempotent_same_owner_retry

identity:
  entry_key: [change_id, agent_id]
  lease_owner:
    type: string
    min_length: 1
    examples:
      - phase:PLAN:run-123
      - phase:IMPLEMENT:run-123
      - autopilot:run-456
  lease_id:
    type: string
    min_length: 1
    description: Client-generated single-acquisition fencing token.

global_exit_codes:
  0: success_or_idempotent_noop
  1: invalid_arguments_or_entry_not_found
  2: invalid_or_corrupt_registry
  3: live_lease_owned_by_another_owner
  4: owner_mismatch
  5: lock_timeout
  6: expired_absent_or_fencing_mismatch
  7: recovery_required

commands:
  - name: lease acquire
    synopsis: >-
      worktree.py lease acquire CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID [--session-id SESSION_ID] --phase PHASE --reason REASON
      [--mode standalone|continuous|manual] [--ttl-seconds N] [--json]
    mutation: true
    required: [change_id, owner, lease_id, phase, reason]
    defaults:
      mode: standalone
      ttl_seconds: 1800
    behavior:
      - Create a lease immediately when none exists.
      - Before replacing an expired lease, hold the lifecycle lock and inspect worktree/submodule cleanliness, expected-remote reachability, and remaining process evidence; unsafe or indeterminate state MUST be quarantined with recovery_required and return exit code 7.
      - Only a clean, durable expired entry without contradictory process evidence may be acquired, and replacement MUST use a new lease_id.
      - Retry by the same owner and lease_id is idempotent and renews expiry.
      - Refuse a live lease with a different owner using exit code 3 and a different lease_id using exit code 6.
      - Refuse automatic acquisition of recovery_required entries with exit code 7.
    json_output:
      required: [change_id, agent_id, owner, lease_id, session_id, phase, lifecycle_mode, acquired_at, last_heartbeat, expires_at, acquired]

  - name: lease renew
    synopsis: >-
      worktree.py lease renew CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID [--phase PHASE] [--ttl-seconds N] [--json]
    mutation: true
    required: [change_id, owner, lease_id]
    defaults:
      ttl_seconds: 1800
    behavior:
      - Renew only a non-expired lease held by the exact owner and lease_id.
      - An optional phase updates the current phase without changing ownership.
      - Refuse a different owner with exit code 4 and a fencing mismatch/expired lease with exit code 6; an expired lease must be acquired again with a new lease_id.
    json_output:
      required: [change_id, agent_id, owner, lease_id, phase, last_heartbeat, expires_at, renewed]

  - name: lease release
    synopsis: >-
      worktree.py lease release CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID [--recovery-reason REASON] [--json]
    mutation: true
    required: [change_id, owner, lease_id]
    behavior:
      - Clear only a lease held by the exact owner and lease_id.
      - When recovery-reason is supplied, atomically mark recovery_required before clearing the lease.
      - Releasing an already absent lease is an idempotent success that makes no assertion about prior ownership.
      - Refuse a different live owner with exit code 4 or fencing mismatch with exit code 6.
    json_output:
      required: [change_id, agent_id, owner, lease_id, released, recovery_required]

  - name: lease release-owner
    synopsis: worktree.py lease release-owner --owner OWNER [--json]
    mutation: true
    required: [owner]
    behavior:
      - Explicit recovery operation that clears every lease with an exact owner match.
      - Never releases leases owned by another run, even when owner prefixes match.
      - Repeating the command is an idempotent success.
    json_output:
      required: [owner, released_count, released_entries]

  - name: lease release-session
    synopsis: worktree.py lease release-session --session-id SESSION_ID [--json]
    mutation: true
    required: [session_id]
    behavior:
      - Best-effort session-end operation that handles every lease with an exact non-empty session_id match under the lifecycle lock.
      - Null, missing, empty, prefix, and owner matches are never treated as session matches.
      - For every matching checkout not already removed by explicit finalization, atomically set recovery_required with a session-termination reason before clearing the lease; never return preserved state to ordinary-acquire eligibility.
      - Never delete a worktree; a missing entry or one already removed by explicit finalization is an idempotent no-op.
      - Repeating the command is an idempotent success.
    json_output:
      required: [session_id, released_count, quarantined_count, released_entries]

  - name: recovery adopt
    synopsis: >-
      worktree.py recovery adopt CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID --reason REASON [--json]
    mutation: true
    required: [change_id, owner, lease_id, reason]
    behavior:
      - Explicit operator action that inspects preserved state, clears recovery_required, and acquires a new fenced manual lease atomically.
      - Ordinary phase workflows MUST NOT pass this operation implicitly.

  - name: teardown
    synopsis: >-
      worktree.py teardown CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID [--expected-remote REMOTE_REF] [--json]
    mutation: true
    required: [change_id, owner, lease_id]
    behavior:
      - Hold the exclusive registry lock from live owner/lease-id verification through dirty and submodule checks, remote-reachability proof, Git worktree removal, and registry-entry removal.
      - Permit a branch not merged into main when HEAD is reachable from the expected durable remote ref.
      - On dirty, dirty-submodule, or non-durable state, preserve the worktree and return an unsafe result so finalization can release it into recovery quarantine.
      - Never run destructive submodule deinitialization before dirtiness is proven absent.
      - Repeating teardown after the registry entry and worktree are already absent is an idempotent success and does not attest prior ownership.
    json_output:
      required: [change_id, agent_id, owner, lease_id, removed, recovery_required, reason]

  - name: lease status
    synopsis: >-
      worktree.py lease status [CHANGE_ID] [--agent-id ID] [--owner OWNER]
      [--include-expired] [--json]
    mutation: false
    behavior:
      - Report live versus expired using the caller's current clock.
      - Retention is reported independently and never changes lease liveness.
    json_output:
      required: [schema_version, inspected_at, entries]

  - name: lease assert-owned
    synopsis: >-
      worktree.py lease assert-owned CHANGE_ID [--agent-id ID] --owner OWNER
      --lease-id LEASE_ID [--json]
    mutation: false
    required: [change_id, owner, lease_id]
    behavior:
      - Succeed only when the lease is live and both owner and lease_id match.
      - Return exit code 4 for owner mismatch and exit code 6 for expiry, absence, or fencing mismatch.
    json_output:
      required: [change_id, agent_id, owner, lease_id, owned, expires_at]

  - name: retention set
    synopsis: >-
      worktree.py retention set CHANGE_ID [--agent-id ID] --reason REASON [--json]
    mutation: true
    required: [change_id, reason]
    behavior:
      - Set retained=true and retention_reason without acquiring activity.
      - Retry with the same reason is an idempotent success.

  - name: retention clear
    synopsis: worktree.py retention clear CHANGE_ID [--agent-id ID] [--json]
    mutation: true
    required: [change_id]
    behavior:
      - Set retained=false and retention_reason=null without releasing activity.
      - Repeating the command is an idempotent success.

  - name: inspect
    synopsis: worktree.py inspect [CHANGE_ID] [--agent-id ID] [--json]
    mutation: false
    behavior:
      - Report schema version, migration interpretation, retention, and lease liveness.
      - Never rewrites the registry or deletes a worktree.

  - name: migration-report
    synopsis: worktree.py migration-report [--json]
    mutation: false
    behavior:
      - Validate the current registry and preview each v1-to-v2 interpretation.
      - Interpret pinned=true as retention and heartbeat freshness only as transitional activity evidence.
      - Never rewrites the registry.

compatibility_aliases:
  pin:
    maps_to: retention set
    default_reason: legacy-pin
    warning: >-
      Deprecated compatibility alias. Pinning protects from GC but does not
      acquire an activity lease or block a sync point.
  unpin:
    maps_to: retention clear
    warning: Deprecated compatibility alias; does not release an activity lease.
  heartbeat:
    maps_to: v1 canonicalization or lease renew
    constraints:
      - For a v1 entry, heartbeat CHANGE_ID [--agent-id ID] atomically writes the complete deterministic synthetic lease mapping, with last_heartbeat=now, expires_at=now+3600, and ttl_seconds=3600.
      - The synthetic lease uses owner legacy:<change-id>:<agent-id-or-parent>, lease_id legacy-v1:<sha256(change-id|agent-id-or-parent|created-at)>, null session_id, phase LEGACY, reason legacy-heartbeat-migration, lifecycle_mode manual, and acquired_at=min(created_at,last_heartbeat).
      - Once an entry is v2, explicit --owner and --lease-id are required and the alias behaves exactly as lease renew; omission returns exit code 1.
      - New workflows use lease renew directly.

safety_invariants:
  - Expiry makes activity non-blocking but never removes a worktree or branch.
  - Ordinary takeover of an expired lease is allowed only after a locked clean/durable/process-evidence assessment; unsafe or indeterminate state is quarantined.
  - GC skips retained entries and refuses dirty or unmerged worktrees unless an existing explicit operator force path separately authorizes removal.
  - Automatic teardown requires a live matching owner and lease_id and holds the exclusive registry lock through dirty/submodule checks, remote-reachability proof, git removal, and registry removal.
  - The lifecycle controller runs teardown with the resolved main repository as cwd, never from inside the worktree being removed.
  - A pushed but unmerged branch is disposable when HEAD is reachable from the expected remote branch; an unpushed commit or dirty submodule is not.
  - Unsafe teardown releases into recovery_required quarantine; nested phases cannot release a continuous parent lease.
  - Session release quarantines every preserved matching checkout before clearing the lease and never deletes a worktree.
  - A workflow pushes durable output before releasing its standalone phase lease.
  - Cloud isolation may make local registry mutations no-ops, but command output remains shape-compatible.
