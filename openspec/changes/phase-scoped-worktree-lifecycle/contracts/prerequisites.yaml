schema_version: 1
repository: current
remote_name: configured-default
base_ref: configured-default
execution_gate:
  package_id: wp-baseline-preflight
  completion_visibility: feature-head
  evidence_path: openspec/changes/phase-scoped-worktree-lifecycle/baseline-gates.json
  dependent_base_rule: exact-verified-feature-head
  shared_worktree:
    logical_name: feature
    mode: shared
    checkout_action: none
  dependent_dispatch: held-until-gate-complete
  bootstrap:
    ordered_actions:
      - action: implement-prerequisite-resolver
        task_ids: ["0.1", "0.2"]
      - action: test-feature-head-barrier
        task_ids: ["0.3"]
      - action: implement-and-commit-feature-head-barrier
        task_ids: ["0.4"]
      - action: reload-or-reinstantiate-scheduler
        runtime_source: committed-feature-head
      - action: generate-and-commit-live-evidence
        task_ids: ["0.5"]
      - action: reverify-and-record-feature-head
        lock: feature-branch
      - action: release-dependent-dispatch
    scheduler_runtime_requirement: fresh-process-or-instance-after-barrier-commit
    pre_reload_evidence_satisfies_gate: false
prerequisites:
  - change_id: add-merge-plan-orchestration
    expected_head_ref: openspec/add-merge-plan-orchestration
    required_surface:
      id: file-tier-merge-plan-schema-and-executor
      files:
        - path: openspec/changes/add-merge-plan-orchestration/contracts/schemas/merge-plan.schema.json
          kind: json-schema
        - path: skills/merge-pull-requests/scripts/build_plan.py
          kind: python
        - path: skills/merge-pull-requests/scripts/merge_plan.py
          kind: python
        - path: skills/merge-pull-requests/scripts/execute_merge_plan.py
          kind: python
      verify_at: [authoritative-merge-sha, feature-head]
    blocks: [wp-pr-delivery]
  - change_id: validate-feature-findings-gate
    expected_head_ref: openspec/validate-feature-findings-gate
    required_surface:
      id: selected-ephemeral-validation-worktree
      files:
        - path: skills/validate-feature/scripts/validation_worktree.py
          kind: python
        - path: skills/tests/validate-feature/test_validation_worktree.py
          kind: python
      verify_at: [authoritative-merge-sha, feature-head]
    blocks: [wp-phase-lifecycle]

verification:
  - Query all pull requests for the exact expected head ref and require exactly one surface-qualified merged candidate in the current repository; ignore proposal-only historical candidates while retaining their rejection reasons in evidence, and fail closed for zero or multiple qualified candidates.
  - Read merge SHA and base ref from authoritative pull-request metadata; caller-supplied SHAs are forbidden.
  - Fetch the configured remote/base and qualify each candidate only when its repository, base, head, merged state, authoritative merge SHA, and ancestry to both fetched base tip and feature HEAD are valid.
  - Qualify a candidate only when every exact required-surface file is a non-deleted, parseable blob at its authoritative merge SHA; reverify the chosen candidate's Python and JSON Schema surfaces at feature HEAD before atomically writing schema-valid baseline-gates.json.
  - Run the preflight package in the existing managed shared feature worktree without creating or switching checkout; commit the barrier implementation and reload or reinstantiate the scheduler before generating live evidence.
  - Under the feature-branch lock, reverify evidence with that fresh scheduler runtime and record exact feature HEAD before marking the package complete.
  - Create each dependent worktree only from that recorded feature HEAD; a changed HEAD requires locked re-verification and a new recorded base.
