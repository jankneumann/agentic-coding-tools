schema_version: 1

feature:
  id: rename-descriptor-model-levels
  title: "Descriptor model naming levels: *Spec for elements, *Descriptor for documents"
  plan_revision: 1
  created_by: claude-autopilot
  created_at: "2026-07-25T00:00:00Z"

contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/rename-descriptor-model-levels/contracts/README.md"
    files:
      - "openspec/changes/rename-descriptor-model-levels/contracts/README.md"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 120
  retry_budget: 2
  verification_tier_required: B
  min_trust_level: 2

packages:
  # A single sequential package. The work is one mechanical migration over one
  # module plus its call sites; splitting it would create exactly the kind of
  # partially-renamed intermediate state whose verification problems caused this
  # change to be extracted in the first place.
  - package_id: wp-main
    title: "Rename element/container models, alias the old names, bump the contract version"
    task_type: implementation
    description: |
      Tasks 1.1-1.4, 2.1-2.2, 3.1-3.2. Rename EndpointDescriptor,
      ToolDescriptor, CommandDescriptor and ServiceDescriptor to *Spec; add
      warning deprecation aliases for all four; update exports and the parity
      test; bump CONTRACT_VERSION 1 -> 2 and regenerate all four generated
      artifacts; migrate the 11 test files still using the old names; write the
      downstream notice.

      Deliberately one package. No freed name is reused here (design D2), so
      every old name has exactly one meaning throughout: a deprecated alias.
      That uniformity is what makes the gates below expressible.
    role: python-engineer
    archetype: implementer
    priority: 1
    depends_on: []
    locks:
      files:
        - "packages/gen-eval/src/gen_eval/descriptor.py"
        - "packages/gen-eval/src/gen_eval/__init__.py"
      keys:
        - "feature:gen-eval-descriptor:models"
      ttl_minutes: 180
      reason: "Renaming published model types across src, tests and the versioned schema"
    scope:
      write_allow:
        - "packages/gen-eval/src/gen_eval/descriptor.py"
        - "packages/gen-eval/src/gen_eval/__init__.py"
        - "packages/gen-eval/src/gen_eval/contracts/__init__.py"
        - "packages/gen-eval/src/gen_eval/contracts/VERSION"
        - "packages/gen-eval/src/gen_eval/contracts/interface-descriptor.schema.json"
        - "packages/gen-eval/src/gen_eval/contracts/scenario.schema.json"
        - "packages/gen-eval/src/gen_eval/contracts/eval-report.schema.json"
        - "packages/gen-eval/tests/**"
        - "openspec/changes/rename-descriptor-model-levels/**"
      read_allow:
        - "**"
      deny:
        - "packages/gen-eval/src/gen_eval/evaluator.py"
        - "packages/gen-eval/src/gen_eval/orchestrator.py"
        - "packages/gen-eval/src/gen_eval/reports.py"
    worktree:
      name: rdml-main
      mode: isolated
    timeout_minutes: 180
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "New *Spec names are exported and carry the pre-rename fields"
          kind: command
          command: "cd packages/gen-eval && python3 -c \"import sys, gen_eval; missing=[n for n in ('EndpointSpec','McpToolSpec','CommandSpec','ServiceSpec') if not hasattr(gen_eval,n)]; sys.exit(f'not exported: {missing}') if missing else None; assert 'endpoints' in gen_eval.ServiceSpec.model_fields, 'ServiceSpec lost its container fields'; assert 'input_schema' in gen_eval.McpToolSpec.model_fields, 'McpToolSpec lost its element fields'; print('4 Spec names exported with fields intact')\""
          evidence:
            artifacts: []
            result_keys: ["spec_names_exported"]
        # Asserts BOTH halves per alias. Presence alone is satisfied by a plain
        # re-export that never deprecates; a warning alone is satisfied by a
        # broken alias. All four are checked uniformly because this change
        # reuses no freed name (D2).
        - name: "All four old names resolve as aliases AND emit DeprecationWarning"
          kind: command
          command: "cd packages/gen-eval && python3 -c \"import warnings, gen_eval, sys; failed=[]\nfor n in ('EndpointDescriptor','ToolDescriptor','CommandDescriptor','ServiceDescriptor'):\n    with warnings.catch_warnings(record=True) as w:\n        warnings.simplefilter('always')\n        obj=getattr(gen_eval, n, None)\n        if obj is None: failed.append(n+': missing')\n        elif not any(issubclass(x.category, DeprecationWarning) for x in w): failed.append(n+': no DeprecationWarning')\nsys.exit('alias check failed: '+'; '.join(failed)) if failed else print('4 aliases resolve and warn')\""
          evidence:
            artifacts: []
            result_keys: ["aliases_resolve_and_warn"]
        - name: "CONTRACT_VERSION is 2 and all generated artifacts regenerate clean"
          kind: command
          command: "cd packages/gen-eval && python3 -c \"from gen_eval.contracts import CONTRACT_VERSION; import sys; sys.exit(f'CONTRACT_VERSION={CONTRACT_VERSION}, expected 2') if str(CONTRACT_VERSION)!='2' else print('version 2')\" && python3 scripts/generate_contract_schemas.py --check"
          evidence:
            artifacts: []
            result_keys: ["contract_version_bumped", "artifacts_regenerate_clean"]
        # Asserts a non-empty corpus first: run against a tree with no tests/
        # the scan finds nothing and would otherwise report success.
        # test_descriptor_naming.py is exempt — it must name the old names to
        # test them, and excluding it is what makes this gate satisfiable.
        - name: "No test file outside the naming test still uses a pre-rename name"
          kind: command
          command: "cd packages/gen-eval && python3 -c \"import pathlib,re,sys; files=[p for p in pathlib.Path('tests').rglob('*.py') if p.name!='test_descriptor_naming.py']; sys.exit('no test corpus found — gate would pass vacuously') if not files else None; pat=re.compile(r'\\b(EndpointDescriptor|ToolDescriptor|CommandDescriptor|ServiceDescriptor)\\b'); hits=sorted(str(p) for p in files if pat.search(p.read_text())); sys.exit('pre-rename names still used in: '+', '.join(hits)) if hits else print(f'{len(files)} test files scanned, none using pre-rename names')\""
          evidence:
            artifacts: []
            result_keys: ["no_pre_rename_usage"]
        - name: "Suite is clean under DeprecationWarning-as-error"
          kind: command
          command: "cd packages/gen-eval && uv run pytest -q -W error::DeprecationWarning -m 'not e2e and not integration' --ignore=tests/test_descriptor_naming.py"
          evidence:
            artifacts: []
            result_keys: ["suite_clean_under_deprecation_error"]
        - name: "Full suite passes"
          kind: command
          command: "uv run pytest -q -m 'not e2e and not integration'"
          cwd: "packages/gen-eval"
          evidence:
            artifacts: []
            result_keys: ["full_suite"]
    outputs:
      result_keys:
        - renamed_models
        - contract_version
        - downstream_notice
      artifacts:
        - "packages/gen-eval/src/gen_eval/descriptor.py"
        - "packages/gen-eval/src/gen_eval/contracts/interface-descriptor.schema.json"
