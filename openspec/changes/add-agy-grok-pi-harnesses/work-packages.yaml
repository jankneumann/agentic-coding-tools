schema_version: 1

feature:
  id: add-agy-grok-pi-harnesses
  title: "Add antigravity / grok / pi harnesses, retire Gemini across the vendor roster"
  plan_revision: 2
  created_by: claude-code

contracts:
  revision: 2
  openapi:
    primary: "openspec/changes/add-agy-grok-pi-harnesses/contracts/openapi/v1.yaml"
    files:
      - "openspec/changes/add-agy-grok-pi-harnesses/contracts/openapi/v1.yaml"
      - "openspec/changes/add-agy-grok-pi-harnesses/contracts/roster.md"
      - "openspec/changes/add-agy-grok-pi-harnesses/contracts/provider-model-map.schema.json"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 60
  retry_budget: 2
  verification_tier_required: B
  min_trust_level: 2

# Plan revision 2 (ESCALATE resolution, design.md D8): five packages along
# venv/test-suite boundaries, coarse write scopes, no bespoke gate scripts.
# Every verification step is an existing suite or an inline one-liner.

packages:
  # ─────────────────────────────────────────────────────────────────────
  # wp-empirical — CLI facts before any config is written (tasks 1.1-1.4)
  # ─────────────────────────────────────────────────────────────────────
  - package_id: wp-empirical
    title: "Empirical CLI facts — agy/grok/pi flags, slugs, output shapes, re-login"
    task_type: backend
    description: |
      Run the three new CLIs and record facts E1-E8 in design.md with command +
      output evidence. Gates the config packages so nothing is written against a
      guessed flag. Checkpoint 1.4 is a HUMAN review — whether the CLIs were
      genuinely invoked is not mechanically verifiable (two scripted attempts
      were both defeated in review; see design.md D8.2). Implements tasks 1.1-1.4.
    role: runner
    priority: 1
    depends_on: []
    locks:
      files:
        - "openspec/changes/add-agy-grok-pi-harnesses/design.md"
      keys:
        - "contract:empirical-cli-findings"
      ttl_minutes: 60
      reason: "Records empirical CLI facts consumed by all config packages"
    scope:
      write_allow:
        - "openspec/changes/add-agy-grok-pi-harnesses/design.md"
      read_allow:
        - "**"
    worktree:
      name: agy-roster-wp-empirical
      mode: isolated
    timeout_minutes: 45
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: C
      steps:
        - name: "All three CLIs are on PATH"
          kind: command
          command: "command -v agy && command -v grok && command -v pi"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["clis_on_path"]
        - name: "Human review: E1-E8 confirmed/refuted with evidence (task 1.4)"
          kind: manual
          manual_instructions: >
            Open design.md § Empirical CLI findings. Every row E1-E8 must read
            confirmed or refuted and carry the exact command plus an output
            excerpt. Reject rows whose evidence could not have come from running
            the CLI.
          evidence:
            artifacts:
              - "openspec/changes/add-agy-grok-pi-harnesses/design.md"
            result_keys: ["empirical_findings_recorded"]
    metadata:
      loc_estimate: 0
      complexity: medium
      package_kind: config
    inputs: {}
    outputs:
      result_keys: ["empirical_findings_recorded"]
      artifacts:
        - "openspec/changes/add-agy-grok-pi-harnesses/design.md"

  # ─────────────────────────────────────────────────────────────────────
  # wp-coordinator — everything under agent-coordinator/ (tasks 2.1-2.10)
  # ─────────────────────────────────────────────────────────────────────
  - package_id: wp-coordinator
    title: "Coordinator — registry, model map, archetypes, eval backends, seeder, Makefile"
    task_type: backend
    description: |
      agents.yaml roster swap, DEFAULT_PROVIDER_MODEL_MAP + archetypes
      model_aliases (schema_version 2), coordination_api/setup_cloud references,
      eval backends (add antigravity/grok/pi, delete gemini_jules), kanban
      seeder + coordinator-side fixtures, Makefile gemini targets (mcp-setup AND
      hooks-setup prerequisites) then gemini_wrapper.sh, and the
      google-generativeai dependency removal + uv lock. Baseline repair for this
      tree is task 0.3 (narrow the over-broad shutil.which mocks in
      tests/test_docker_manager.py; 3 macOS-only failures make this package's
      gate unpassable) and MUST land before the gate.
      Implements tasks 0.3, 2.1-2.10.
    role: implementer
    priority: 2
    depends_on: [wp-empirical]
    locks:
      files:
        - "agent-coordinator"
      keys:
        - "contract:agents-yaml-roster"
        - "contract:provider-model-map-impl"
        - "contract:archetype-model-aliases"
        - "contract:evaluation-backends"
      ttl_minutes: 120
      reason: "Canonical vendor registry and coordinator-tree roster migration"
    scope:
      write_allow:
        - "agent-coordinator/**"
      deny:
        - "agent-coordinator/database/migrations/**"
        - "agent-coordinator/README.md"
        - "agent-coordinator/CLAUDE.md"
        - "agent-coordinator/.secrets.yaml.example"
        - "agent-coordinator/config.yaml.example"
      read_allow:
        - "**"
    worktree:
      name: agy-roster-wp-coordinator
      mode: isolated
    timeout_minutes: 150
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Coordinator suite green; owned tree clean; SDK dep gone; make resolves"
          kind: command
          command: "agent-coordinator/.venv/bin/python -m pytest agent-coordinator/tests -q -m 'not e2e and not integration' && test -z \"$(git grep -lIi gemini -- agent-coordinator ':!agent-coordinator/database/migrations' ':!agent-coordinator/README.md' ':!agent-coordinator/CLAUDE.md' ':!agent-coordinator/.secrets.yaml.example' ':!agent-coordinator/config.yaml.example')\" && ! grep -q google-generativeai agent-coordinator/pyproject.toml && make -n -C agent-coordinator mcp-setup hooks-setup >/dev/null"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["coordinator_roster_updated"]
    metadata:
      loc_estimate: 520
      complexity: high
      package_kind: integration
    inputs: {}
    outputs:
      result_keys: ["coordinator_roster_updated"]
      artifacts:
        - "agent-coordinator/agents.yaml"

  # ─────────────────────────────────────────────────────────────────────
  # wp-skills — skills/, scripts/, packages/, openspec/schemas (tasks 0.1-0.3, 3.1-3.12, 4.2)
  # ─────────────────────────────────────────────────────────────────────
  - package_id: wp-skills
    title: "Skills — baseline repair, dispatch allow-lists, transcript adapters, agent-scenarios"
    task_type: backend
    description: |
      Phase 0 baseline repair FIRST (fastapi/httpx into skills/pyproject.toml +
      uv sync; vendor-neutral-autopilot test repairs), then the dispatch
      allow-lists (_SUPPORTED_PROVIDERS, argparse choices, orchestrator
      available list, _STATIC_COST_TIERS, _RELOGIN_COMMANDS, gemini envelope
      unwrap), consensus synthesizer + schema, quick-task/review-artifacts/
      impl-review scripts, provider key-set tightening in the promoted
      openspec/schemas/provider-model-map.schema.json (frontier tier
      preserved), transcript adapters (add three, delete gemini_cli),
      tech-debt skip lists, fetch-vendor-skills, langfuse install-mcp,
      agent-scenarios, skills-tree kanban fixtures, and google-generativeai
      removal from skills/pyproject.toml. Baseline repair for this tree is task 0.1
      (fastapi/httpx into skills/pyproject.toml) and MUST land before the gate.
      Implements tasks 0.1 and 3.1-3.12. (Task 4.2 moved to wp-frontend: it
      depends on 2.7, which wp-coordinator owns, and only wp-frontend declares
      that dependency.)
    role: implementer
    priority: 2
    depends_on: [wp-empirical]
    locks:
      files:
        - "skills"
        - "packages/agent-scenarios"
        - "openspec/schemas"
      keys:
        - "contract:supported-providers"
        - "contract:relogin-commands"
        - "contract:static-cost-tiers"
        - "contract:transcript-adapters"
      ttl_minutes: 120
      reason: "Skills-tree roster migration and baseline repair"
    scope:
      write_allow:
        - "skills/**"
        - "scripts/impl_review_driver.py"
        - "scripts/impl_review_handoff.py"
        - "packages/agent-scenarios/**"
        - "openspec/schemas/consensus-report.schema.json"
        - "openspec/schemas/provider-model-map.schema.json"
      deny:
        - "skills/*/SKILL.md"
        - "skills/tests/agent-coordinator/**"
        - "skills/langfuse/references/**"
        - "skills/plan-feature/install_assets/**"
        - "skills/plan-roadmap/templates/**"
        - "skills/collect-transcripts/config.yaml.example"
      read_allow:
        - "**"
    worktree:
      name: agy-roster-wp-skills
      mode: isolated
    timeout_minutes: 150
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Skills + agent-scenarios suites green; no live gemini in owned trees"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests -q && uv run --project packages/agent-scenarios pytest packages/agent-scenarios/tests -q && test -z \"$(git grep -lIi gemini -- skills scripts packages ':!*SKILL.md' ':!skills/langfuse/references' ':!skills/plan-feature/install_assets' ':!skills/plan-roadmap/templates' ':!skills/collect-transcripts/config.yaml.example')\" && ! grep -q google-generativeai skills/pyproject.toml"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["skills_roster_updated"]
    metadata:
      loc_estimate: 620
      complexity: high
      package_kind: integration
    inputs: {}
    outputs:
      result_keys: ["skills_roster_updated"]
      artifacts:
        - "skills/autopilot/scripts/provider_dispatch.py"

  # ─────────────────────────────────────────────────────────────────────
  # wp-frontend — apps/kanban-viz fixtures only (tasks 4.1, 4.3)
  # ─────────────────────────────────────────────────────────────────────
  - package_id: wp-frontend
    title: "Kanban frontend — roster fixtures; swimlanes component and provenance untouched"
    task_type: frontend
    description: |
      Update VendorSwimlanes.test.tsx fixtures to the new roster.
      VendorSwimlanes.tsx is NOT modified (derives vendor from agent_id suffix,
      design D5). The three review-provenance annotations are NOT modified
      (history, not roster data). Baseline repair for this tree is task 0.4
      (npm ci — a fresh worktree has no node_modules, so npm test exits 127).
      Also owns task 4.2 (skills-tree kanban endpoint fixtures), moved here
      because it depends on task 2.7 in wp-coordinator and only this package
      declares that edge. Implements tasks 0.4, 4.1, 4.2, 4.3.
    role: implementer
    priority: 3
    depends_on: [wp-coordinator]
    locks:
      files:
        - "apps/kanban-viz"
      keys:
        - "contract:kanban-fixtures"
      ttl_minutes: 60
      reason: "Kanban vendor roster fixtures"
    scope:
      write_allow:
        - "apps/kanban-viz/**"
        - "skills/tests/agent-coordinator/**"
      deny:
        - "apps/kanban-viz/src/components/VendorSwimlanes.tsx"
        - "apps/kanban-viz/src/hooks/useCoordinator.ts"
        - "apps/kanban-viz/src/__tests__/useCoordinator.test.tsx"
        - "apps/kanban-viz/src/lib/coordinator-types.ts"
      read_allow:
        - "**"
    worktree:
      name: agy-roster-wp-frontend
      mode: isolated
    timeout_minutes: 45
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Frontend green; only 3 provenance files mention gemini; component untouched"
          kind: command
          command: "(cd apps/kanban-viz && npm ci && npm test -- --run) && diff <(git grep -lIi gemini -- apps/kanban-viz | sort) <(printf '%s\\n' apps/kanban-viz/src/__tests__/VendorSwimlanes.test.tsx apps/kanban-viz/src/__tests__/useCoordinator.test.tsx apps/kanban-viz/src/hooks/useCoordinator.ts apps/kanban-viz/src/lib/coordinator-types.ts | sort) && git diff --quiet main... -- apps/kanban-viz/src/components/VendorSwimlanes.tsx"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["frontend_fixtures_updated"]
    metadata:
      loc_estimate: 40
      complexity: low
      package_kind: config
    inputs: {}
    outputs:
      result_keys: ["frontend_fixtures_updated"]
      artifacts:
        - "apps/kanban-viz/src/__tests__/VendorSwimlanes.test.tsx"

  # ─────────────────────────────────────────────────────────────────────
  # wp-docs-finalize — docs, templates, SKILL.md prose, .gemini/, integration
  # (tasks 5.1-5.7, 6.1-6.4) — runs last, in a shared worktree
  # ─────────────────────────────────────────────────────────────────────
  - package_id: wp-docs-finalize
    title: "Docs + finalize — prose roster, templates, SKILL.md, .gemini/ removal, mirrors, full suite"
    task_type: integration
    description: |
      Delete .gemini/, update README/CLAUDE.md/docs/templates/openspec
      config.yaml, rewrite provider prose in the 8 spec-named lifecycle SKILL.md
      files plus setup-coordinator and collect-transcripts, document the
      optional grok config.toml operator setup with citation, then run
      install.sh rsync sync, the four test suites, the live smoke dispatch, and
      record the deferred-narrative follow-up list. Also owns the two session-log
      templates (task 5.5a) — live edit sites no package previously owned.
      Implements tasks 5.1-5.7 (incl. 5.5a) and 6.1-6.4.
    role: integrator
    priority: 6
    depends_on: [wp-coordinator, wp-skills, wp-frontend]
    locks:
      files:
        - "README.md"
        - "docs"
        - ".gemini"
        - ".claude/skills"
        - ".agents/skills"
      keys:
        - "contract:supported-vendor-roster"
        - "contract:runtime-skill-mirrors"
      ttl_minutes: 120
      reason: "Doc-surface roster migration and integration finalize"
    scope:
      write_allow:
        - "README.md"
        - "docs/**"
        - ".gemini/**"
        - "agent-coordinator/README.md"
        - "agent-coordinator/CLAUDE.md"
        - "agent-coordinator/.secrets.yaml.example"
        - "agent-coordinator/config.yaml.example"
        - "skills/collect-transcripts/config.yaml.example"
        - "skills/*/SKILL.md"
        - "openspec/config.yaml"
        - "openspec/schemas/feature-workflow/templates/session-log.md"
        - "skills/plan-feature/install_assets/openspec/schemas/feature-workflow/templates/session-log.md"
        - ".claude/skills/**"
        - ".agents/skills/**"
        - "openspec/changes/add-agy-grok-pi-harnesses/**"
      deny:
        - "docs/merge-logs/**"
        - "docs/decisions/**"
        - "docs/archive/**"
        - "docs/feature-discovery/**"
      read_allow:
        - "**"
    worktree:
      name: agy-roster-wp-docs-finalize
      mode: shared
    timeout_minutes: 150
    retry_budget: 1
    min_trust_level: 3
    verification:
      tier_required: A
      steps:
        - name: "OpenSpec valid; in-scope doc surface clean; grok citation present; .gemini gone"
          kind: command
          command: "openspec validate --all --strict && git grep -q 'docs.x.ai/build/features/skills-plugins-marketplaces' -- docs/ && test ! -d .gemini && test -z \"$(git grep -lIi gemini -- README.md openspec/config.yaml agent-coordinator/README.md agent-coordinator/CLAUDE.md agent-coordinator/.secrets.yaml.example agent-coordinator/config.yaml.example skills/collect-transcripts/config.yaml.example docs/agent-coordinator.md docs/skills-workflow.md docs/autopilot-provider-smoke.md docs/openbao-secret-management.md skills/autopilot/SKILL.md skills/plan-feature/SKILL.md skills/implement-feature/SKILL.md skills/iterate-on-plan/SKILL.md skills/iterate-on-implementation/SKILL.md skills/parallel-review-plan/SKILL.md skills/parallel-review-implementation/SKILL.md skills/validate-feature/SKILL.md skills/setup-coordinator/SKILL.md skills/collect-transcripts/SKILL.md)\""
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["docs_updated"]
        - name: "Mirrors synced and clean; full suite green across the four trees"
          kind: command
          command: "bash skills/install.sh --mode rsync --force --deps none --python-tools none && test -z \"$(grep -rIl -i gemini .claude/skills .agents/skills --exclude='*SKILL.md' --exclude-dir=references --exclude-dir=templates --exclude-dir=install_assets)\" && agent-coordinator/.venv/bin/python -m pytest agent-coordinator/tests -q -m 'not e2e and not integration' && skills/.venv/bin/python -m pytest skills/tests -q && uv run --project packages/agent-scenarios pytest packages/agent-scenarios/tests -q && (cd apps/kanban-viz && npm ci && npm test -- --run)"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["full_suite_green"]
        - name: "Human review: live smoke dispatch against antigravity, grok, pi (task 6.3)"
          kind: manual
          manual_instructions: >
            Run one review-mode dispatch through each of the three new vendors
            and confirm a parseable result envelope comes back. Operator
            authorization for billed calls is on record in design.md.
          evidence:
            artifacts: []
            result_keys: ["live_smoke_passed"]
    metadata:
      loc_estimate: 200
      complexity: medium
      package_kind: integration
    inputs: {}
    outputs:
      result_keys: ["docs_updated", "full_suite_green", "live_smoke_passed"]
      artifacts:
        - "README.md"
