openapi: 3.1.0
info:
  title: Coordinator Dispatch Governance Additions
  version: "1.0.0"
  description: >
    Coordinator surface added by change add-sandboxed-harness-execution:
    per-dispatch API identities for remote execution backends. Network-policy
    export is imported from add-dispatch-sandbox-enforcement (dg-07), not
    redefined here. Inference key issuance is owned by add-coordinator-llm-gateway.

paths:
  /dispatch/identities:
    post:
      operationId: issueDispatchIdentity
      summary: Issue a per-dispatch coordinator identity (reversible-write)
      description: >
        Mints a short-lived API identity bound to one dispatch, so revocation and
        audit are per-dispatch. Only the dispatcher's own identity may mint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueDispatchIdentityRequest" }
      responses:
        "200":
          description: Issued identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchIdentity" }
        "403": { description: Caller is not authorized to mint dispatch identities }

  /dispatch/identities/revoke:
    post:
      operationId: revokeDispatchIdentity
      summary: Revoke a per-dispatch identity (reversible-write)
      description: >
        Rejects the identity for all subsequent requests and marks the associated
        dispatch failed in the completion ledger if still in flight. Other
        identities are unaffected (spec: agent-coordinator, "revocation isolates
        one dispatch").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_id]
              properties:
                identity_id: { type: string }
                reason: { type: string }
      responses:
        "200": { description: Revoked (idempotent) }
        "404": { description: Unknown identity }

components:
  schemas:
    IssueDispatchIdentityRequest:
      type: object
      required: [dispatch_id, agent_type, ttl_seconds]
      properties:
        dispatch_id: { type: string }
        agent_type: { type: string }
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
        scopes:
          type: array
          items:
            type: string
            enum: [ledger_write, heartbeat, handoff_read]
          description: Coordinator capabilities granted; default is ledger_write + heartbeat.

    DispatchIdentity:
      type: object
      required: [identity_id, api_key, expires_at]
      properties:
        identity_id: { type: string }
        api_key:
          type: string
          description: Leaf credential; injected into the workspace by the broker, never logged.
        expires_at:
          type: string
          format: date-time
