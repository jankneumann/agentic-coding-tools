schema_version: 1

feature:
  id: pack-and-parallelize-vendor-review
  title: "Pack and parallelize vendor review"
  plan_revision: 1
  created_by: grok
  created_at: "2026-09-11T00:00:00Z"
  deployable: false

contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/pack-and-parallelize-vendor-review/contracts/README.md"
    files:
      - "openspec/changes/pack-and-parallelize-vendor-review/contracts/README.md"
      - "openspec/changes/pack-and-parallelize-vendor-review/contracts/review-packet.schema.json"
      - "openspec/changes/pack-and-parallelize-vendor-review/contracts/vendor-structured-output.md"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 60
  retry_budget: 1
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-contracts
    title: "Review packet contracts"
    task_type: contracts
    description: "Review-packet schema, size budget, and structured-output probe table."
    role: contracts
    priority: 1
    depends_on: []
    timeout_minutes: 30
    retry_budget: 1
    min_trust_level: 1
    locks:
      files:
        - "openspec/changes/pack-and-parallelize-vendor-review/contracts/review-packet.schema.json"
        - "openspec/changes/pack-and-parallelize-vendor-review/contracts/vendor-structured-output.md"
      keys:
        - "contract:openspec/changes/pack-and-parallelize-vendor-review/contracts/review-packet.schema.json"
      ttl_minutes: 60
      reason: "Freeze packet format"
    scope:
      write_allow:
        - "openspec/changes/pack-and-parallelize-vendor-review/contracts/**"
      read_allow:
        - "openspec/changes/pack-and-parallelize-vendor-review/**"
      deny: []
    context_impact:
      surfaces:
        - "apis"
      rationale:
        capabilities:
          reason: "Schemas only; spec delta is owned by wp-packet."
          approved_by: "plan-feature"
        documentation:
          reason: "No user-facing docs in this package."
          approved_by: "plan-feature"
    worktree:
      name: wp-contracts
      mode: isolated
    verification:
      tier_required: C
      steps:
        - name: "Packet schema syntax validation"
          kind: command
          command: "skills/.venv/bin/python -c 'import json; from jsonschema import Draft202012Validator as V; V.check_schema(json.load(open(\"openspec/changes/pack-and-parallelize-vendor-review/contracts/review-packet.schema.json\")))'"
          evidence:
            artifacts: []
            result_keys: ["schemas_parse"]
    outputs:
      result_keys: ["schemas_parse"]
    metadata:
      loc_estimate: 80
      package_kind: data_model

  - package_id: wp-packet
    title: "Review packet builder"
    task_type: implement
    description: "review_packet.py plus converge() passing the packet path into dispatch."
    role: implementer
    priority: 2
    depends_on: ["wp-contracts"]
    timeout_minutes: 60
    retry_budget: 1
    min_trust_level: 2
    locks:
      files:
        - "skills/parallel-infrastructure/scripts/review_packet.py"
        - "skills/autopilot/scripts/convergence_loop.py"
      keys:
        - "feature:pack-and-parallelize-vendor-review:packet"
      ttl_minutes: 120
      reason: "Packet builder"
    scope:
      write_allow:
        - "skills/parallel-infrastructure/scripts/review_packet.py"
        - "skills/tests/parallel-infrastructure/test_review_packet.py"
        - "skills/tests/parallel-infrastructure/test_review_packet_schema.py"
        - "skills/autopilot/scripts/convergence_loop.py"
        - "skills/tests/autopilot/test_convergence_loop.py"
      read_allow:
        - "skills/**"
        - "openspec/changes/pack-and-parallelize-vendor-review/**"
      deny: []
    context_impact:
      surfaces:
        - "capabilities"
        - "semantic_code"
    worktree:
      name: wp-packet
      mode: isolated
    verification:
      tier_required: B
      steps:
        - name: "Packet unit tests"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/parallel-infrastructure/test_review_packet.py skills/tests/parallel-infrastructure/test_review_packet_schema.py -q"
          evidence:
            artifacts: []
            result_keys: ["packet_tests"]
    outputs:
      result_keys: ["packet_tests"]
    metadata:
      loc_estimate: 280
      package_kind: config

  - package_id: wp-parallel
    title: "Concurrent review dispatch"
    task_type: implement
    description: "Concurrent dispatch_and_wait, async submit overlap, snapshot fallback."
    role: implementer
    priority: 3
    depends_on: ["wp-packet"]
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    locks:
      files:
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
      keys:
        - "feature:pack-and-parallelize-vendor-review:parallel"
      ttl_minutes: 120
      reason: "Concurrent dispatch"
    scope:
      write_allow:
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
        - "skills/parallel-infrastructure/scripts/tests/**"
        - "skills/tests/parallel-infrastructure/test_review_packet_dispatch.py"
      read_allow:
        - "skills/**"
        - "openspec/changes/pack-and-parallelize-vendor-review/**"
      deny: []
    context_impact:
      surfaces:
        - "capabilities"
        - "semantic_code"
    worktree:
      name: wp-parallel
      mode: isolated
    verification:
      tier_required: B
      steps:
        - name: "Concurrency unit tests"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/parallel-infrastructure/scripts/tests/test_review_dispatcher.py -q -k concurrent"
          evidence:
            artifacts: []
            result_keys: ["concurrency_tests"]
    outputs:
      result_keys: ["concurrency_tests"]
    metadata:
      loc_estimate: 250
      package_kind: integration

  - package_id: wp-structured
    title: "Verified structured-output wiring"
    task_type: implement
    description: "Empirical probe table plus agents.yaml review args only for verified vendors."
    role: implementer
    priority: 3
    depends_on: ["wp-contracts"]
    timeout_minutes: 60
    retry_budget: 1
    min_trust_level: 2
    locks:
      files:
        - "agent-coordinator/agents.yaml"
        - "openspec/changes/pack-and-parallelize-vendor-review/contracts/vendor-structured-output.md"
      keys:
        - "feature:pack-and-parallelize-vendor-review:structured"
      ttl_minutes: 120
      reason: "Structured output flags"
    scope:
      write_allow:
        - "agent-coordinator/agents.yaml"
        - "openspec/changes/pack-and-parallelize-vendor-review/contracts/vendor-structured-output.md"
      read_allow:
        - "agent-coordinator/**"
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
        - "openspec/changes/pack-and-parallelize-vendor-review/**"
      deny: []
    context_impact:
      surfaces:
        - "documentation"
        - "apis"
      rationale:
        capabilities:
          reason: "agents.yaml wiring only; spec delta already in wp-packet."
          approved_by: "plan-feature"
    worktree:
      name: wp-structured
      mode: isolated
    verification:
      tier_required: C
      steps:
        - name: "agents.yaml still loads"
          kind: command
          command: "skills/.venv/bin/python -c 'import yaml; yaml.safe_load(open(\"agent-coordinator/agents.yaml\"))'"
          evidence:
            artifacts: []
            result_keys: ["agents_yaml_loads"]
    outputs:
      result_keys: ["agents_yaml_loads"]
    metadata:
      loc_estimate: 80
      package_kind: config

  - package_id: wp-integration
    title: "Validate packed parallel review"
    task_type: integrate
    description: "Packet-plus-concurrency fixture plus openspec validate."
    role: integrator
    priority: 4
    depends_on: ["wp-parallel", "wp-structured"]
    timeout_minutes: 45
    retry_budget: 1
    min_trust_level: 2
    locks:
      files: []
      keys:
        - "feature:pack-and-parallelize-vendor-review:integration"
      ttl_minutes: 60
      reason: "Integration"
    scope:
      write_allow:
        - "skills/tests/parallel-infrastructure/test_review_packet_dispatch.py"
        - "openspec/changes/pack-and-parallelize-vendor-review/tasks.md"
      read_allow:
        - "skills/**"
        - "openspec/**"
      deny: []
    context_impact:
      surfaces:
        - "semantic_code"
      rationale:
        capabilities:
          reason: "Tests only."
          approved_by: "plan-feature"
        documentation:
          reason: "No docs in this package."
          approved_by: "plan-feature"
    worktree:
      name: wp-integration
      mode: isolated
    verification:
      tier_required: B
      steps:
        - name: "OpenSpec strict validate"
          kind: command
          command: "openspec validate pack-and-parallelize-vendor-review --strict"
          evidence:
            artifacts: []
            result_keys: ["openspec_valid"]
    outputs:
      result_keys: ["openspec_valid"]
    metadata:
      loc_estimate: 100
      package_kind: integration
