openapi: 3.1.0
info:
  title: Dispatch sandbox policy and audit API
  version: 1.0.0
paths:
  /policies/network/export:
    get:
      operationId: exportNetworkPolicy
      summary: Export the active default-deny network policy for one exact agent
      description: Uses the existing coordinator trust vocabulary (integer 0-4); cross-agent export requires level 3.
      x-cross-agent-min-trust-level: 3
      security:
        - apiKey: []
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: Versioned policy snapshot
          content:
            application/json:
              schema:
                $ref: "./network-policy-export.schema.json"
        "401": {description: Unauthenticated}
        "403": {description: Caller is neither the target agent nor a trust-level-3 dispatcher}
        "404": {description: Exact agent profile does not exist}
        "409": {description: Exact agent profile is disabled or has no active assignment}
        "422": {description: Invalid or unrenderable policy}
        "503": {description: Policy storage unavailable; caller must fail closed before vendor launch}
  /dispatch/sandbox-events:
    post:
      operationId: recordSandboxExecutionEvent
      summary: Durably append a narrow sandbox execution audit event
      description: The server derives actor and created_at; event_id is the idempotency key. Cross-agent writes use the existing 0-4 trust vocabulary and require level 3.
      x-cross-agent-min-trust-level: 3
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./sandbox-execution-event.schema.json"
      responses:
        "200":
          description: Idempotent replay; original durable row returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, event_id, audit_entry_id, replayed]
                properties:
                  success: {const: true}
                  event_id: {type: string, format: uuid}
                  audit_entry_id: {type: string, minLength: 1}
                  replayed: {const: true}
        "201":
          description: Event durably inserted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, event_id, audit_entry_id, replayed]
                properties:
                  success: {const: true}
                  event_id: {type: string, format: uuid}
                  audit_entry_id: {type: string, minLength: 1}
                  replayed: {const: false}
        "401": {description: Unauthenticated}
        "403": {description: Caller lacks trust to record an event for the target agent}
        "409": {description: Event id already exists with different actor, target, or content}
        "422": {description: Invalid event}
        "503": {description: Durable audit storage unavailable}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
