schema_version: 1

feature:
  id: rescope-merge-pull-requests-to-plan-execute
  title: "Invert merge-pull-requests to a plan-then-execute conductor"
  plan_revision: 1
  created_by: grok
  created_at: "2026-09-10T17:50:00Z"
  deployable: false

contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/rescope-merge-pull-requests-to-plan-execute/contracts/README.md"
    files:
      - "openspec/changes/rescope-merge-pull-requests-to-plan-execute/contracts/README.md"
      - "openspec/changes/rescope-merge-pull-requests-to-plan-execute/contracts/merge-plan.schema.json"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 60
  retry_budget: 2
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-contracts
    title: "Merge-plan schema 1.1"
    task_type: contracts
    description: |
      Tasks 1.1–1.2: validate schema 1.1 as Draft 2020-12 and copy it onto
      skills/merge-pull-requests/contracts/merge-plan.schema.json. Coordination
      boundary for all downstream packages.
    role: contracts-author
    priority: 1
    depends_on: []
    locks:
      files:
        - "skills/merge-pull-requests/contracts/merge-plan.schema.json"
      keys:
        - "contract:merge-plan.schema.json"
      ttl_minutes: 60
      reason: "Schema 1.1 is the coordination boundary"
    scope:
      write_allow:
        - "openspec/changes/rescope-merge-pull-requests-to-plan-execute/contracts/**"
        - "skills/merge-pull-requests/contracts/**"
      read_allow:
        - "**"
    context_impact:
      surfaces: []
    worktree:
      name: merge-pr-wp-contracts
      mode: isolated
    timeout_minutes: 30
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: C
      steps:
        - name: "Schema 1.1 validates as Draft 2020-12"
          kind: command
          command: "skills/.venv/bin/python -c \"import json, jsonschema; jsonschema.Draft202012Validator.check_schema(json.load(open('openspec/changes/rescope-merge-pull-requests-to-plan-execute/contracts/merge-plan.schema.json')))\""
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "contracts_valid"
    metadata:
      loc_estimate: 80
      complexity: low
      package_kind: config
    inputs: {}
    outputs:
      result_keys:
        - "contracts_valid"
      artifacts:
        - "skills/merge-pull-requests/contracts/merge-plan.schema.json"

  - package_id: wp-plan-builder
    title: "Kind classification plus plan builder"
    task_type: implementation
    description: |
      Tasks 2.1–2.6: classify_kind heuristic and operator override, CI-failure
      class, render_plan 1.1 columns. Writes build_plan/merge_plan/render_plan
      plus a new classify_kind module.
    role: implementer
    priority: 2
    depends_on:
      - wp-contracts
    locks:
      files:
        - "skills/merge-pull-requests/scripts/build_plan.py"
        - "skills/merge-pull-requests/scripts/merge_plan.py"
        - "skills/merge-pull-requests/scripts/render_plan.py"
      keys: []
      ttl_minutes: 120
      reason: "Plan-builder scripts"
    scope:
      write_allow:
        - "skills/merge-pull-requests/scripts/build_plan.py"
        - "skills/merge-pull-requests/scripts/merge_plan.py"
        - "skills/merge-pull-requests/scripts/render_plan.py"
        - "skills/merge-pull-requests/scripts/classify_kind.py"
        - "skills/merge-pull-requests/scripts/tests/test_build_plan.py"
        - "skills/merge-pull-requests/scripts/tests/test_merge_plan_contract.py"
        - "skills/merge-pull-requests/scripts/tests/test_merge_plan_renderer.py"
        - "skills/merge-pull-requests/scripts/tests/test_classify_kind.py"
      read_allow:
        - "**"
      deny:
        - "skills/merge-pull-requests/scripts/execute_plan.py"
        - "skills/merge-pull-requests/SKILL.md"
    context_impact:
      surfaces: []
    worktree:
      name: merge-pr-wp-plan-builder
      mode: isolated
    timeout_minutes: 90
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Plan-builder unit tests"
          kind: command
          command: "skills/.venv/bin/pytest skills/merge-pull-requests/scripts/tests/test_build_plan.py skills/merge-pull-requests/scripts/tests/test_classify_kind.py skills/merge-pull-requests/scripts/tests/test_merge_plan_renderer.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "plan_builder_tests"
    metadata:
      loc_estimate: 400
      complexity: medium
      package_kind: data_model
    inputs: {}
    outputs:
      result_keys:
        - "plan_builder_tests"

  - package_id: wp-execute-kernel
    title: "execute_plan kernel routing"
    task_type: implementation
    description: |
      Tasks 3.1–3.7: delegation_commands by kind, skip vendor_review.py when
      iterate consensus HEAD matches, cheap-path merge policy, characterization
      that the kernel never checkouts the PR branch.
    role: implementer
    priority: 2
    depends_on:
      - wp-contracts
    locks:
      files:
        - "skills/merge-pull-requests/scripts/execute_plan.py"
        - "skills/merge-pull-requests/scripts/execution_safety.py"
      keys: []
      ttl_minutes: 120
      reason: "Execute-plan kernel"
    scope:
      write_allow:
        - "skills/merge-pull-requests/scripts/execute_plan.py"
        - "skills/merge-pull-requests/scripts/execution_safety.py"
        - "skills/merge-pull-requests/scripts/tests/test_execute_plan.py"
        - "skills/merge-pull-requests/scripts/tests/test_execute_plan_concurrency.py"
      read_allow:
        - "**"
      deny:
        - "skills/merge-pull-requests/SKILL.md"
        - "skills/merge-pull-requests/scripts/build_plan.py"
    context_impact:
      surfaces: []
    worktree:
      name: merge-pr-wp-execute-kernel
      mode: isolated
    timeout_minutes: 90
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Execute-plan unit tests"
          kind: command
          command: "skills/.venv/bin/pytest skills/merge-pull-requests/scripts/tests/test_execute_plan.py skills/merge-pull-requests/scripts/tests/test_execute_plan_concurrency.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "execute_kernel_tests"
    metadata:
      loc_estimate: 350
      complexity: medium
      package_kind: algorithm
    inputs: {}
    outputs:
      result_keys:
        - "execute_kernel_tests"

  - package_id: wp-conductor
    title: "SKILL.md conductor plus next_node helper"
    task_type: implementation
    description: |
      Tasks 4.1–4.4 and 5.1–5.3 plus 6.3: next_node helper, iterate precondition
      check, invert SKILL.md default path, compact/sync-point prose, merge-log
      template.
    role: implementer
    priority: 3
    depends_on:
      - wp-plan-builder
      - wp-execute-kernel
    locks:
      files:
        - "skills/merge-pull-requests/SKILL.md"
      keys:
        - "feature:rescope-merge-pull-requests-to-plan-execute:pause"
      ttl_minutes: 120
      reason: "Conductor SKILL.md"
    scope:
      write_allow:
        - "skills/merge-pull-requests/SKILL.md"
        - "skills/merge-pull-requests/scripts/next_node.py"
        - "skills/merge-pull-requests/scripts/iterate_preconditions.py"
        - "skills/merge-pull-requests/scripts/tests/test_next_node.py"
        - "skills/merge-pull-requests/scripts/tests/test_iterate_preconditions.py"
        - "skills/tests/merge-pull-requests/**"
      read_allow:
        - "**"
      deny:
        - "skills/merge-pull-requests/scripts/execute_plan.py"
        - "skills/merge-pull-requests/scripts/build_plan.py"
    context_impact:
      surfaces:
        - documentation
    worktree:
      name: merge-pr-wp-conductor
      mode: isolated
    timeout_minutes: 90
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Conductor helper tests"
          kind: command
          command: "skills/.venv/bin/pytest skills/merge-pull-requests/scripts/tests/test_next_node.py skills/merge-pull-requests/scripts/tests/test_iterate_preconditions.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "conductor_tests"
    metadata:
      loc_estimate: 500
      complexity: medium
      package_kind: integration
    inputs: {}
    outputs:
      result_keys:
        - "conductor_tests"

  - package_id: wp-integration
    title: "Purpose line plus conductor integration tests"
    task_type: integration
    description: |
      Tasks 6.1–6.2: set spec Purpose, integration tests for one plan node, one
      implementation node, one cheap-path node through classify → next_node →
      delegation → cheap-path merge stub.
    role: integrator
    priority: 4
    depends_on:
      - wp-conductor
    locks:
      files:
        - "openspec/specs/merge-pull-requests/spec.md"
      keys: []
      ttl_minutes: 60
      reason: "Integration plus spec Purpose"
    scope:
      write_allow:
        - "openspec/specs/merge-pull-requests/spec.md"
        - "skills/merge-pull-requests/scripts/tests/test_plan_execute_conductor.py"
      read_allow:
        - "**"
    context_impact:
      surfaces:
        - capabilities
    worktree:
      name: merge-pr-wp-integration
      mode: isolated
    timeout_minutes: 60
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Conductor integration tests"
          kind: command
          command: "skills/.venv/bin/pytest skills/merge-pull-requests/scripts/tests/test_plan_execute_conductor.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "integration_tests"
        - name: "openspec validate --strict"
          kind: command
          command: "openspec validate rescope-merge-pull-requests-to-plan-execute --strict"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "openspec_valid"
    metadata:
      loc_estimate: 200
      complexity: medium
      package_kind: integration
    inputs: {}
    outputs:
      result_keys:
        - "integration_tests"
        - "openspec_valid"
