schema_version: 1

feature:
  id: add-infeasible-incumbent-fallback
  title: "Configured fallback for an unavailable incumbent"
  plan_revision: 1
  created_by: claude_code
  created_at: "2026-10-05T00:00:00Z"
  deployable: true

contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/add-infeasible-incumbent-fallback/contracts/openapi/v1.4.yaml"
    files:
      - "openspec/changes/add-infeasible-incumbent-fallback/contracts/openapi/v1.4.yaml"
      - "openspec/changes/add-infeasible-incumbent-fallback/contracts/events/routing-decision-record.schema.json"
      - "openspec/changes/add-infeasible-incumbent-fallback/contracts/generated/models.py"

defaults:
  priority: 5
  lock_ttl_minutes: 180
  timeout_minutes: 150
  retry_budget: 1
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-dispatch
    title: "Dispatch honors the resolved provider; default provider before resolution"
    task_type: implementation
    description: >-
      Phase 1 (design D1, D2). Skills-only and independent of the v1.3/v1.4 contract
      chain, so it can be implemented and merged first. Must merge before wp-router: a
      cross-vendor fallback over unfixed dispatch produces mismatched model/vendor pairs.
    role: implementation
    priority: 1
    depends_on: []
    timeout_minutes: 120
    retry_budget: 1
    min_trust_level: 2
    locks:
      files:
        - "skills/autopilot/scripts/phase_agent.py"
        - "skills/autopilot/scripts/smoke_provider_dispatch.py"
        - "skills/autopilot/SKILL.md"
      keys: []
      ttl_minutes: 120
      reason: "Autopilot dispatch must honor the resolved provider"
    scope:
      write_allow:
        - "skills/autopilot/**"
        - "skills/tests/autopilot/**"
        - "openspec/changes/add-infeasible-incumbent-fallback/tasks.md"
      read_allow:
        - "**"
      deny:
        - "agent-coordinator/**"
        - "openspec/specs/**"
        - "openspec/changes/archive/**"
    context_impact:
      surfaces:
        - "semantic_code"      # phase_agent dispatch path
        - "documentation"      # autopilot SKILL.md adapter contract
    worktree:
      name: wp-dispatch
      mode: isolated
    verification:
      tier_required: B
      steps:
        - name: "Autopilot skill tests"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/autopilot -q"
          evidence:
            artifacts:
              - "skills/tests/autopilot"
            result_keys: ["autopilot_tests_pass"]
        - name: "Skill install payload"
          kind: command
          command: "cd skills && bash install.sh --check"
          evidence:
            artifacts:
              - "skills/autopilot"
            result_keys: ["install_check_pass"]
    outputs:
      result_keys: ["autopilot_tests_pass", "install_check_pass"]
    metadata:
      loc_estimate: 150
      package_kind: integration

  - package_id: wp-router
    title: "Configured fallback for a transiently unavailable incumbent (v1.4)"
    task_type: implementation
    description: >-
      HOLD (design D8, operator decision 2026-10-10): do NOT dispatch in the run that lands
      wp-dispatch. Starts only after split-no-evidence-retention-reason (v1.3) has merged to
      main and after wp-dispatch has merged; task 2.0 fails fast otherwise. Phase 2 (design
      D3-D7). Threads exclusion reasons into retention, adds the FallbackOrder.vendor_order
      allowlist, implements the deterministic configured pick, persists retention.fallback,
      applies the local trust boundary to routed selections, and teaches the client-side
      routing_fallback.py to validate the new key.
    role: implementation
    priority: 2
    depends_on: ["wp-dispatch"]
    timeout_minutes: 180
    retry_budget: 1
    min_trust_level: 2
    locks:
      files:
        - "agent-coordinator/src/model_routing/resolver.py"
        - "agent-coordinator/src/model_routing/api.py"
        - "agent-coordinator/src/model_routing/routing_policy.py"
        - "agent-coordinator/src/agents_config.py"
        - "agent-coordinator/routing.yaml"
        - "skills/coordination-bridge/scripts/routing_fallback.py"
      keys:
        - "api:POST /routing/select_model"
      ttl_minutes: 180
      reason: "New retention reason and configured fallback in select_model"
    scope:
      write_allow:
        - "agent-coordinator/src/model_routing/**"
        - "agent-coordinator/src/agents_config.py"
        - "agent-coordinator/routing.yaml"
        - "agent-coordinator/tests/model_routing/**"
        - "agent-coordinator/tests/test_phase_archetype_resolution.py"
        - "agent-coordinator/CLAUDE.md"
        - "skills/coordination-bridge/scripts/routing_fallback.py"
        - "skills/tests/coordination-bridge/**"
        - "openspec/changes/add-infeasible-incumbent-fallback/**"
      read_allow:
        - "**"
      deny:
        - "skills/autopilot/**"
        - "openspec/specs/**"
        - "openspec/changes/archive/**"
        - "agent-coordinator/database/migrations/**"
    context_impact:
      surfaces:
        - "apis"               # contracts/openapi/v1.4.yaml
        - "capabilities"       # specs/model-routing, specs/agent-archetypes
        - "semantic_code"      # resolver, api, routing_policy, routing_fallback
        - "documentation"      # agent-coordinator/CLAUDE.md reason list
    worktree:
      name: wp-router
      mode: isolated
    verification:
      tier_required: B
      steps:
        - name: "Model-routing suite"
          kind: command
          command: "cd agent-coordinator && uv run pytest tests/model_routing -q"
          evidence:
            artifacts:
              - "agent-coordinator/tests/model_routing"
            result_keys: ["routing_suite_pass"]
        - name: "Coordinator unit suite"
          kind: command
          command: "cd agent-coordinator && uv run pytest -m 'not e2e and not integration' -q"
          evidence:
            artifacts:
              - "agent-coordinator/tests"
            result_keys: ["coordinator_suite_pass"]
        - name: "Strict typing"
          kind: command
          command: "cd agent-coordinator && uv run mypy --strict src/"
          evidence:
            artifacts:
              - "agent-coordinator/src/model_routing"
            result_keys: ["mypy_clean"]
        - name: "Coordination-bridge skill tests (client fallback loader)"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/coordination-bridge -q"
          evidence:
            artifacts:
              - "skills/tests/coordination-bridge"
            result_keys: ["bridge_tests_pass"]
        - name: "Skill install payload"
          kind: command
          command: "cd skills && bash install.sh --check"
          evidence:
            artifacts:
              - "skills/coordination-bridge"
            result_keys: ["install_check_pass"]
    inputs:
      hold: "Do not dispatch until split-no-evidence-retention-reason (v1.3) has merged to main (operator decision 2026-10-10, design D8)"
      external_prerequisites:
        - "openspec change split-no-evidence-retention-reason merged to main (provides contracts/openapi/v1.3.yaml)"
        - "wp-dispatch merged to main"
    outputs:
      result_keys: ["routing_suite_pass", "coordinator_suite_pass", "mypy_clean", "bridge_tests_pass", "install_check_pass"]
    metadata:
      loc_estimate: 450
      package_kind: algorithm
