schema_version: 1

feature:
  id: add-deterministic-context-producer-checks
  title: "Deterministic project-context producer checks"
  plan_revision: 1
  created_by: codex-autopilot-roadmap
  created_at: "2026-07-23T00:00:00Z"

contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/add-deterministic-context-producer-checks/contracts/README.md"
    files:
      - "openspec/changes/add-deterministic-context-producer-checks/contracts/README.md"
      - "openspec/changes/add-durable-context-refresh-records/contracts/context-refresh-types.schema.json"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 120
  retry_budget: 2
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-producer-core
    title: "Producer protocol and documentation inventory"
    task_type: implementation
    description: |
      Tasks 1.1-2.4. Implement the producer registry by consuming ri-06
      project-context-runtime models, then
      absorb the marker-preserving documentation renderer from the superseded
      add-update-documentation-skill proposal and neutralize that complete
      competing change.
    role: python-engineer
    archetype: implementer
    priority: 1
    depends_on: []
    locks:
      files:
        - "openspec/changes/add-update-documentation-skill"
      keys:
        - "feature:project-context:protocol"
    scope:
      write_allow:
        - "skills/project-context-refresh/**"
        - "skills/tests/project-context-refresh/**"
        - "openspec/changes/add-update-documentation-skill/**"
      read_allow:
        - "**"
      deny:
        - "agent-coordinator/**"
    worktree:
      name: context-producer-core
      mode: isolated
    timeout_minutes: 120
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Producer core and documentation tests"
          kind: command
          command: "uv run --project skills pytest skills/tests/project-context-refresh -q -k 'protocol or documentation'"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["producer_core_tests"]
    metadata:
      loc_estimate: 900
      complexity: medium
      package_kind: algorithm
    inputs:
      roadmap_dependencies:
        - "add-durable-context-refresh-records"
      contracts:
        - "skills/project-context-runtime/scripts/models.py"
        - "skills/project-context-runtime/install_assets/openspec/schemas/context-refresh-types.schema.json"
    outputs:
      result_keys: ["producer_core_tests"]

  - package_id: wp-domain-adapters
    title: "API, decision, and OpenSpec producer adapters"
    task_type: implementation
    description: |
      Tasks 3.1-4.3. Adapt existing workflow-contract, decision-index, and
      update-specs projection logic to the producer protocol without transferring
      domain ownership or mutating canonical specs in check mode. Every adapter
      returns the ri-06 ProducerResult model.
    role: python-engineer
    archetype: implementer
    priority: 2
    depends_on: [wp-producer-core]
    locks:
      files:
        - "skills/explore-feature/scripts/decision_index.py"
      keys:
        - "feature:project-context:adapters"
    scope:
      write_allow:
        - "skills/project-context-refresh/**"
        - "skills/tests/project-context-refresh/**"
        - "skills/explore-feature/scripts/decision_index.py"
        - "skills/explore-feature/tests/test_decision_index.py"
        - "skills/update-specs/**"
        - "skills/tests/update-specs/**"
        - "Makefile"
      read_allow:
        - "**"
      deny:
        - "openspec/specs/**"
        - "agent-coordinator/**"
    worktree:
      name: context-producer-adapters
      mode: isolated
    timeout_minutes: 180
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Domain adapter tests"
          kind: command
          command: "uv run --project skills pytest skills/tests/project-context-refresh skills/explore-feature/tests/test_decision_index.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["adapter_tests"]
    metadata:
      loc_estimate: 1000
      complexity: high
      package_kind: integration
    inputs:
      roadmap_dependencies:
        - "add-durable-context-refresh-records"
      contracts:
        - "skills/project-context-runtime/scripts/models.py"
    outputs:
      result_keys: ["adapter_tests"]

  - package_id: wp-integration
    title: "Producer registry integration and deterministic verification"
    task_type: validation
    description: |
      Tasks 5.1-5.3. Register all four owners, exercise repeat generation and
      side-effect-free checks, validate every result against the installed ri-06
      schema, validate OpenSpec/work-package artifacts, and verify installed skill
      portability.
    role: integration-engineer
    archetype: validator
    priority: 3
    depends_on: [wp-domain-adapters]
    locks:
      files: []
      keys:
        - "feature:project-context:integration"
    scope:
      write_allow:
        - "skills/project-context-refresh/**"
        - "skills/tests/project-context-refresh/**"
      read_allow:
        - "**"
      deny:
        - "openspec/specs/**"
    worktree:
      name: context-producer-integration
      mode: isolated
    timeout_minutes: 120
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "All producer tests and portability checks"
          kind: command
          command: "uv run --project skills pytest skills/tests/project-context-refresh -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["integration_tests"]
    metadata:
      loc_estimate: 300
      complexity: medium
      package_kind: integration
    inputs:
      roadmap_dependencies:
        - "add-durable-context-refresh-records"
      contracts:
        - "skills/project-context-runtime/install_assets/openspec/schemas/context-refresh-types.schema.json"
    outputs:
      result_keys: ["integration_tests"]
