schema_version: 1

feature:
  id: add-prime-agent-harness
  title: "Add Prime Intellect prime-agent as a first-class harness"
  plan_revision: 2
  created_by: codex

contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/add-prime-agent-harness/contracts/openapi/v1.yaml"
    files:
      - "openspec/changes/add-prime-agent-harness/contracts/openapi/v1.yaml"
      - "openspec/changes/add-prime-agent-harness/contracts/README.md"
      - "openspec/changes/add-prime-agent-harness/contracts/roster.md"
      - "openspec/changes/add-prime-agent-harness/contracts/cli-dispatch-config.schema.json"
      - "openspec/changes/add-prime-agent-harness/contracts/provider-model-map.schema.json"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 60
  retry_budget: 2
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-contracts
    title: "Freeze and validate Prime roster and dispatch contracts"
    task_type: contracts
    description: |
      Validate the roster, provider-model-map v3, CLI cleanup schema, and existing
      GET /agents/dispatch-configs OpenAPI projection before empirical or
      implementation work begins. This package is read-only: contract revisions are
      a planning action, not an implementation-side convenience.
    role: contracts-author
    priority: 1
    depends_on: []
    locks:
      files: []
      keys:
        - "contract:prime-harness-roster"
        - "contract:prime-cli-dispatch-config"
        - "contract:provider-model-map-v3"
      ttl_minutes: 60
      reason: "Freeze producer/consumer vocabulary before parallel implementation"
    scope:
      write_allow: []
      read_allow:
        - "openspec/changes/add-prime-agent-harness/contracts/**"
        - "openspec/changes/add-prime-agent-harness/specs/**"
    context_impact:
      surfaces:
        - "apis"
        - "capabilities"
    worktree:
      name: prime-wp-contracts
      mode: isolated
    timeout_minutes: 30
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: C
      steps:
        - name: "Contract schemas and OpenAPI parse"
          kind: command
          command: "skills/.venv/bin/python -c \"import json,yaml;from jsonschema import Draft202012Validator as V;[V.check_schema(json.load(open(p))) for p in ['openspec/changes/add-prime-agent-harness/contracts/cli-dispatch-config.schema.json','openspec/changes/add-prime-agent-harness/contracts/provider-model-map.schema.json']];yaml.safe_load(open('openspec/changes/add-prime-agent-harness/contracts/openapi/v1.yaml'))\""
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["contracts_valid"]
    outputs:
      result_keys: ["contracts_valid"]

  - package_id: wp-empirical
    title: "Empirical Prime CLI facts and human checkpoint"
    task_type: discovery
    description: |
      Tasks 1.1-1.5. Record P1-P9 with command/output evidence and resolve the four
      proposal decisions. P7 chooses whether prime-local populates the already
      supported cleanup object and must determine whether cleanup is per-session or
      global. The human checkpoint blocks every implementation package.
    role: runner
    priority: 2
    depends_on: [wp-contracts]
    locks:
      files:
        - "openspec/changes/add-prime-agent-harness/design.md"
      keys:
        - "contract:prime-empirical-cli-facts"
        - "env:prime_api_key"
      ttl_minutes: 90
      reason: "Downstream packages consume measured flags, models, auth, and lifecycle facts"
    scope:
      write_allow:
        - "openspec/changes/add-prime-agent-harness/design.md"
        - "openspec/changes/add-prime-agent-harness/proposal.md"
        - "openspec/changes/add-prime-agent-harness/tasks.md"
        - "openspec/changes/add-prime-agent-harness/validation/phase-1/**"
      read_allow:
        - "**"
    context_impact:
      surfaces:
        - "capabilities"
        - "decisions"
        - "documentation"
    worktree:
      name: prime-wp-empirical
      mode: isolated
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 3
    verification:
      tier_required: C
      steps:
        - name: "Human review of P1-P9 evidence"
          kind: manual
          manual_instructions: "Confirm every P1-P9 row is confirmed or refuted with command/output evidence, billed calls were authorized, and global cleanup cannot terminate unrelated sessions."
          evidence:
            artifacts:
              - "openspec/changes/add-prime-agent-harness/design.md"
            result_keys: ["empirical_gate_approved"]
    outputs:
      result_keys: ["empirical_gate_approved"]
      artifacts:
        - "openspec/changes/add-prime-agent-harness/design.md"

  - package_id: wp-coordinator-config
    title: "Coordinator registry, model map, identity, and cleanup projection"
    task_type: backend
    description: |
      Tasks 2.1-2.4, 2.7, and 3.4a. Add prime-local and provider tiers; bump the
      provider-map contract; implement the optional cleanup schema/dataclass/parser
      and get_dispatch_configs HTTP/MCP projection. Prove setup-cloud generically
      derives prime_local_key/--prime-local-key/cprime-agent while PRIME_API_KEY
      remains only cli.api_key_env.
    role: implementer
    priority: 3
    depends_on: [wp-empirical]
    locks:
      files:
        - "agent-coordinator/agents.yaml"
        - "agent-coordinator/archetypes.yaml"
        - "agent-coordinator/src/agents_config.py"
        - "openspec/schemas/provider-model-map.schema.json"
      keys:
        - "contract:prime-coordinator-config"
        - "api:GET /agents/dispatch-configs"
      ttl_minutes: 120
      reason: "Canonical producer for registry, identity, model, and lifecycle config"
    scope:
      write_allow:
        - "agent-coordinator/agents.yaml"
        - "agent-coordinator/archetypes.yaml"
        - "agent-coordinator/src/agents_config.py"
        - "agent-coordinator/tests/test_agents_config.py"
        - "agent-coordinator/tests/test_agents_config_isolation.py"
        - "agent-coordinator/tests/test_setup_cloud.py"
        - "agent-coordinator/tests/test_dispatch_configs.py"
        - "agent-coordinator/tests/test_coordination_api.py"
        - "agent-coordinator/tests/test_coordination_mcp.py"
        - "openspec/schemas/provider-model-map.schema.json"
        - "skills/tests/vendor-neutral-autopilot/test_contracts.py"
      read_allow:
        - "**"
    context_impact:
      surfaces:
        - "apis"
        - "capabilities"
        - "semantic_code"
    worktree:
      name: prime-wp-coordinator-config
      mode: isolated
    timeout_minutes: 150
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Coordinator config and identity tests pass"
          kind: command
          command: "agent-coordinator/.venv/bin/python -m pytest agent-coordinator/tests/test_agents_config.py agent-coordinator/tests/test_agents_config_isolation.py agent-coordinator/tests/test_setup_cloud.py agent-coordinator/tests/test_dispatch_configs.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["coordinator_config_tests_passed"]
        - name: "Provider contract test passes"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/vendor-neutral-autopilot/test_contracts.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["provider_contract_test_passed"]
    outputs:
      result_keys:
        - "coordinator_config_tests_passed"
        - "provider_contract_test_passed"

  - package_id: wp-coordinator-peripherals
    title: "Coordinator evaluation backend and kanban roster"
    task_type: backend
    description: |
      Tasks 2.5-2.6 and the coordinator portion of 2.8. Add the Prime evaluation
      backend/registry entry and extend the kanban seeder and saved-view enum. This
      package starts after the canonical registry exists and owns no config producer
      files.
    role: implementer
    priority: 4
    depends_on: [wp-coordinator-config]
    locks:
      files:
        - "agent-coordinator/evaluation/backends/prime.py"
        - "agent-coordinator/scripts/seed_kanban_board.py"
      keys:
        - "feature:prime-coordinator-peripherals:implement"
      ttl_minutes: 90
      reason: "Coordinator-tree peripheral roster surfaces"
    scope:
      write_allow:
        - "agent-coordinator/evaluation/backends/prime.py"
        - "agent-coordinator/evaluation/backends/registry.py"
        - "agent-coordinator/tests/test_evaluation/**"
        - "agent-coordinator/scripts/seed_kanban_board.py"
        - "agent-coordinator/src/schemas/kanban_viz/saved-view.json"
        - "agent-coordinator/tests/test_seed_kanban_board.py"
        - "agent-coordinator/tests/test_kanban_viz_endpoints.py"
      read_allow:
        - "**"
    context_impact:
      surfaces:
        - "apis"
        - "semantic_code"
    worktree:
      name: prime-wp-coordinator-peripherals
      mode: isolated
    timeout_minutes: 120
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Evaluation and kanban tests pass"
          kind: command
          command: "agent-coordinator/.venv/bin/python -m pytest agent-coordinator/tests/test_evaluation agent-coordinator/tests/test_seed_kanban_board.py agent-coordinator/tests/test_kanban_viz_endpoints.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["coordinator_peripheral_tests_passed"]
    outputs:
      result_keys: ["coordinator_peripheral_tests_passed"]

  - package_id: wp-dispatch-skills
    title: "Dispatch allow-lists, cleanup consumer, and consensus contracts"
    task_type: backend
    description: |
      Tasks 3.1-3.5 and the dispatch portion of 3.8. Extend provider allow-lists and
      consensus schemas. Parse the projected cleanup object and execute it exactly
      once without a shell after every launched attempt. Cleanup failure is
      fail-closed for quorum, secrets are minimized, and P7's concurrency rule is
      enforced.
    role: implementer
    priority: 4
    depends_on: [wp-coordinator-config]
    locks:
      files:
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
      keys:
        - "contract:prime-dispatch-consumer"
      ttl_minutes: 120
      reason: "Consumer of the coordinator dispatch-config projection"
    scope:
      write_allow:
        - "skills/autopilot/scripts/provider_dispatch.py"
        - "skills/autopilot/scripts/token_budget_check.py"
        - "skills/autopilot/scripts/smoke_provider_dispatch.py"
        - "skills/autopilot-roadmap/scripts/orchestrator.py"
        - "skills/autopilot-roadmap/scripts/policy.py"
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
        - "skills/parallel-infrastructure/scripts/consensus_synthesizer.py"
        - "skills/parallel-infrastructure/install_assets/openspec/schemas/consensus-report.schema.json"
        - "openspec/schemas/consensus-report.schema.json"
        - "skills/tests/autopilot/**"
        - "skills/tests/autopilot-roadmap/**"
        - "skills/tests/parallel-infrastructure/**"
        - "skills/parallel-infrastructure/scripts/tests/**"
      read_allow:
        - "**"
      deny:
        - "skills/*/SKILL.md"
    context_impact:
      surfaces:
        - "apis"
        - "semantic_code"
    worktree:
      name: prime-wp-dispatch-skills
      mode: isolated
    timeout_minutes: 150
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Dispatch lifecycle and allow-list tests pass"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/parallel-infrastructure/scripts/tests/test_review_dispatcher.py skills/tests/parallel-infrastructure skills/tests/autopilot skills/tests/autopilot-roadmap -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["dispatch_tests_passed"]
    outputs:
      result_keys: ["dispatch_tests_passed"]

  - package_id: wp-transcripts-scenarios
    title: "Prime transcript adapter and agent-scenarios command"
    task_type: backend
    description: |
      Tasks 3.6-3.7 and their portion of 3.8. Add the Prime transcript adapter,
      fixtures, normalization registration, and agent-scenarios argv template.
      This package is file-disjoint from the dispatch package and runs in parallel
      after empirical facts are approved.
    role: implementer
    priority: 3
    depends_on: [wp-empirical]
    locks:
      files:
        - "skills/collect-transcripts/scripts/adapters/prime_cli.py"
      keys:
        - "feature:prime-transcript-adapter:implement"
      ttl_minutes: 90
      reason: "Transcript and scenario integration for the new harness"
    scope:
      write_allow:
        - "skills/collect-transcripts/scripts/adapters/prime_cli.py"
        - "skills/collect-transcripts/scripts/normalize.py"
        - "skills/collect-transcripts/tests/**"
        - "packages/agent-scenarios/**"
      read_allow:
        - "**"
      deny:
        - "skills/collect-transcripts/SKILL.md"
        - "skills/collect-transcripts/config.yaml.example"
    context_impact:
      surfaces:
        - "semantic_code"
    worktree:
      name: prime-wp-transcripts-scenarios
      mode: isolated
    timeout_minutes: 120
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Transcript adapter tests pass"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/collect-transcripts/tests -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["transcript_tests_passed"]
        - name: "Agent-scenarios tests pass"
          kind: command
          command: "uv run --project packages/agent-scenarios pytest packages/agent-scenarios/tests -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["agent_scenarios_tests_passed"]
    outputs:
      result_keys:
        - "transcript_tests_passed"
        - "agent_scenarios_tests_passed"

  - package_id: wp-frontend
    title: "Kanban Prime roster fixture"
    task_type: frontend
    description: |
      Tasks 4.1-4.2. Add Prime only to the VendorSwimlanes test fixture; the
      component remains untouched because it derives vendor names generically.
    role: implementer
    priority: 3
    depends_on: [wp-empirical]
    locks:
      files:
        - "apps/kanban-viz/src/__tests__/VendorSwimlanes.test.tsx"
      keys:
        - "feature:prime-kanban-fixture:implement"
      ttl_minutes: 60
      reason: "Frontend roster proof"
    scope:
      write_allow:
        - "apps/kanban-viz/src/__tests__/VendorSwimlanes.test.tsx"
      read_allow:
        - "apps/kanban-viz/**"
      deny:
        - "apps/kanban-viz/src/components/VendorSwimlanes.tsx"
    context_impact:
      surfaces:
        - "semantic_code"
    worktree:
      name: prime-wp-frontend
      mode: isolated
    timeout_minutes: 60
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Kanban frontend tests pass"
          kind: command
          command: "npm --prefix apps/kanban-viz ci && npm --prefix apps/kanban-viz test -- --run"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["frontend_tests_passed"]
    outputs:
      result_keys: ["frontend_tests_passed"]

  - package_id: wp-docs-templates
    title: "Vendor documentation, secrets templates, and runtime prose"
    task_type: documentation
    description: |
      Tasks 5.1-5.4. Update roster prose and templates, including the explicit
      credential boundary: PRIME_API_KEY is operator-supplied provider auth while
      prime_local_key is coordinator identity. Update canonical SKILL.md prose only;
      runtime mirrors are produced later by the integration package.
    role: documenter
    priority: 6
    depends_on:
      - wp-coordinator-peripherals
      - wp-dispatch-skills
      - wp-transcripts-scenarios
      - wp-frontend
    locks:
      files:
        - "README.md"
        - "agent-coordinator/.secrets.yaml.example"
      keys:
        - "contract:prime-operator-documentation"
      ttl_minutes: 90
      reason: "Final roster prose and credential setup after implementation facts settle"
    scope:
      write_allow:
        - "README.md"
        - "agent-coordinator/README.md"
        - "agent-coordinator/CLAUDE.md"
        - "agent-coordinator/.secrets.yaml.example"
        - "agent-coordinator/config.yaml.example"
        - "docs/skills-workflow.md"
        - "docs/autopilot-provider-smoke.md"
        - "skills/*/SKILL.md"
        - "skills/collect-transcripts/config.yaml.example"
        - "openspec/config.yaml"
      read_allow:
        - "**"
    context_impact:
      surfaces:
        - "documentation"
        - "capabilities"
    worktree:
      name: prime-wp-docs-templates
      mode: isolated
    timeout_minutes: 90
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Specs and roster prose validate"
          kind: command
          command: "openspec validate --all --strict"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["docs_specs_valid"]
    outputs:
      result_keys: ["docs_specs_valid"]

  - package_id: wp-integration
    title: "Mirror sync and full integration validation"
    task_type: integration
    description: |
      Tasks 6.1-6.2 and 6.4. Merge the implementation packages, sync runtime skill
      mirrors, validate the package DAG and OpenSpec set, run all four test trees,
      and file the planned follow-ups. Billed live dispatch is intentionally kept
      in the separate wp-live-smoke package.
    role: integrator
    priority: 8
    depends_on: [wp-docs-templates]
    locks:
      files: []
      keys:
        - "feature:add-prime-agent-harness:integration"
      ttl_minutes: 180
      reason: "Single convergence point for package branches"
    scope:
      write_allow:
        - "**"
      read_allow:
        - "**"
    context_impact:
      surfaces:
        - "capabilities"
        - "apis"
        - "documentation"
        - "semantic_code"
    worktree:
      name: prime-wp-integration
      mode: shared
    timeout_minutes: 240
    retry_budget: 2
    min_trust_level: 3
    verification:
      tier_required: A
      steps:
        - name: "Work-package DAG and overlap validate"
          kind: command
          command: "skills/.venv/bin/python skills/validate-packages/scripts/validate_work_packages.py openspec/changes/add-prime-agent-harness/work-packages.yaml --check-overlap"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["package_dag_valid"]
        - name: "Strict OpenSpec validation passes"
          kind: command
          command: "openspec validate --all --strict"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["openspec_valid"]
        - name: "Runtime mirrors and full suites pass"
          kind: command
          command: "bash skills/install.sh && agent-coordinator/.venv/bin/python -m pytest agent-coordinator/tests -q -m 'not e2e' && skills/.venv/bin/python -m pytest skills/tests -q && uv run --project packages/agent-scenarios pytest packages/agent-scenarios/tests -q && npm --prefix apps/kanban-viz ci && npm --prefix apps/kanban-viz test -- --run"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: ["full_suite_green"]
    outputs:
      result_keys:
        - "package_dag_valid"
        - "openspec_valid"
        - "full_suite_green"

  - package_id: wp-live-smoke
    title: "Operator-authorized billed Prime dispatch"
    task_type: validation
    description: |
      Task 6.3. After all automated gates pass, run one authorized dispatch per
      enabled mode. Capture a parseable envelope and process snapshot proving no
      new resident process attributable to this dispatch remains. Never kill or
      count unrelated operator sessions as test residue.
    role: runner
    priority: 9
    depends_on: [wp-integration]
    locks:
      files: []
      keys:
        - "env:prime_api_key"
        - "feature:prime-agent-harness:livesmoke"
      ttl_minutes: 60
      reason: "Serialize billed validation and protect the provider credential"
    scope:
      write_allow:
        - "openspec/changes/add-prime-agent-harness/validation/smoke-6.3/**"
      read_allow:
        - "**"
    context_impact:
      surfaces:
        - "capabilities"
    worktree:
      name: prime-wp-live-smoke
      mode: isolated
    timeout_minutes: 60
    retry_budget: 0
    min_trust_level: 3
    verification:
      tier_required: A
      steps:
        - name: "Human review of billed smoke and daemon hygiene"
          kind: manual
          manual_instructions: "Confirm billed calls were authorized, every enabled mode returned a parseable envelope, and PID snapshots show no new prime-agent process attributable to the dispatch remains."
          evidence:
            artifacts:
              - "openspec/changes/add-prime-agent-harness/validation/smoke-6.3/"
            result_keys: ["live_smoke_passed"]
    outputs:
      result_keys: ["live_smoke_passed"]
      artifacts:
        - "openspec/changes/add-prime-agent-harness/validation/smoke-6.3/"
