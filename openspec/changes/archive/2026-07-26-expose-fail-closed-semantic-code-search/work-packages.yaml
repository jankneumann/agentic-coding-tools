    archetype: implementer
    priority: 1
    depends_on: []
    locks:
      files:
        - "openspec/changes/expose-fail-closed-semantic-code-search/contracts"
        - "openspec/changes/expose-fail-closed-semantic-code-search/tests"
      keys:
        - "contract:semantic-code-search-v2"
        - "api:POST /search/code"
        - "api:GET /search/code/status"
      ttl_minutes: 60
      reason: "Freeze the public fail-closed query boundary"
    scope:
      write_allow:
        - "openspec/changes/expose-fail-closed-semantic-code-search/contracts/**"
        - "openspec/changes/expose-fail-closed-semantic-code-search/tests/**"
      read_allow:
