    worktree:
      name: fail-closed-search-contracts
      mode: isolated
    timeout_minutes: 60
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "OpenAPI contract parses"
          kind: command
          command: "uv run --project skills python -c \"import pathlib,yaml; yaml.safe_load(pathlib.Path('openspec/changes/expose-fail-closed-semantic-code-search/contracts/openapi/v2.yaml').read_text())\""
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "openapi_parses"
    metadata:
      loc_estimate: 180
      complexity: low
      package_kind: integration
    inputs:
      contract_revision: 1
      dependency_change: complete-incremental-semantic-indexing
    outputs:
      result_keys:
