agents:
  antigravity-local:
    type: antigravity
    transport: mcp
    cli:
      command: agy
      dispatch_modes:
        review:
          args: ["--mode", "plan", "--dangerously-skip-permissions"]
      model_flag: "--model"
      model: "gemini-3.6-flash-medium"
      model_fallbacks: ["gemini-3.6-flash-low"]
      prompt_via_flag: "--prompt"

  claude-local:
    type: claude_code
    transport: mcp
    cli:
      command: claude
      dispatch_modes:
        review:
          args: ["--print", "--allowedTools", "Read,Grep,Glob"]
      model_flag: "--model"
      model: null
      model_fallbacks: ["claude-sonnet-4-6"]
      prompt_via_stdin: true

  grok-local:
    type: grok
    transport: mcp
    cli:
      command: grok
      dispatch_modes:
        review:
          args: ["--prompt-file", "/dev/stdin", "--output-format", "json", "--always-approve", "--json-schema", "@review-findings-schema"]
      model_flag: "-m"
      model: "grok-4.5"
      model_fallbacks: []
      prompt_via_stdin: true
