    locks:
      files:
        - "agent-coordinator/database/migrations/030_incremental_code_search_indexes.sql"
        - "agent-coordinator/tests/test_incremental_code_search_registry.py"
        - "packages/code-search/src/code_search_pkg/registry.py"
        - "packages/code-search/src/code_search_pkg/registry_models.py"
        - "packages/code-search/tests/test_incremental_registry.py"
      keys:
        - "db:schema:code_search_indexes"
        - "db:schema:code_search_index_files"
        - "feature:complete-incremental-semantic-indexing:registry"
      ttl_minutes: 120
      reason: "Extend exact-index persistence for safe incremental reuse"
