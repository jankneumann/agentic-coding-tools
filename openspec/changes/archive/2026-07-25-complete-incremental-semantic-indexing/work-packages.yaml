        - "packages/code-search/src/code_search_pkg/registry_models.py"
        - "packages/code-search/tests/test_incremental_registry.py"
      read_allow:
        - "agent-coordinator/**"
        - "packages/code-search/**"
        - "openspec/changes/add-revision-aware-semantic-index-registry/**"
        - "openspec/changes/complete-incremental-semantic-indexing/**"
    worktree:
      name: incremental-index-registry
      mode: isolated
    timeout_minutes: 120
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Incremental registry suites pass"
          kind: command
          command: "uv run --project packages/code-search pytest packages/code-search/tests/test_incremental_registry.py -q && uv run --project agent-coordinator pytest agent-coordinator/tests/test_incremental_code_search_registry.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "registry_manifest_tests_pass"
    metadata:
      loc_estimate: 500
      complexity: medium
      package_kind: data_model
    inputs:
      contract_revision: 1
      contract_package: wp-contract-spike
    outputs:
      result_keys:
        - "registry_manifest_tests_pass"
      artifacts:
        - "agent-coordinator/database/migrations/030_incremental_code_search_indexes.sql"
        - "packages/code-search/src/code_search_pkg/registry.py"

