schema_version: 1

feature:
  id: complete-incremental-semantic-indexing
  title: "Complete incremental semantic indexing"
  plan_revision: 1
  created_by: codex-autopilot-roadmap
  created_at: "2026-07-23T00:00:00Z"

contracts:
  revision: 1
  openapi:
    # No network API; README is the repository-standard contract entrypoint.
    primary: "openspec/changes/complete-incremental-semantic-indexing/contracts/README.md"
    files:
      - "openspec/changes/complete-incremental-semantic-indexing/contracts/README.md"
      - "openspec/changes/complete-incremental-semantic-indexing/contracts/index-request.schema.json"
      - "openspec/changes/complete-incremental-semantic-indexing/contracts/index-execution-result.schema.json"
      - "openspec/changes/complete-incremental-semantic-indexing/contracts/index-record-v2.schema.json"
      - "openspec/changes/complete-incremental-semantic-indexing/contracts/target-strategy.md"
      - "openspec/changes/complete-incremental-semantic-indexing/contracts/db/schema.sql"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 120
  retry_budget: 2
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-contract-spike
    title: "Freeze indexing contracts and prove copy-forward compatibility"
    task_type: contracts
    description: |
      Tasks 0.1-0.2. Validate the request/result/database contracts and run the
      two-revision CocoIndex compatibility test. Freeze either the built-in
      user-managed Postgres target behavior or the thin target-adapter boundary;
      do not select a full-rebuild fallback.
    role: contracts-author
    archetype: implementer
    priority: 1
    depends_on: []
    locks:
      files:
        - "openspec/changes/complete-incremental-semantic-indexing/contracts"
        - "packages/code-search/pyproject.toml"
        - "packages/code-search/tests/test_storage_contract.py"
        - "packages/code-search/tests/test_cocoindex_revision_compat.py"
      keys:
        - "contract:incremental-code-search"
        - "feature:complete-incremental-semantic-indexing:contracts"
      ttl_minutes: 120
      reason: "Freeze revision indexing boundary and upstream target behavior"
    scope:
      write_allow:
        - "openspec/changes/complete-incremental-semantic-indexing/contracts/**"
        - "packages/code-search/pyproject.toml"
        - "packages/code-search/tests/test_storage_contract.py"
        - "packages/code-search/tests/test_cocoindex_revision_compat.py"
      read_allow:
        - "**"
    worktree:
      name: incremental-index-contract-spike
      mode: isolated
    timeout_minutes: 120
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Indexing JSON contracts parse"
          kind: command
          command: "uv run --project skills python -m json.tool openspec/changes/complete-incremental-semantic-indexing/contracts/index-request.schema.json && uv run --project skills python -m json.tool openspec/changes/complete-incremental-semantic-indexing/contracts/index-record-v2.schema.json && uv run --project skills python -m json.tool openspec/changes/complete-incremental-semantic-indexing/contracts/index-execution-result.schema.json"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "contracts_valid"
        - name: "Fenced target contract passes without optional resources"
          kind: command
          command: "uv run --project packages/code-search pytest packages/code-search/tests/test_storage_contract.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "copy_forward_strategy_frozen"
    metadata:
      loc_estimate: 180
      complexity: medium
      package_kind: integration
    inputs:
      contract_revision: 1
      dependency_change: add-revision-aware-semantic-index-registry
    outputs:
      result_keys:
        - "contracts_valid"
        - "copy_forward_strategy_frozen"
      artifacts:
        - "openspec/changes/complete-incremental-semantic-indexing/contracts/README.md"
        - "openspec/changes/complete-incremental-semantic-indexing/contracts/target-strategy.md"
        - "packages/code-search/tests/test_storage_contract.py"
        - "packages/code-search/tests/test_cocoindex_revision_compat.py"

  - package_id: wp-registry-manifest
