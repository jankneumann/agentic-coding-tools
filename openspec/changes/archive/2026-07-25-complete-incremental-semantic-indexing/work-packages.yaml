    task_type: migration
    description: |
      Tasks 1.1-1.2. Add migration 030 plus structural/live tests, then extend
      registry models and operations with computation fingerprints, compatible
      parent lookup, per-revision file manifests, and current-token lease renewal.
    role: database-engineer
    archetype: implementer
    priority: 2
    depends_on:
