          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/project-context-runtime/test_manifest.py -v"
          evidence:
            artifacts:
              - "skills/tests/project-context-runtime/test_manifest.py"
            result_keys:
              - "manifest_tests_passed"
    metadata:
      loc_estimate: 350
      alternatives_count: 2
      complexity: medium
      package_kind: algorithm
    inputs:
      tasks:
        - "3.1"
        - "3.2"
    outputs:
      result_keys:
        - "manifest_tests_passed"
      artifacts:
        - "skills/project-context-runtime/scripts/manifest.py"
        - "skills/tests/project-context-runtime/test_manifest.py"

  - package_id: wp-integration
    title: "Verify cross-process runtime behavior"
    task_type: implement
    description: "Tasks 4.1-4.4: add cross-process coverage, expose the supported facade, document the consumer contract, and run the complete validation matrix."
    role: integration
    archetype: validator
    priority: 3
    decomposition: branch
    depends_on:
