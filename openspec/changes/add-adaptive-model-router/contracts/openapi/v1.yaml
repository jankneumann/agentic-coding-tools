openapi: 3.1.0
info:
  title: Coordinator Model Routing API
  version: 1.0.0
  description: >
    Adaptive model selection, catalog, decisions, usage, and feedback surface.
    Bearer-authenticated like all coordinator endpoints. MCP tool
    `select_model_for_task` mirrors POST /routing/select_model.
paths:
  /routing/select_model:
    post:
      operationId: selectModelForTask
      summary: Rank feasible candidates and select a model for a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectModelRequest'
      responses:
        '200':
          description: Selection with provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectModelResponse'
        '422':
          $ref: '#/components/responses/Problem'
  /routing/catalog:
    get:
      operationId: listCatalog
      summary: List catalog rows (no external calls on read path)
      parameters:
        - name: endpoint_kind
          in: query
          schema: {$ref: '#/components/schemas/EndpointKind'}
        - name: available_only
          in: query
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Catalog rows
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CatalogRow'}
  /routing/decisions/{decision_id}:
    get:
      operationId: getRoutingDecision
      summary: Fetch a decision provenance record
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Provenance record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoutingDecision'}
        '404':
          $ref: '#/components/responses/Problem'
  /routing/usage:
    get:
      operationId: getRoutingUsage
      summary: Aggregated spend, counterfactual savings, exploration burn-down
      parameters:
        - name: window
          in: query
          schema: {type: string, enum: [day, week, month], default: month}
        - name: include_estimates
          in: query
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Usage aggregates
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageAggregate'}
  /routing/feedback:
    post:
      operationId: postRoutingFeedback
      summary: Best-effort task-outcome feedback (non-blocking for callers)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackEvent'}
      responses:
        '202':
          description: Accepted for aggregation
components:
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
  schemas:
    EndpointKind:
      type: string
      enum: [vendor-cli, vendor-sdk, openrouter, local]
    ObjectiveProfile:
      type: string
      enum: [quality-first, balanced, cost-first, resilience]
    SelectModelRequest:
      type: object
      required: [task_signals]
      properties:
        task_signals:
          type: object
          required: [archetype]
          properties:
            archetype: {type: string, example: implementer}
            phase: {type: string, example: IMPLEMENT}
            task_type: {type: string, example: implementer/high-complexity}
            complexity: {type: string, enum: [low, medium, high]}
            modality: {type: string, enum: [interactive, programmatic], default: programmatic}
          additionalProperties: true
        objective_profile: {$ref: '#/components/schemas/ObjectiveProfile'}
        weight_overrides:
          type: object
          properties:
            w_quality: {type: number}
            w_cost: {type: number}
            w_latency: {type: number}
        allow_exploration: {type: boolean, default: true}
      example:
        task_signals: {archetype: implementer, phase: IMPLEMENT, complexity: low, modality: programmatic}
        objective_profile: cost-first
    Candidate:
      type: object
      required: [vendor, model, endpoint_kind, score]
      properties:
        vendor: {type: string, example: openrouter}
        model: {type: string, example: qwen/qwen3-coder}
        endpoint_kind: {$ref: '#/components/schemas/EndpointKind'}
        score: {type: number, example: 0.71}
        quality: {type: number}
        norm_cost: {type: number}
        norm_latency: {type: number}
        posterior_sample_size: {type: integer}
        stale_catalog: {type: boolean, default: false}
        cost_source:
          type: string
          enum: [posterior, prior]
          nullable: true
          description: >
            Provenance of the cost estimate used in scoring — `posterior` (learned
            per-task cost cleared the sample threshold) or `prior` (catalog per-Mtok
            proxy). Null when no cost was scored. Mirrors the resolver Candidate.
    SelectModelResponse:
      type: object
      required: [decision_id, selected, alternatives, fallback]
      properties:
        decision_id: {type: string, format: uuid}
        selected: {$ref: '#/components/schemas/Candidate'}
        alternatives:
          type: array
          items: {$ref: '#/components/schemas/Candidate'}
        exploration: {type: boolean, default: false}
        fallback:
          type: boolean
          default: false
          description: True when static-tier resolution was returned (flag off / error / timeout)
        excluded:
          type: array
          description: Candidates removed pre-scoring by hard constraints, with reasons
          items:
            type: object
            properties:
              vendor: {type: string}
              model: {type: string}
              reason: {type: string, example: cedar:programmatic-ineligible}
      example:
        decision_id: 3f1b7c1e-9a3d-4f9d-8b1a-2c6e5d4a9b0c
        selected: {vendor: local, model: qwen3-coder-32b, endpoint_kind: local, score: 0.66}
        alternatives: []
        exploration: true
        fallback: false
        excluded: [{vendor: claude, model: fable-5, reason: cedar:programmatic-ineligible}]
    CatalogRow:
      type: object
      required: [vendor, model, endpoint_kind, available]
      properties:
        vendor: {type: string}
        model: {type: string}
        endpoint_kind: {$ref: '#/components/schemas/EndpointKind'}
        base_url: {type: string, nullable: true, example: http://localhost:11434/v1}
        prompt_usd_per_mtok: {type: number, nullable: true}
        completion_usd_per_mtok: {type: number, nullable: true}
        context_window: {type: integer, nullable: true}
        benchmark_priors:
          type: object
          additionalProperties: {type: number}
          example: {artificial_analysis_intelligence: 62.5}
        p50_latency_ms: {type: number, nullable: true}
        available: {type: boolean}
        quota_headroom_pct: {type: number, nullable: true, description: Proactive remaining-window pct (design D13); null when quota probe off/uncovered}
        quota_reset_at: {type: string, format: date-time, nullable: true}
        quota_source: {type: string, nullable: true, example: quota-axi}
        refreshed_at: {type: string, format: date-time}
        stale: {type: boolean}
    RoutingDecision:
      type: object
      required: [decision_id, created_at, request, selected, policy_version]
      properties:
        decision_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        request: {$ref: '#/components/schemas/SelectModelRequest'}
        selected: {$ref: '#/components/schemas/Candidate'}
        alternatives:
          type: array
          items: {$ref: '#/components/schemas/Candidate'}
        exploration: {type: boolean}
        fallback: {type: boolean}
        policy_version: {type: string}
        budget_state:
          type: object
          properties:
            exploration_pct_used: {type: number}
            exploration_usd_used: {type: number}
            metered_usd_used: {type: number}
        outcome_ref:
          type: string
          nullable: true
          description: Link to realised outcome (feedback event id) once known
    UsageAggregate:
      type: object
      properties:
        window: {type: string}
        by_model:
          type: array
          items:
            type: object
            properties:
              vendor: {type: string}
              model: {type: string}
              endpoint_kind: {$ref: '#/components/schemas/EndpointKind'}
              prompt_tokens: {type: integer}
              completion_tokens: {type: integer}
              actual_usd: {type: number}
              counterfactual_usd: {type: number}
              estimated_fraction: {type: number, description: Share of spend from estimated token counts}
        net_savings_usd: {type: number}
        net_savings_usd_excluding_estimates: {type: number}
        exploration_usd_used: {type: number}
        metered_ceiling_usd: {type: number}
        metered_usd_used: {type: number}
    FeedbackEvent:
      type: object
      required: [source, vendor, model, task_type, metrics]
      properties:
        decision_id: {type: string, format: uuid, nullable: true}
        source:
          type: string
          enum: [gen-eval, validation, vendor-switch, procedural-memory, transcript-triage]
        vendor: {type: string}
        model: {type: string}
        task_type: {type: string}
        metrics:
          type: object
          properties:
            success: {type: boolean, nullable: true}
            quality_score: {type: number, nullable: true}
            cost_observed_usd: {type: number, nullable: true}
            latency_observed_seconds: {type: number, nullable: true}
            tokens_estimated: {type: boolean, default: false}
        observed_at: {type: string, format: date-time}
