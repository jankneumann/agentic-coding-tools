schema_version: 1
feature:
  id: add-isolation-posture-detection
  title: "Isolation posture detection"
  plan_revision: 1
  created_by: codex
  deployable: false
contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/add-isolation-posture-detection/contracts/isolation-posture.schema.json"
    files:
      - "openspec/changes/add-isolation-posture-detection/contracts/isolation-posture.schema.json"
defaults:
  priority: 1
  lock_ttl_minutes: 120
  timeout_minutes: 180
  retry_budget: 1
  verification_tier_required: B
  min_trust_level: 2
packages:
  - package_id: wp-isolation-posture
    title: "Posture model, detection, and worktree consumers"
    task_type: integration
    description: "Widen the detector with compatibility and migrate filesystem decision points using TDD."
    role: backend-implementer
    archetype: implementer
    priority: 1
    depends_on: []
    locks:
      files:
        - "skills/shared/environment_profile.py"
        - "skills/worktree/scripts/worktree.py"
        - "skills/worktree/scripts/merge_worktrees.py"
        - "skills/validate-feature/scripts/validation_worktree.py"
        - "skills/worktree/scripts/tests/**"
      keys: ["contract:environment-profile:isolation-posture"]
      ttl_minutes: 180
      reason: "The model, truth table, and consumers form one compatibility boundary"
    scope:
      write_allow:
        - "skills/shared/environment_profile.py"
        - "skills/shared/tests/test_environment_profile.py"
        - "skills/shared/tests/test_checkout_policy.py"
        - "skills/worktree/scripts/worktree.py"
        - "skills/worktree/scripts/merge_worktrees.py"
        - "skills/validate-feature/scripts/validation_worktree.py"
        - "skills/worktree/scripts/tests/**"
        - "skills/tests/worktree/**"
        - "skills/tests/validate-feature/test_validation_worktree.py"
        - "skills/tests/cleanup-feature/test_submodule_teardown.py"
        - "skills/tests/project-context-refresh/test_checkpoint_cli.py"
        - "skills/tests/project-context-refresh/test_cli_refresh.py"
        - "docs/cloud-vs-local-execution.md"
        - "docs/guides/worktree-management.md"
        - "docs/mental-models.md"
        - "skills/context-engineering/SKILL.md"
        - "openspec/changes/add-isolation-posture-detection/**"
      read_allow: ["**"]
    context_impact: {surfaces: [apis, capabilities, documentation, semantic_code]}
    worktree: {name: add-isolation-posture-detection, mode: isolated}
    timeout_minutes: 180
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "Focused isolation and worktree tests"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/shared/tests/test_environment_profile.py skills/shared/tests/test_checkout_policy.py skills/worktree/scripts/tests skills/tests/worktree skills/tests/validate-feature/test_validation_worktree.py skills/tests/cleanup-feature/test_submodule_teardown.py skills/tests/project-context-refresh/test_checkpoint_cli.py skills/tests/project-context-refresh/test_cli_refresh.py -q"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [focused_tests]}
        - name: "Strict OpenSpec validation"
          kind: command
          command: "openspec validate add-isolation-posture-detection --strict"
          cwd: "."
          expect_exit_code: 0
          evidence: {artifacts: [], result_keys: [openspec_validation]}
    outputs: {result_keys: [focused_tests, openspec_validation]}
