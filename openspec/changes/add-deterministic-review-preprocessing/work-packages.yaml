    context_impact:
      surfaces:
        - "capabilities"
        - "apis"
    worktree:
      name: wp-ocr-vendor
      mode: isolated
    verification:
      tier_required: B
      steps:
        - name: "Adapter, coercion, and discovery tests"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/parallel-infrastructure/scripts/tests/test_ocr_adapter.py skills/tests/parallel-infrastructure/test_finding_coercion.py skills/parallel-infrastructure/scripts/tests/test_review_dispatcher_ocr.py -q"
          evidence:
            artifacts: []
            result_keys: ["ocr_tests"]
        - name: "agents.yaml still loads"
          kind: command
          command: "skills/.venv/bin/python -c 'import yaml; yaml.safe_load(open(\"agent-coordinator/agents.yaml\"))'"
          evidence:
            artifacts: []
            result_keys: ["agents_yaml_loads"]
    outputs:
      result_keys: ["ocr_tests", "agents_yaml_loads"]
    metadata:
      loc_estimate: 260
      package_kind: integration

