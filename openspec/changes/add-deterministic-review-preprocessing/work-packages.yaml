schema_version: 1

feature:
  id: add-deterministic-review-preprocessing
  title: "Deterministic review pre-processing, snippet anchoring, fact-check, and OCR vendor"
  plan_revision: 1
  created_by: claude_code
  created_at: "2026-09-14T00:00:00Z"
  deployable: false

contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/add-deterministic-review-preprocessing/contracts/README.md"
    files:
      - "openspec/changes/add-deterministic-review-preprocessing/contracts/README.md"
      - "openspec/changes/add-deterministic-review-preprocessing/contracts/review-packet.schema.json"
      - "openspec/changes/add-deterministic-review-preprocessing/contracts/review-rules.schema.json"
      - "openspec/changes/add-deterministic-review-preprocessing/contracts/vendor-coverage.schema.json"
      - "openspec/changes/add-deterministic-review-preprocessing/contracts/fact-check-decisions.schema.json"
      - "openspec/changes/add-deterministic-review-preprocessing/contracts/ocr-adapter.md"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 60
  retry_budget: 1
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-contracts
    title: "Pre-processing contracts"
    task_type: contracts
    description: "Validate the five contracts and repoint the packet metadata contract test to v2."
    role: contracts
    priority: 1
    depends_on: []
    timeout_minutes: 30
    retry_budget: 1
    min_trust_level: 1
    locks:
      files:
        - "openspec/changes/add-deterministic-review-preprocessing/contracts/review-packet.schema.json"
      keys:
        - "contract:openspec/changes/add-deterministic-review-preprocessing/contracts/review-packet.schema.json"
      ttl_minutes: 60
      reason: "Freeze packet v2, rules, coverage, and fact-check formats"
    scope:
      write_allow:
        - "openspec/changes/add-deterministic-review-preprocessing/contracts/**"
        - "skills/tests/parallel-infrastructure/test_review_preprocessing_contracts.py"
        - "skills/tests/parallel-infrastructure/test_review_packet_schema.py"
      read_allow:
        - "openspec/changes/add-deterministic-review-preprocessing/**"
        - "skills/tests/**"
      deny: []
    context_impact:
      surfaces:
        - "apis"
        - "documentation"
    worktree:
      name: wp-contracts
      mode: isolated
    verification:
      tier_required: C
      steps:
        - name: "Contract tests"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/tests/parallel-infrastructure/test_review_preprocessing_contracts.py skills/tests/parallel-infrastructure/test_review_packet_schema.py -q"
          evidence:
            artifacts: []
            result_keys: ["contract_tests"]
    outputs:
      result_keys: ["contract_tests"]
    metadata:
      loc_estimate: 120
      package_kind: data_model

  - package_id: wp-fact-check
    title: "Diff-grounded fact-check pass"
    task_type: implement
    description: "fact_check.py with ported prompt, economy-tier call, protected-subject veto, decision file; wired into converge() after checkpoint and before synthesis; manifest fields."
    role: implementer
    priority: 2
    depends_on: ["wp-contracts"]
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    locks:
      files:
        - "skills/parallel-infrastructure/scripts/fact_check.py"
        - "skills/autopilot/scripts/convergence_loop.py"
        - "skills/parallel-infrastructure/scripts/checkpoint_findings.py"
      keys:
        - "feature:add-deterministic-review-preprocessing:factcheck"
      ttl_minutes: 120
      reason: "Fact-check pass and convergence wiring"
    scope:
      write_allow:
        - "skills/parallel-infrastructure/scripts/fact_check.py"
        - "skills/parallel-infrastructure/scripts/prompts/fact_check_system.md"
        - "skills/parallel-infrastructure/scripts/prompts/fact_check_user.md"
        - "skills/parallel-infrastructure/scripts/tests/test_fact_check.py"
        - "skills/autopilot/scripts/convergence_loop.py"
        - "skills/tests/autopilot/test_convergence_fact_check.py"
        - "skills/parallel-infrastructure/scripts/checkpoint_findings.py"
      read_allow:
        - "skills/**"
        - "agent-coordinator/archetypes.yaml"
        - "openspec/changes/add-deterministic-review-preprocessing/**"
      deny: []
    context_impact:
      surfaces:
        - "capabilities"
        - "semantic_code"
    worktree:
      name: wp-fact-check
      mode: isolated
    verification:
      tier_required: B
      steps:
        - name: "Fact-check unit and convergence tests"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/parallel-infrastructure/scripts/tests/test_fact_check.py skills/tests/autopilot/test_convergence_fact_check.py -q"
          evidence:
            artifacts: []
            result_keys: ["fact_check_tests"]
    outputs:
      result_keys: ["fact_check_tests"]
    metadata:
      loc_estimate: 420
      package_kind: integration

  - package_id: wp-ocr-vendor
