      Tasks 1.1-1.3. New pure module verdict_binding.py: bind, verdict_currency,
      stale_reason, independence_violation, derive_author, family_of,
      patch_id_from_diff, patch_id, validate_binding, POLICY_WAIVABLE_REASONS
      (D1-D3, D5). Tested against real throwaway git repos.
    priority: 1
    depends_on: []
    timeout_minutes: 60
    retry_budget: 1
    min_trust_level: 2
    locks:
      files:
        - "skills/merge-pull-requests/scripts/verdict_binding.py"
      keys:
        - "feature:bind-merge-verdicts-to-head-sha-and-patch-id:binding"
      ttl_minutes: 120
      reason: "Owns the verdict-binding and currency rule"
    scope:
      write_allow:
        - "skills/merge-pull-requests/scripts/verdict_binding.py"
        - "skills/merge-pull-requests/scripts/tests/test_verdict_binding.py"
      read_allow:
        - "openspec/changes/bind-merge-verdicts-to-head-sha-and-patch-id/**"
        - "skills/merge-pull-requests/**"
        - "skills/tests/merge-pull-requests/**"
      deny: []
    context_impact:
      surfaces:
        - "semantic_code"
    worktree:
      name: wp-binding
      mode: isolated
    verification:
      tier_required: B
      steps:
        - name: "Verdict-binding tests"
          kind: command
          command: "cd skills && .venv/bin/python -m pytest merge-pull-requests/scripts/tests/test_verdict_binding.py -q"
          evidence:
            artifacts: []
            result_keys: ["binding_tests"]
    outputs:
      result_keys: ["binding_tests"]
    metadata:
      loc_estimate: 320
      package_kind: algorithm

