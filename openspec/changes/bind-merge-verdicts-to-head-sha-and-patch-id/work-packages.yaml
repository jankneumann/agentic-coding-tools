      event (D6). Callers that pass neither are unchanged.
    priority: 1
    depends_on: []
    timeout_minutes: 60
    retry_budget: 1
    min_trust_level: 2
    locks:
      files:
        - "skills/merge-pull-requests/scripts/merge_pr.py"
