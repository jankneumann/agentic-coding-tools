schema_version: 1

feature:
  id: wire-the-live-typesafe-client-thresholds-and-telemetry
  title: "system-one-decisions — live TypeSafe client, thresholds, telemetry"
  plan_revision: 1
  created_by: claude-code

contracts:
  revision: 1
  openapi:
    # No OpenAPI surface — pure Python library extension. README is the
    # contracts entrypoint per repo convention (same as ri-01).
    primary: "openspec/changes/wire-the-live-typesafe-client-thresholds-and-telemetry/contracts/README.md"
    files:
      - "openspec/changes/wire-the-live-typesafe-client-thresholds-and-telemetry/contracts/README.md"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 60
  retry_budget: 2
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-main
    title: "system-one-decisions — live client, thresholds, telemetry, full scope"
    task_type: implementation
    description: |
      Give decide() a real body (live TypeSafe client behind a "live" extra,
      four ordered unavailability branches, all returning None/never raising),
      add an optional event_sink to decide() mirroring decide_intent()'s
      existing one, and move _route()/decide_intent()'s act_floor/approve_floor
      defaults out of literals into a package-owned thresholds.json + loader.
      decide_intent()'s acquisition step is unchanged (still always fallback).
      Single-package scope, no internal parallelism to decompose.
    role: implementer
    archetype: implementer
    priority: 1
    depends_on: []
    locks:
      files:
        - "packages/system-one-decisions/pyproject.toml"
        - "packages/system-one-decisions/src/system_one_decisions/_core.py"
      keys:
        - "feature:wire-the-live-typesafe-client-thresholds-and-telemetry:main"
      ttl_minutes: 120
      reason: "Full-scope implementation of the live client, thresholds and telemetry wiring"
    scope:
      write_allow:
        - "packages/system-one-decisions/**"
        # Corrected during implementation, same class of correction as
        # ri-01's: adding the `dev`/`live` extras to system-one-decisions'
        # own pyproject.toml changes its package metadata, which staled the
        # *consumers'* own lockfiles (they embed the path-dependency's
        # metadata). agent-scenarios' lock needed no change this time (it
        # only depends on gen-eval, not system-one-decisions directly), but
        # gen-eval's and the coordinator's both did. Lockfiles are
        # regenerated by `uv lock`, never hand-edited.
        - "packages/gen-eval/uv.lock"
        - "agent-coordinator/uv.lock"
      read_allow:
        - "**"
      deny: []
    worktree:
      name: system-one-decisions-live-wp-main
      mode: isolated
    timeout_minutes: 60
    retry_budget: 2
    min_trust_level: 2
    verification:
      tier_required: B
      steps:
        - name: "system-one-decisions test suite is green"
          kind: command
          command: "python3 -m pytest packages/system-one-decisions/tests -q"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "system_one_decisions_live_tests_green"
        - name: "Package imports with zero optional extras"
          kind: command
          command: "bash -c 'cd /tmp && python3 -m venv .s1d-live-smoke && .s1d-live-smoke/bin/pip install -q /home/user/agentic-coding-tools/.git-worktrees/wire-the-live-typesafe-client-thresholds-and-telemetry/packages/system-one-decisions && .s1d-live-smoke/bin/python -c \"import system_one_decisions\"'"
          cwd: "."
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys:
              - "system_one_decisions_import_clean_no_live_extra"
    outputs:
      result_keys:
        - "system_one_decisions_live_tests_green"
        - "system_one_decisions_import_clean_no_live_extra"
