openapi: 3.1.0
info:
  title: Work Queue Projection Contract
  version: 1.0.0
paths:
  /work/submit:
    post:
      operationId: submitWork
      summary: Submit work, atomically deduplicating complete loop-state projection keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkSubmitRequest'
            example:
              task_type: autopilot_phase
              task_description: Execute IMPLEMENT for demo-change
              input_data:
                change_id: demo-change
                phase: IMPLEMENT
                iteration: 2
              priority: 5
      responses:
        '200':
          description: Canonical queue task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionMutationResponse'
              example:
                success: true
                task_id: 11111111-1111-4111-8111-111111111111
                created: false
                deduplicated: true
                cancelled_task_ids: []
        '401':
          $ref: '#/components/responses/Problem'
  /work/reconcile:
    post:
      operationId: reconcileWorkProjection
      summary: Reconcile active work rows from authoritative loop-state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkReconcileRequest'
            example:
              change_id: demo-change
              phase: IMPLEMENT
              iteration: 2
              task_type: autopilot_phase
              task_description: Execute IMPLEMENT for demo-change
              input_data:
                package_ids: [wp-backend]
              priority: 5
      responses:
        '200':
          description: Queue converged to the supplied loop-state key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionMutationResponse'
              example:
                success: true
                task_id: 11111111-1111-4111-8111-111111111111
                created: true
                deduplicated: false
                cancelled_task_ids:
                  - 22222222-2222-4222-8222-222222222222
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  schemas:
    ProjectionKey:
      type: object
      required: [change_id, phase, iteration]
      properties:
        change_id:
          type: string
          minLength: 1
        phase:
          type: string
          minLength: 1
        iteration:
          type: integer
          minimum: 0
    WorkSubmitRequest:
      type: object
      required: [task_type, task_description]
      properties:
        task_type:
          type: string
          minLength: 1
        task_description:
          type: string
          minLength: 1
        input_data:
          type: object
          additionalProperties: true
        priority:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        depends_on:
          type: array
          items:
            type: string
            format: uuid
        agent_requirements:
          type: object
          additionalProperties: true
    WorkReconcileRequest:
      allOf:
        - $ref: '#/components/schemas/ProjectionKey'
        - type: object
          required: [task_type, task_description]
          properties:
            task_type:
              type: string
              minLength: 1
            task_description:
              type: string
              minLength: 1
            input_data:
              type: object
              additionalProperties: true
            priority:
              type: integer
              minimum: 1
              maximum: 10
              default: 5
            agent_requirements:
              type: object
              additionalProperties: true
    ProjectionMutationResponse:
      type: object
      required: [success, task_id, created, deduplicated]
      properties:
        success:
          type: boolean
        task_id:
          type: string
          format: uuid
        created:
          type: boolean
        deduplicated:
          type: boolean
        cancelled_task_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  responses:
    Problem:
      description: RFC 7807 problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
