packages:
  - id: wp-main
    name: "Merge plan orchestration — Phase 1 (file tier + --execute)"
    description: >
      Durable merge-plan artifact emitted by the analysis round, a faithful
      merge-plan.md projection, file-tier storage selection, plan-driven
      single-PR execution with downstream re-validation, living-plan
      amendment, and the comment-addressing delegation seam. Phase 2
      (coordinator system-of-record, events, cross-host dispatch, auth)
      is specified in design.md and deferred to a follow-on change.
    tasks:
      - "1.1"
      - "1.2"
      - "1.3"
      - "2.1"
      - "2.2"
      - "3.1"
      - "3.2"
      - "4.1"
      - "4.2"
      - "4.3"
      - "4.4"
      - "5.1"
      - "5.2"
      - "5.3"
      - "6.1"
      - "6.2"
    priority: 1
    dependencies: []
    scope:
      write_allow:
        - "skills/merge-pull-requests/**"
        - "skills/tests/merge-pull-requests/**"
      read_allow:
        - "skills/**"
        - "openspec/changes/add-merge-plan-orchestration/**"
      deny:
        - "agent-coordinator/**"
    verification: tier_b
