schema_version: 1

feature:
  id: make-expedite-fail-closed-on-missing-validation
  title: "Make expedite fail closed on missing validation"
  plan_revision: 1
  created_by: claude_code
  created_at: "2026-10-15T00:00:00Z"
  deployable: false

contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/make-expedite-fail-closed-on-missing-validation/contracts/README.md"
    files:
      - "openspec/changes/make-expedite-fail-closed-on-missing-validation/contracts/README.md"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 60
  retry_budget: 1
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-expedite
    title: "Fail closed on a missing validation report, with a recorded override"
    task_type: implement
    role: implementer
    description: >-
      Tasks 1.x-4.x. check_validation_report returns fail when no report exists
      (D1); --accept-missing-validation "<reason>" passes visibly and records
      the reason under overrides (D2); change_dir is derived from the change id
      (D3); a drift test pins the SKILL.md table to the code (D4). The rework
      report's skip and the ready roll-up are unchanged.
    priority: 1
    depends_on: []
    timeout_minutes: 60
    retry_budget: 1
    min_trust_level: 2
    locks:
      files:
        - "skills/expedite/scripts/expedite.py"
        - "skills/expedite/SKILL.md"
      keys:
        - "feature:make-expedite-fail-closed-on-missing-validation:verdict"
      ttl_minutes: 120
      reason: "Owns the expedite readiness verdict and its documented status table"
    scope:
      write_allow:
        - "skills/expedite/**"
        - ".claude/skills/expedite/**"
        - ".agents/skills/expedite/**"
        - "docs/mental-models.md"
      read_allow:
        - "openspec/changes/make-expedite-fail-closed-on-missing-validation/**"
        - "skills/validate-feature/scripts/gate_logic.py"
        - "skills/validate-feature/scripts/rework_report.py"
        - "skills/shared/**"
        - "skills/install.sh"
      deny:
        - "skills/validate-feature/**"
    context_impact:
      surfaces:
        - "semantic_code"
    worktree:
      name: wp-expedite
      mode: isolated
    verification:
      tier_required: B
      steps:
        - name: "Expedite suite including drift test"
          kind: command
          command: "skills/.venv/bin/python -m pytest skills/expedite/scripts/tests -q"
          evidence:
            artifacts: []
            result_keys: ["expedite_tests"]
        - name: "Strict OpenSpec validation"
          kind: command
          command: "openspec validate make-expedite-fail-closed-on-missing-validation --strict"
          evidence:
            artifacts: []
            result_keys: ["openspec_strict"]
    outputs:
      result_keys: ["expedite_tests", "openspec_strict"]
    metadata:
      loc_estimate: 160
      package_kind: algorithm
