schema_version: 1

feature:
  id: harden-review-consensus-and-recovery
  title: "Fail-closed review consensus, bounded vendor recovery, reviewer-tier routing"
  plan_revision: 1
  created_by: codex-autopilot
  created_at: "2026-08-01T00:00:00Z"

# This change has no HTTP surface. The schema-contract slot carries the two
# internal JSON contracts that freeze the package boundaries.
contracts:
  revision: 1
  openapi:
    primary: "openspec/changes/harden-review-consensus-and-recovery/contracts/consensus-policy.schema.json"
    files:
      - "openspec/changes/harden-review-consensus-and-recovery/contracts/consensus-policy.schema.json"
      - "openspec/changes/harden-review-consensus-and-recovery/contracts/review-attempt.schema.json"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 120
  retry_budget: 2
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-consensus-policy
    title: "Consensus policy, schema, deterministic grouping"
    task_type: implementation
    description: |
      Tasks 1.1-1.5 plus Checkpoint 1. Characterize the false-zero behavior,
      extend both consensus-report schema copies, preserve reviewer dispositions,
      implement evidence-backed adjudication, derive explicit policy counts, and
      replace primary-order greedy matching with deterministic structured groups.
    role: trust-layer-engineer
    archetype: implementer
    priority: 1
    depends_on: []
    locks:
      files:
        - "skills/parallel-infrastructure/scripts/consensus_synthesizer.py"
        - "openspec/schemas/consensus-report.schema.json"
      keys:
        - "contract:review-consensus-policy"
      ttl_minutes: 120
      reason: "Consensus schema plus blocker policy are one atomic trust boundary"
    scope:
      write_allow:
        - "skills/parallel-infrastructure/scripts/consensus_synthesizer.py"
        - "skills/parallel-infrastructure/scripts/tests/test_consensus_synthesizer.py"
        - "skills/parallel-infrastructure/scripts/tests/fixtures/review-hardening/**"
        - "skills/parallel-infrastructure/install_assets/openspec/schemas/consensus-report.schema.json"
        - "openspec/schemas/consensus-report.schema.json"
      read_allow:
        - "**"
      deny:
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
        - "skills/autopilot/**"
    context_impact:
      surfaces:
        - "apis"
        - "semantic_code"
    worktree:
      name: review-hardening-consensus
      mode: isolated
    timeout_minutes: 120
    retry_budget: 2
    min_trust_level: 3
    verification:
      tier_required: B
      steps:
        - name: "Consensus synthesizer tests pass"
          kind: command
          command: "uv run --project skills pytest skills/parallel-infrastructure/scripts/tests/test_consensus_synthesizer.py -q"
          evidence:
            artifacts: []
            result_keys: ["consensus_tests_passed"]
        - name: "Consensus schema assets are byte-identical"
          kind: command
          command: "cmp openspec/schemas/consensus-report.schema.json skills/parallel-infrastructure/install_assets/openspec/schemas/consensus-report.schema.json"
          evidence:
            artifacts: []
            result_keys: ["consensus_schemas_synced"]
    metadata:
      loc_estimate: 520
      complexity: high
      package_kind: algorithm
    inputs:
      task_ids: ["1.1", "1.2", "1.3", "1.4", "1.5"]
      contracts:
        - "openspec/changes/harden-review-consensus-and-recovery/contracts/consensus-policy.schema.json"
    outputs:
      result_keys: ["consensus_tests_passed", "consensus_schemas_synced"]
      artifacts:
        - "openspec/schemas/consensus-report.schema.json"

  - package_id: wp-vendor-recovery-routing
    title: "Vendor recovery, diagnostics, reviewer routing"
    task_type: implementation
    description: |
      Tasks 2.1-2.6 plus Checkpoint 2. Normalize attempt records across CLI,
      SDK, and async completions; add invalid-output classification, bounded
      corrective redispatch, redacted diagnostics, shared quorum eligibility,
      config-driven thinking flags, and reviewer archetype routing provenance.
    role: coordination-engineer
    archetype: implementer
    priority: 1
    depends_on: []
    locks:
      files:
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
        - "agent-coordinator/src/agents_config.py"
        - "agent-coordinator/agents.yaml"
      keys:
        - "contract:review-attempt-provenance"
        - "feature:harden-review-consensus-and-recovery:routing"
      ttl_minutes: 180
      reason: "Dispatcher recovery and config translation share one attempt contract"
    scope:
      write_allow:
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
        - "skills/parallel-infrastructure/scripts/tests/test_review_dispatcher.py"
        - "agent-coordinator/agents.yaml"
        - "agent-coordinator/src/agents_config.py"
        - "agent-coordinator/tests/test_archetype_routing.py"
        - "agent-coordinator/tests/test_agents_config.py"
      read_allow:
        - "**"
      deny:
        - "skills/parallel-infrastructure/scripts/consensus_synthesizer.py"
        - "skills/autopilot/**"
    context_impact:
      surfaces:
        - "apis"
        - "semantic_code"
    worktree:
      name: review-hardening-dispatcher
      mode: isolated
    timeout_minutes: 180
    retry_budget: 2
    min_trust_level: 3
    verification:
      tier_required: B
      steps:
        - name: "Review dispatcher tests pass"
          kind: command
          command: "uv run --project skills pytest skills/parallel-infrastructure/scripts/tests/test_review_dispatcher.py -q"
          evidence:
            artifacts: []
            result_keys: ["dispatcher_tests_passed"]
        - name: "Coordinator routing tests pass"
          kind: command
          command: "uv run --project agent-coordinator pytest agent-coordinator/tests/test_archetype_routing.py agent-coordinator/tests/test_agents_config.py -q"
          evidence:
            artifacts: []
            result_keys: ["routing_tests_passed"]
    metadata:
      loc_estimate: 720
      complexity: high
      package_kind: integration
    inputs:
      task_ids: ["2.1", "2.2", "2.3", "2.4", "2.5", "2.6"]
      contracts:
        - "openspec/changes/harden-review-consensus-and-recovery/contracts/review-attempt.schema.json"
    outputs:
      result_keys: ["dispatcher_tests_passed", "routing_tests_passed"]
      artifacts:
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"

  - package_id: wp-fail-closed-convergence
    title: "Fail-closed convergence consumer"
    task_type: implementation
    description: |
      Tasks 3.1-3.3 plus Checkpoint 3. Consume explicit convergence-blocking
      and quorum policy, remove the final-round relaxation, preserve disagreement
      escalation, return inconclusive outcomes at exhaustion, and update recovery
      guidance for attempt artifacts plus evidence-backed adjudication.
    role: workflow-engineer
    archetype: implementer
    priority: 2
    depends_on: [wp-consensus-policy, wp-vendor-recovery-routing]
    locks:
      files:
        - "skills/autopilot/scripts/convergence_loop.py"
      keys:
        - "feature:harden-review-consensus-and-recovery:convergence"
      ttl_minutes: 120
      reason: "Convergence adopts the frozen consensus and attempt contracts"
    scope:
      write_allow:
        - "skills/autopilot/scripts/convergence_loop.py"
        - "skills/autopilot/scripts/tests/test_convergence_loop.py"
        - "skills/autopilot/references/convergence-recovery.md"
        - "docs/parallel-agentic-development.md"
      read_allow:
        - "**"
      deny:
        - "skills/parallel-infrastructure/scripts/consensus_synthesizer.py"
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
        - "agent-coordinator/**"
    context_impact:
      surfaces:
        - "documentation"
        - "semantic_code"
    worktree:
      name: review-hardening-convergence
      mode: isolated
    timeout_minutes: 120
    retry_budget: 2
    min_trust_level: 3
    verification:
      tier_required: B
      steps:
        - name: "Convergence loop tests pass"
          kind: command
          command: "uv run --project skills pytest skills/autopilot/scripts/tests/test_convergence_loop.py -q"
          evidence:
            artifacts: []
            result_keys: ["convergence_tests_passed"]
    metadata:
      loc_estimate: 340
      complexity: medium
      package_kind: integration
    inputs:
      task_ids: ["3.1", "3.2", "3.3"]
      contracts:
        - "openspec/changes/harden-review-consensus-and-recovery/contracts/consensus-policy.schema.json"
        - "openspec/changes/harden-review-consensus-and-recovery/contracts/review-attempt.schema.json"
    outputs:
      result_keys: ["convergence_tests_passed"]
      artifacts:
        - "skills/autopilot/scripts/convergence_loop.py"

  - package_id: wp-integration
    title: "Review-hardening integration evidence"
    task_type: validation
    description: |
      Tasks 4.1-4.3. Add the archived false-zero golden regression, prove the
      write_allow refutation is represented as a false-positive adjudication,
      verify invalid Pi output cannot silently reduce quorum, confirm reviewer
      model provenance, document typed-result compatibility, and run final gates.
    role: integration-engineer
    archetype: analyst
    priority: 3
    depends_on:
      - wp-consensus-policy
      - wp-vendor-recovery-routing
      - wp-fail-closed-convergence
    locks:
      files:
        - "skills/tests/autopilot/test_review_hardening_integration.py"
      keys:
        - "feature:harden-review-consensus-and-recovery:integration"
      ttl_minutes: 120
      reason: "Cross-package evidence after all implementation packages merge"
    scope:
      write_allow:
        - "skills/tests/autopilot/test_review_hardening_integration.py"
        - "skills/tests/autopilot/fixtures/review-hardening/**"
        - "docs/script-skill-dependencies.md"
        - "docs/skills-workflow.md"
        - "skills/parallel-infrastructure/SKILL.md"
        - "openspec/changes/harden-review-consensus-and-recovery/**"
      read_allow:
        - "**"
      deny:
        - "skills/parallel-infrastructure/scripts/consensus_synthesizer.py"
        - "skills/parallel-infrastructure/scripts/review_dispatcher.py"
        - "skills/autopilot/scripts/convergence_loop.py"
        - "agent-coordinator/src/**"
    context_impact:
      surfaces:
        - "capabilities"
        - "documentation"
        - "semantic_code"
    worktree:
      name: review-hardening-integration
      mode: isolated
    timeout_minutes: 120
    retry_budget: 2
    min_trust_level: 3
    verification:
      tier_required: B
      steps:
        - name: "Review hardening integration test passes"
          kind: command
          command: "uv run --project skills pytest skills/tests/autopilot/test_review_hardening_integration.py -q"
          evidence:
            artifacts: []
            result_keys: ["integration_test_passed"]
        - name: "OpenSpec change validates strictly"
          kind: command
          command: "openspec validate harden-review-consensus-and-recovery --strict"
          evidence:
            artifacts: []
            result_keys: ["openspec_valid"]
    metadata:
      loc_estimate: 260
      complexity: medium
      package_kind: integration
    inputs:
      task_ids: ["4.1", "4.2", "4.3"]
      contracts:
        - "openspec/changes/harden-review-consensus-and-recovery/contracts/consensus-policy.schema.json"
        - "openspec/changes/harden-review-consensus-and-recovery/contracts/review-attempt.schema.json"
    outputs:
      result_keys: ["integration_test_passed", "openspec_valid"]
      artifacts:
        - "skills/tests/autopilot/test_review_hardening_integration.py"
        - "openspec/changes/harden-review-consensus-and-recovery/validation-report.md"
