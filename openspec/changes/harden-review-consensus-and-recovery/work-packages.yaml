  - package_id: wp-integration
    title: "Review-hardening integration evidence"
    task_type: validation
    description: |
      Tasks 4.1-4.3. Add the archived false-zero golden regression, prove the
      write_allow refutation is represented as a false-positive adjudication,
      verify invalid Pi output cannot silently reduce quorum, confirm reviewer
