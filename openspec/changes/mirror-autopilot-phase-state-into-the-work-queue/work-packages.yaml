  - package_id: wp-live-integration
    title: Coordinator, crash recovery, and kanban proof
    task_type: integration
    description: Implement tasks 3.1 through 4.3 against live PostgreSQL and the read-only kanban data path, including concurrent-generation serialization, crash recovery, row-limit proof, connected SSE refresh, and label-only polling without frontend behavior changes.
    role: integrator
    priority: 2
    depends_on: [wp-projection-adapter]
    locks:
      files:
        - docs/guides/work-queue-truth-projection.md
        - docs/architecture-analysis
      keys:
        - feature:autopilot-live-queue-projection:verify
      ttl_minutes: 90
      reason: Cross-boundary behavioral verification and durable documentation
    scope:
      write_allow:
        - skills/tests/autopilot/**
        - skills/tests/coordination-bridge/**
        - agent-coordinator/tests/**
        - docs/guides/work-queue-truth-projection.md
        - docs/architecture-analysis/**
        - openspec/changes/mirror-autopilot-phase-state-into-the-work-queue/**
      read_allow:
        - '**'
      deny:
        - agent-coordinator/database/migrations/**
    context_impact:
      surfaces: [architecture, capabilities, documentation, semantic_code]
    worktree:
      name: ri09-wp-live-integration
      mode: isolated
    timeout_minutes: 120
    retry_budget: 2
    min_trust_level: 3
    verification:
      tier_required: A
      steps:
        - name: Run affected skill suites
          kind: command
          command: skills/.venv/bin/python -m pytest skills/tests/autopilot skills/tests/coordination-bridge -q
          cwd: .
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [skill_suites_pass]
        - name: Run coordinator status and queue tests
          kind: command
          command: agent-coordinator/.venv/bin/python -m pytest agent-coordinator/tests/test_status_reporting.py agent-coordinator/tests/test_work_queue.py -q
          cwd: .
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [coordinator_tests_pass]
        - name: Run live PostgreSQL projection and migration tests
          kind: command
          command: agent-coordinator/.venv/bin/python -m pytest agent-coordinator/tests/integration/postgres/test_autopilot_projection_acceptance_postgres.py agent-coordinator/tests/integration/postgres/test_work_queue_postgres.py agent-coordinator/tests/integration/postgres/test_fresh_database_migration.py agent-coordinator/tests/e2e/postgres/test_work_queue_live.py -q
          cwd: .
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [live_postgres_projection_tests_pass]
        - name: Run strict OpenSpec validation
          kind: command
          command: openspec validate --strict --all
          cwd: .
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [openspec_valid]
    metadata:
      loc_estimate: 180
      complexity: medium
      package_kind: integration
    inputs: {}
    outputs:
      result_keys: [skill_suites_pass, coordinator_tests_pass, openspec_valid]
      artifacts:
        - docs/guides/work-queue-truth-projection.md
