schema_version: 1
roadmap_id: evidence-grounded-debugging
source_proposal: openspec/roadmaps/evidence-grounded-debugging/proposal.md
status: planning
policy:
  default_action: wait_if_budget_exceeded
  max_switch_attempts_per_item: 2
items:
- item_id: ri-01
  title: Define evidence ledger schema with immutable facts
  status: in_progress
  priority: 1
  effort: M
  depends_on: []
  description: Add a versioned evidence-ledger.schema.json covering facts (id, kind,
    source, gathered_by, host, time_window, tool_version, role variable|control),
    signals derived from variable/control fact pairs, and hypotheses with cites, optional
    components, and status. Ship a deterministic validator module that enforces schema
    conformance and fact immutability, routing disputed facts through reverify_request
    entries.
  rationale: Every later capability (debugging rewrite, eliminative review, collect-facts,
    gap taxonomy, regression scenarios) consumes this ledger, and the proposal's core
    gap is the missing schema that ties hypotheses to facts. Immutability is a hard
    constraint and must be enforced at the foundation.
  change_id: define-evidence-ledger-schema-with-immutable-facts
  acceptance_outcomes:
  - The schema validates a fixture ledger containing variable and control facts, a
    derived signal, and a cited hypothesis.
  - The validator rejects a ledger revision in which a previously recorded fact's
    fields were edited in place, and accepts the same dispute expressed as a reverify_request
    plus a new fact.
  - Signals are classified as signal or noise and each references exactly one variable
    fact and one control fact.
  - Validator tests live under skills/tests/ and resolve any OpenSpec paths via change_dir().
- item_id: ri-02
  title: Add hypothesis-fact matrix and root-cause gate to validator
  status: approved
  priority: 1
  effort: M
  depends_on:
  - ri-01
  description: Extend the ledger validator to compute the hypothesis-by-fact matrix
    (consistent / contradicted / unknown), per-fact column counts as signal strength,
    and all-consistent survivor rows. Reject any root_cause that cites no facts, is
    not an all-consistent survivor row (any contradicted or unknown cell), or is a
    multi-cause hypothesis containing a non-necessary component.
  rationale: The constraint that no root cause may be reported without fact citations
    needs a deterministic enforcement point, and the matrix is the ranking mechanism
    the rewritten debugging method and eliminative reviewer both rely on.
  change_id: add-hypothesis-fact-matrix-and-root-cause-gate-to-validator
  acceptance_outcomes:
  - The validator rejects fixtures with an uncited root cause, a root cause contradicted
    by a recorded fact, and a root cause with any unknown cell against a recorded
    fact.
  - The validator emits the matrix with per-signal hypothesis counts and flags the
    all-consistent rows.
  - The necessity check fails a combined hypothesis when removing one component leaves
    no fact unexplained.
- item_id: ri-03
  title: Rewrite debugging-and-error-recovery around the two-tier method
  status: approved
  priority: 2
  effort: L
  depends_on:
  - ri-02
  description: 'Rewrite the skill so its default flow is: gather facts cheapest layer
    first, establish a control, separate signal from noise, rank signals by hypotheses
    admitted, and validate the leading hypothesis against every fact. Add the five
    refinement tactics, progressive signal discovery, and a reproduction-parity gate.
    Keep pytest/bisect as tools inside the flow, and write an evidence-ledger.yaml
    per investigation.'
  rationale: The skill still teaches the human-first reproduce-localize-reduce-fix
    order that produced the plausible-but-wrong diagnoses in the motivating essay.
    It is the primary consumer of the ledger and the place where controls and citations
    become the default.
  change_id: rewrite-debugging-skill-around-evidence-ledger
  acceptance_outcomes:
  - Running the skill on a seeded bug produces a schema-valid evidence ledger with
    at least one control fact and a computed matrix.
  - A behavioural skill test under skills/tests/debugging-and-error-recovery/ fails
    if the skill proposes a root cause before recording at least one control fact.
  - A reproduction that does not reproduce the recorded strongest signal is marked
    rejected in the ledger and is never cited as evidence.
  - The skill text orders code reading after fact gathering and control establishment,
    and descends a layer only when every current signal is weak.
- item_id: ri-04
  title: Add eliminative adversarial review mode
  status: approved
  priority: 3
  effort: L
  depends_on:
  - ri-02
  description: Add an eliminate mode to parallel-review-implementation and to iterate-on-implementation
    when it is debugging, whose reviewer must find contradicting facts, flag uncited
    claims, check that the control is not broken like the variable, re-check fact
    provenance, and run removal tests on multi-cause components. Dispatch routes the
    reviewer to a different vendor/model than the author with a ledger-derived context
    slice, and findings use new types in review-findings.schema.json.
  rationale: A same-model reviewer that corroborates rather than eliminates validated
    the wrong cert-reload theory in the motivating essay. The constraint that eliminative
    review runs on a different vendor/model must be enforced at dispatch, not left
    to convention.
  change_id: add-eliminative-adversarial-review-mode
  acceptance_outcomes:
  - In eliminate mode the dispatcher refuses a reviewer whose vendor/model matches
    the author's unless an operator override is supplied, and the override is recorded
    in the audit trail.
  - A seeded ledger with an uncited claim and a contradicting fact yields findings
    of type uncited_claim and contradicting_fact that validate against review-findings.schema.json.
  - The reviewer prompt contains the ledger and excludes the author's reasoning transcript.
- item_id: ri-05
  title: Build collect-facts core with provenance, redaction, and audit
  status: approved
  priority: 2
  effort: L
  depends_on:
  - ri-01
  description: Add a collect-facts <trace-id | change-id | PR> command that writes
    facts with full provenance into an evidence ledger from the coordinator audit
    trail, causal-trace-linked events, git range and diff stats, and the effects journal
    when present. Access is read-only, scoped to one investigation, time-limited,
    audited, and secret-redacted before facts are written.
  rationale: Default-on fact collection removes the piecemeal gathering that made
    agents skip the factual tier. The read-only, scoped, audited, redacted constraints
    must be built into the core so every later source adapter inherits them.
  change_id: build-collect-facts-core
  acceptance_outcomes:
  - Given a causal trace ID, collect-facts produces a schema-valid ledger whose facts
    each carry source, gathered_by, time_window, and tool_version.
  - A missing source (e.g. no effects journal yet) produces an explicit source_unavailable
    fact rather than a failure.
  - A secret-pattern fixture placed in a source is redacted in the output, and every
    invocation writes an audit record.
  - Collection performs no mutations of source systems; its only writes are the target
    ledger and its audit record, and it refuses to run past its configured time limit.
  external_depends_on:
  - multiplayer-collaboration:ri-03
- item_id: ri-06
  title: Add verification-signals contract to plan-feature
  status: approved
  priority: 3
  effort: M
  depends_on: []
  description: Make plan-feature emit a required verification-signals section in proposals,
    naming each quantitative signal, its emitting layer, its control or baseline,
    and its tolerance. The section is always present; planning-only and documentation-only
    changes state not applicable together with the reason instead of omitting it.
    Add a blocking proposal check for that structure (changes already in flight are
    grandfathered) and an advisory iterate-on-plan finding for declared signals that
    lack an emitting layer or baseline.
  rationale: Signal-parity verification needs correctness observation decided at design
    time; this contract is the input the snapshot capture and baseline-diff gate read,
    so default data collection becomes a planning obligation.
  change_id: add-verification-signals-contract-to-plan-feature
  acceptance_outcomes:
  - The proposal check fails a new proposal whose verification-signals section is
    absent, empty, or marked not applicable without a stated reason.
  - A planning-only or documentation-only proposal whose section reads not applicable
    with a reason passes, and changes in flight before the check landed are not failed.
  - iterate-on-plan reports a finding when a declared signal names no emitting layer
    or no baseline.
- item_id: ri-07
  title: Capture per-commit signal snapshots in validate-feature and gen-eval
  status: approved
  priority: 4
  effort: M
  depends_on:
  - ri-06
  description: Define a signal snapshot format and have validate-feature and gen-eval
    record a snapshot per run, covering the signals declared in the change's verification-signals
    plus a default coordinator-instrumentation set (call counts, latency distributions,
    external calls). Snapshots are stored keyed by commit SHA in existing stores rather
    than a new parallel store.
  rationale: The baseline-diff gate, signal-asserting regression scenarios, and collect-facts
    all need a stable snapshot format and per-commit history before they can compare
    signals instead of test outcomes.
  change_id: capture-per-commit-signal-snapshots
  acceptance_outcomes:
  - validate-feature writes a snapshot JSON keyed by commit SHA that includes every
    signal declared in the change's verification-signals section.
  - gen-eval runs record snapshots in the same format, validated by a shared snapshot
    schema.
  - The snapshot includes the default coordinator signal set even when a change declares
    no signals of its own.
- item_id: ri-08
  title: Add advisory baseline-diff gate with per-signal promotion
  status: approved
  priority: 4
  effort: M
  depends_on:
  - ri-07
  description: Compare the PR head's signal snapshot with the base branch's last green
    snapshot and flag any deviation beyond the declared tolerance even when every
    test passes. The gate starts advisory, and each signal is promoted to blocking
    individually once its false-positive rate is measured.
  rationale: This is automated canary analysis for agent PRs, which replaces pass/fail-only
    verification with signal parity. The advisory-first constraint requires per-signal
    mode tracking and false-positive measurement before anything blocks.
  change_id: add-advisory-baseline-diff-gate-with-per-signal-promotion
  acceptance_outcomes:
  - validate-feature attaches the diff against the base branch's last green snapshot
    to its report.
  - A seeded change that doubles an RPC count with all tests green is flagged by the
    gate.
  - Each signal has a recorded mode (advisory/blocking) and a measured false-positive
    rate, and setting a signal to blocking without a recorded rate is rejected.
- item_id: ri-09
  title: Extend collect-facts with config, model, memory, and snapshot sources
  status: approved
  priority: 5
  effort: M
  depends_on:
  - ri-05
  - ri-07
  description: Add collect-facts source adapters for resolved config and feature-flag
    values, the vendor/model/tier used, relevant episodic memories from the closed-loop-learning
    store, and the latest signal snapshots. Each adapter inherits the core's provenance,
    redaction, audit, and source_unavailable behaviour.
  rationale: The proposal lists these sources as part of the default factual tier.
    They depend on the snapshot format and are separable from the core so the core
    can ship in Phase 2.
  change_id: extend-collect-facts-sources
  acceptance_outcomes:
  - For a fixture change-id, the ledger contains facts for resolved feature-flag values,
    the vendor/model/tier used, and the latest signal snapshot, each with full provenance.
  - Episodic memories are read from the existing closed-loop-learning store, with
    no new store created.
  - Disabling any one adapter yields a source_unavailable fact for it while the other
    sources still populate.
- item_id: ri-10
  title: Add gap taxonomy and ledger links to intervention records
  status: approved
  priority: 3
  effort: S
  depends_on:
  - ri-03
  description: Extend intervention-capture records with a required gap category from
    the closed vocabulary (missing_control, missing_constraint, missing_citation,
    missing_data_source, wrong_layer, policy_decision, other) and a link to the evidence
    ledger of the investigation the intervention corrected.
  rationale: Treating each human intervention as missing infrastructure requires categorizing
    it and tying it to the investigation it fixed. This extends intervention-capture
    rather than replacing it.
  change_id: add-gap-taxonomy-and-ledger-links-to-intervention-records
  acceptance_outcomes:
  - An intervention record without a gap category from the vocabulary fails validation.
  - An intervention recorded during a debugging session stores a resolvable reference
    to that session's evidence ledger.
  external_depends_on:
  - multiplayer-collaboration:ri-18
- item_id: ri-11
  title: Report interventions per bug and rank gaps in improve-harness
  status: approved
  priority: 4
  effort: M
  depends_on:
  - ri-10
  description: Make agent-metrics report human interventions per bug over time, in
    total and per gap category, and make improve-harness rank categories by frequency
    and emit proposal stubs for categories above a configured threshold.
  rationale: Interventions per bug is the proposal's honest gauge of autonomy and
    its success criterion. Ranking categories turns them into an infrastructure backlog.
  change_id: report-interventions-per-bug-and-rank-gaps
  acceptance_outcomes:
  - agent-metrics outputs interventions-per-bug with a per-category breakdown for
    a fixture dataset.
  - The report shows a time series so the trend in interventions per bug is observable
    across periods.
  - improve-harness emits at least one candidate-work stub per category that exceeds
    a configured frequency threshold.
- item_id: ri-12
  title: Add signal_assertions to gen-eval regression scenarios
  status: approved
  priority: 5
  effort: M
  depends_on:
  - ri-07
  description: Extend the gen-eval scenario schema with a signal_assertions block
    that names a signal, its expected value or relation against a control, and its
    source layer, and make the runner enforce it. Upgrade existing converted failure-record
    regression scenarios to assert the signal that identified the original bug.
  rationale: Regression scenarios that only check outcomes can pass while the bug's
    signal regresses. Asserting the identifying signal extends the failure-record-to-regression
    work using the shared snapshot format.
  change_id: add-signal-assertions-to-gen-eval-regression-scenarios
  acceptance_outcomes:
  - The gen-eval scenario schema accepts signal_assertions, and the runner fails a
    scenario whose signal deviates even when its outcome assertion passes.
  - At least three existing converted regression scenarios are upgraded with signal
    assertions and pass.
  external_depends_on:
  - skill-rightsizing:ri-01
- item_id: ri-13
  title: Draft signal-asserting scenarios when a debugging ledger closes
  status: approved
  priority: 6
  effort: S
  depends_on:
  - ri-03
  - ri-12
  description: When a debugging session closes with a validated root cause, have the
    debugging skill propose a gen-eval regression scenario seeded from the ledger's
    strongest signal and its control.
  rationale: This closes the loop from investigation to regression coverage, so the
    evidence that identified a bug becomes a durable check instead of being lost after
    the fix.
  change_id: draft-signal-asserting-scenarios-from-ledger
  acceptance_outcomes:
  - Closing a debugging ledger with a validated root cause emits a draft scenario
    whose signal_assertions reference the ledger's strongest signal.
  - The draft scenario validates against the gen-eval scenario schema.
  - Closing a ledger without a validated root cause emits no draft scenario.
- item_id: ri-14
  title: Add decision-point policy playbook schema and capture
  status: approved
  priority: 6
  effort: M
  depends_on: []
  description: Define a playbook schema for policy entries (trigger condition, decision,
    rationale, author, scope) and, when a human resolves a judgment-call escalation,
    offer to save the resolution as a policy entry. Builds on owner-routed-escalation
    and its existing storage.
  rationale: Recurring judgment calls such as roll back vs fix forward or accepting
    a signal regression are a top source of human interventions. Recording them as
    policy is the first step to resolving them without a human.
  change_id: add-decision-point-policy-playbook-schema-and-capture
  acceptance_outcomes:
  - Resolving an escalation offers to save a policy entry, which validates against
    the playbook schema.
  - A policy entry missing a trigger condition, author, or scope fails validation.
  external_depends_on:
  - multiplayer-collaboration:ri-09
- item_id: ri-15
  title: Auto-apply matching playbook policies at escalation time
  status: approved
  priority: 7
  effort: M
  depends_on:
  - ri-14
  description: Have agents consult the playbook before escalating, auto-resolve when
    a policy's trigger matches with a citation to the policy ID, and audit each auto-resolution.
    Escalations with no matching policy still go to a human, with every option and
    its tradeoffs stated.
  rationale: Applying recorded policy automatically removes repeat interventions for
    already-decided judgment calls, while auditing and option presentation keep humans
    in control of novel decisions.
  change_id: auto-apply-matching-playbook-policies-at-escalation-time
  acceptance_outcomes:
  - A later escalation matching an existing policy's trigger is auto-resolved with
    a citation to the policy ID, and the auto-resolution is audited.
  - An unmatched escalation presents at least two options with tradeoffs, not a single
    recommendation.
