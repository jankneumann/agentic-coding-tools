schema_version: 1
roadmap_id: multiplayer-collaboration
source_proposal: openspec/roadmaps/multiplayer-collaboration/proposal.md
status: planning
policy:
  default_action: wait_if_budget_exceeded
  max_switch_attempts_per_item: 2
items:
- item_id: ri-01
  title: Publish the multiplayer collaboration principles guide
  status: completed
  priority: 1
  effort: S
  depends_on: []
  description: Add docs/guides/multiplayer-collaboration.md stating principles P1-P10,
    the single-principal assumption table, and how each skill behaves in solo versus
    team mode, linked from AGENTS.md and docs/guides/documentation.md.
  rationale: Every later capability cites a principle; the guide is the shared reference
    that makes the epic's intent legible to teammates and to agents, and it fixes
    the solo-versus-team vocabulary before code depends on it.
  change_id: multiplayer-principles-guide
  acceptance_outcomes:
  - docs/guides/multiplayer-collaboration.md exists and is linked from both AGENTS.md
    and docs/guides/documentation.md.
  - Each of the ten principles names at least one capability or existing mechanism
    that implements it.
  - The guide contains the single-principal assumption table and a per-skill solo-mode
    versus team-mode behavior section stating that solo mode adds no new prompts,
    gates, or PR checkpoints.
- item_id: ri-02
  title: Add human principals and the git-native ownership map
  status: in_progress
  priority: 1
  effort: L
  depends_on: []
  description: Extend the principal-credential-architecture registry with human principals
    (domains, availability), add a schema-validated openspec/owners.yaml assigning
    owners, decision rights, and acceptance rights to capabilities, roadmap items,
    and contract paths, and ship a resolver library plus CODEOWNERS emit/reconcile.
  rationale: Explicit principals (P1) and owned decisions (P2, P3) are the substrate
    for routing, attribution, intent ownership, and owner acceptance; every team-mode
    behavior asks 'who owns X?'. Extending the existing registry avoids the parallel-registry
    the constraints forbid.
  change_id: ownership-map
  acceptance_outcomes:
  - A schema-validated openspec/owners.yaml resolves an owner set for any capability,
    roadmap item, or contract path, falling back to a declared repository-default
    owner.
  - A check reports capabilities with no owner and owners that are not registered
    principals in the extended principal registry (no separate registry is created).
  - With no owners.yaml present, every resolver call returns the sole repository principal
    and the existing skill test suites pass unchanged (solo mode).
  - The resolver works from the git checkout alone with the coordinator unavailable,
    and CODEOWNERS generated from owners.yaml produces no routing disagreements in
    a reconcile check.
  - owners.yaml is registered in docs/guides/state-artifacts.md with writer, authority,
    and missing/stale behavior.
- item_id: ri-21
  title: Publish the supervisor-worker dispatch contract
  status: completed
  priority: 1
  effort: L
  depends_on: []
  description: 'Publish versioned dispatch-request and dispatch-result JSON schemas
    as the single definition of the supervisor-worker boundary; emit results from
    loop-state via runner.py emit-result; add gate provenance with posture-digest
    re-evaluation, execution_profile, review_requirements, degradations[], and the
    parked kinds permission_blocked and capability_unavailable, with a closure contract
    test so every schema-permitted parked shape has a supervisor answer path. Make
    dispatch state safe to land on a shared ref: persist only a hash of each launch
    token, record isolation as host-portable (repo-relative path plus host id) so
    another host can rebind or reinitialize live attempts, and scope auto gate dispositions
    to a matching roadmap_approval_ref instead of the repository-global posture.'
  rationale: Every stall in the first supervised run occurred at an unwritten part
    of the supervisor-worker boundary; queue-dispatched work (team-work-queue, owner-routed-escalation,
    queue-dispatch-owner-acceptance) is built on it.
  change_id: dispatch-contract
  acceptance_outcomes:
  - dispatch-request and dispatch-result schemas exist under openspec/schemas and
    execution.py and orchestrator.py validate against them with existing fixtures
    passing.
  - runner.py emit-result produces a schema-valid result for every terminal and parked
    loop-state shape, verified end to end.
  - A closure contract test fails when any schema-permitted parked kind/gate combination
    lacks a supervisor answer or resume path.
  - A posture-derived gate block clears on resume after a posture change while a human
    rejection does not.
  - execution_profile, review_requirements, and degradations[] are carried end to
    end, and permission_blocked and capability_unavailable parks are routed to the
    operator as single escalations.
  - checkpoint.json stores no raw launch token (only a digest that child_start verifies)
    and the default secret-scan passes on a committed checkpoint with live attempts
    and no allowlist entry.
  - A checkpoint with live attempts committed on one host can be reconciled on another
    host, which rebinds or reinitializes attempts instead of failing on absolute isolation
    paths.
  - An auto disposition for proposal_approval or replan_required proceeds only for
    a dispatch carrying a valid roadmap_approval_ref; a standalone autopilot run without
    one is gated by its non-auto fallback.
- item_id: ri-22
  title: OpenRouter review lane for cloud workers
  status: in_progress
  priority: 2
  effort: M
  depends_on:
  - ri-21
  description: Make API-based multi-vendor review available in cloud containers by
    registering OpenRouter-backed reviewer lanes (non-Anthropic model families) that
    dispatch over HTTP through the existing OpenAI-compatible adapter, need no vendor
    CLI, and count toward converge() quorum. Lanes are declared in the dispatch request's
    execution_profile and review_requirements from ri-21, verified by a dry invocation
    rather than credential probing, bounded by the existing spend ceiling, and their
    use retires the temporary cloud single-vendor review policy.
  rationale: Restores the two-vendor review quorum for cloud workers at metered API
    cost instead of waiting on the GX10 review lane, and replaces a prompt-level policy
    exception with a configured, observable lane.
  change_id: openrouter-review-lane
  acceptance_outcomes:
  - In a cloud container with an OpenRouter credential provisioned as an environment
    secret, converge() reaches min_quorum=2 for PLAN_REVIEW using claude_code plus
    at least one OpenRouter lane from a different model family, verified end to end
    on a fixture change.
  - Lane availability is established by a dry invocation of the lane for the requested
    mode and reported in execution_profile; no worker reads environment variables
    or credentials to discover it, and --check-vendors no longer reports a lane that
    cannot dispatch.
  - Every OpenRouter review records model, generation id and cost against the existing
    monthly spend ceiling; exceeding the ceiling parks with capability_unavailable
    instead of silently dropping to single-vendor review.
  - OpenRouter findings conform to review-findings.schema.json and are synthesized
    by ConsensusSynthesizer like CLI lanes, with vendor attribution preserved in the
    ledger.
  - The "Review quorum in cloud containers (temporary)" section of TRUST_POSTURE.md
    is removed once the lane passes in cloud, restoring quorum 2 everywhere, and review_requirements
    expresses any remaining per-environment exception as data with a sunset.
- item_id: ri-03
  title: Add on-behalf-of chains and causal trace IDs to coordinator records
  status: approved
  priority: 2
  effort: L
  depends_on:
  - ri-02
  description: Add on_behalf_of principal chains and correlation_id / causation_id
    fields to coordinator audit entries, events, approvals, handoffs, and PhaseRecord.write_both()
    output, with a causal-chain query and loop guards for echo events.
  rationale: P1 and P9 require every action to be traceable to a human principal and
    its trigger; causal IDs are what later lets corrections be linked to the trace
    that produced them and lets agents ignore echoes of their own actions.
  change_id: causal-trace-ids
  acceptance_outcomes:
  - Given any audit entry, a query returns its full causal chain back to the originating
    event or human request.
  - Every audit entry, event, approval, handoff, and phase record written after the
    change carries a non-empty on_behalf_of chain ending in a human principal.
  - Events caused by an agent's own action are identifiable as echoes by causation
    ID, and a loop guard rejects causal chains exceeding the configured hop count.
  - In solo mode the chain resolves to the sole repository principal and no new prompts
    appear.
- item_id: ri-04
  title: Stamp attribution trailers on skill-authored commits and PRs
  status: approved
  priority: 3
  effort: S
  depends_on:
  - ri-03
  description: Emit On-Behalf-Of and Correlation-Id commit trailers and PR-body metadata
    from skill-authored commits and PRs, as the git-native fallback carrier of the
    coordinator's causal IDs.
  rationale: Git is the source of truth and teammates without coordinator access must
    still see who acted on whose behalf (P1, P9); trailers make attribution and later
    correction-linking work from the git remote alone.
  change_id: attribution-trailers
  acceptance_outcomes:
  - Skill-authored commits carry On-Behalf-Of and Correlation-Id trailers, verified
    by a test over a generated commit.
  - Skill-created PR bodies include a metadata block with the principal chain and
    correlation ID readable as plain markdown.
  - With the coordinator unavailable, trailers are still written using locally generated
    IDs.
- item_id: ri-05
  title: Build the multi-player simulation harness
  status: in_progress
  priority: 2
  effort: M
  depends_on: []
  description: Add a gen-eval scenario pack that simulates two or more principals
    with separate identities, worktrees, and agents working overlapping changes, starting
    with a reproduction of the memory-store incident.
  rationale: Multi-player behavior is otherwise untestable in a solo-maintained repository;
    the harness provides the before/after baselines that verify each capability against
    the proposal's motivating failure modes.
  change_id: multiplayer-simulation-harness
  acceptance_outcomes:
  - 'A scenario with two principals modifying the same requirement runs and records
    whether a collision was detected at plan time (baseline: not detected).'
  - The memory-store scenario reports a time-blocked-on-dependency metric for the
    dependent principal.
  - Scenarios run in CI without network access to a shared coordinator.
  - Scenario tests resolve change paths with change_dir() and pass the OpenSpec path-stability
    guard test.
- item_id: ri-06
  title: Add git-native plan-time collision detection
  status: approved
  priority: 2
  effort: M
  depends_on:
  - ri-02
  - ri-05
  description: Add a scanner that reads openspec/changes/* spec deltas and contracts/
    across open PRs and remote branches, classifies collisions by level (intent, requirement,
    contract, file) with the owners involved, and run it from /plan-feature and /supervise
    intake.
  rationale: P7 requires collisions to surface at plan time, at the highest abstraction
    level, when they are still a conversation; the constraints require planning-time
    detection to work with only the git remote.
  change_id: plan-time-collision-detection
  acceptance_outcomes:
  - When two open changes modify the same Requirement heading of a capability, the
    second /plan-feature run reports the collision, the other change, and its owner
    before tasks are generated.
  - The scanner produces results with only a git remote available and no coordinator.
  - Each reported collision is classified as intent, requirement, contract, or file
    level.
  - An unavailable or failing scanner emits a warning and never blocks planning.
  - The simulation harness's same-requirement scenario flips from not-detected to
    detected.
- item_id: ri-07
  title: Extend coordinator overlap analysis to requirements and contracts
  status: approved
  priority: 3
  effort: M
  depends_on:
  - ri-06
  description: Extend feature_registry.py overlap analysis from lock keys and files
    to OpenSpec requirements and contract files, and merge its live claims into the
    git-native collision report when the coordinator is reachable.
  rationale: 'The coordinator half of P7: live claims catch in-flight work that has
    not yet been pushed, enriching but never replacing the git-native scan.'
  change_id: coordinator-contract-overlap
  acceptance_outcomes:
  - feature_registry overlap analysis reports two registered features touching the
    same requirement or contract file as a collision at the matching level.
  - With the coordinator reachable, /plan-feature's collision report includes live
    claims not yet visible on the git remote, labeled as such.
  - With the coordinator unreachable, the collision report is identical to the git-native
    report and planning is not blocked.
- item_id: ri-08
  title: Make the work queue a shared team execution surface
  status: approved
  priority: 1
  effort: L
  depends_on:
  - ri-02
  - ri-21
  description: Extend work_queue.py, /supervise, and /autopilot-roadmap so queue entries
    carry the owning principal, the originating roadmap item, and its dependencies,
    any eligible agent can claim any ready entry, and ordering across principals follows
    an explicit owned priority policy, with entries remaining rebuildable projections
    of roadmap.yaml and loop-state.json.
  rationale: The execution model makes the shared queue the primary execution surface
    (P10) and implementation a commons (P2); cross-principal ordering is an intent
    decision (P3). This is the foundation for queue-dispatched implementation and
    escalation parking.
  change_id: team-work-queue
  acceptance_outcomes:
  - Roadmap items from two principals' roadmaps appear in one queue, each entry attributed
    to its owner and source item.
  - An agent claims the highest-priority ready entry under the declared priority policy,
    independent of entry owner.
  - Deleting all queue rows and re-running reconciliation reproduces the same entries
    from git state.
  - A change to the cross-principal priority policy is accepted only from the policy's
    owner.
  - With a single principal and no owners.yaml, queue ordering and claim behavior
    match the pre-change behavior in the existing work-queue tests.
  external_depends_on:
  - roadmap-always-on-agent-automation:ri-07
  - roadmap-always-on-agent-automation:ri-08
- item_id: ri-09
  title: Route approvals and escalations to resolved owners
  status: approved
  priority: 1
  effort: L
  depends_on:
  - ri-02
  - ri-08
  - ri-21
  description: Make the approval gate resolve its owner set from the ownership map
    with a fallback chain, enforce that decided_by belongs to that set, let trust
    posture declare gate owners per capability, add a principal-conflict escalation
    type, and let an escalating queue agent park its item and claim the next ready
    entry, with a per-principal escalation inbox.
  rationale: Escalation is the primary human interface in the queue-driven model (P10);
    routing each decision to its owner (P1, P3, P8) and failing closed on unknown
    owners is what keeps agents from deciding on a human's behalf without idling workers.
  change_id: owner-routed-escalation
  acceptance_outcomes:
  - An approval request records its resolved owner set, and a decision by a principal
    outside it is rejected.
  - An unresolvable owner fails closed to the repository-default owner and the fallback
    is reported.
  - An escalating queue agent parks the item in a resumable state and claims another
    ready entry; the parked item becomes ready again within one reconciliation cycle
    of the owner's answer.
  - A principal can list every open escalation addressed to them, with its item, options,
    recommendation, default action, and deadline.
  - In solo mode approvals route to the sole principal with no additional prompts
    or gates compared to today.
- item_id: ri-10
  title: Add per-principal attention budgets and digests
  status: approved
  priority: 3
  effort: M
  depends_on:
  - ri-09
  description: Give each principal an urgency threshold and digest cadence, extending
    event_bus.classify_urgency so events below the threshold are batched into a per-principal
    digest and only events above it notify through the existing notification channel
    seam.
  rationale: Attention is the scarce resource (P8); once escalations are routed to
    owners, budgets keep the escalation inbox from becoming the next bottleneck.
  change_id: attention-budgets-digests
  acceptance_outcomes:
  - A principal receives notifications only for events above their configured threshold;
    the remainder appear in their next digest.
  - Digest cadence is configurable per principal and a digest lists every below-threshold
    event since the previous digest.
  - With no per-principal configuration, notification behavior is unchanged from today.
- item_id: ri-11
  title: Bind roadmap dependencies to contracts
  status: approved
  priority: 2
  effort: L
  depends_on:
  - ri-05
  - ri-08
  description: 'Extend the roadmap schema so depends_on entries may bind to a dependency''s
    contract ({item, on: contract}), add a contract_complete item state, teach /autopilot-roadmap,
    /supervise, and the queue projection to make dependents ready at contract-complete,
    and have /implement-feature generate stubs or fakes from the contract for unimplemented
    dependencies.'
  rationale: P4 says dependents should unblock at the agreed contract rather than
    wait for implementation; this removes the critical-path stall from the motivating
    incident.
  change_id: contract-dependencies
  acceptance_outcomes:
  - A roadmap item depending on a contract becomes a ready queue entry when its dependency
    reaches contract_complete, before that dependency is implemented.
  - Existing bare depends_on entries keep implementation-complete semantics, and all
    existing roadmaps validate unchanged against the extended schema.
  - /implement-feature provides a contract-generated stub for each contract dependency
    that is not yet implemented.
  - contract_complete is recorded in roadmap.yaml / loop-state.json, so a rebuilt
    queue reproduces the same readiness.
  - The memory-store simulation scenario shows reduced time-blocked-on-dependency
    compared with its baseline.
- item_id: ri-12
  title: Open a declare-early draft PR at plan completion
  status: approved
  priority: 3
  effort: M
  depends_on:
  - ri-02
  description: Have /plan-feature (and /autopilot at plan completion) open a draft
    PR containing only the proposal, spec deltas, and contracts before implementation
    begins, listing contracts introduced or changed and the owners whose review is
    requested.
  rationale: The draft PR is the claim, contract announcement, and review invitation
    that teammates who do not use the skills can see (P4, P7, P8); it is also the
    git-native surface later used to mirror queue claims.
  change_id: declare-early-draft-pr
  acceptance_outcomes:
  - A planned change has a draft PR with proposal, spec deltas, and contracts/ before
    the first implementation commit.
  - The draft PR body lists contracts introduced or changed and the owners whose review
    is requested, as plain markdown.
  - The behavior is opt-out per repository and is skipped in solo mode unless explicitly
    enabled.
- item_id: ri-13
  title: Dispatch implementation through the queue with owner acceptance
  status: approved
  priority: 2
  effort: L
  depends_on:
  - ri-08
  - ri-09
  - ri-12
  - ri-21
  description: Separate owner from implementer on roadmap items and changes, default
    the implementer to the agent queue (optionally restricted to a named principal's
    agents), have queue agents implement from the agreed contract and open PRs into
    the owner's domain, and mirror claims as draft PRs so in-flight work is visible
    from the remote.
  rationale: Owning decisions rather than labor (P2) with the queue as the execution
    path (P10) is the core fix for the motivating incident, where a dependency waited
    on its domain owner's own implementation.
  change_id: queue-dispatch-owner-acceptance
  acceptance_outcomes:
  - A roadmap item with default implementer policy is dispatched to the queue without
    requiring its owner to start a session.
  - A queue-implemented PR requests review from the item owner and cannot be merged
    without the owner's acceptance.
  - Claimed, in-flight implementation is visible from the git remote alone via a draft
    PR naming the item and claim time.
  - An owner rejection is recorded with its reason and linked to the contract, so
    spec gaps surfaced by rejection become amendments.
  - In solo mode the sole principal is both owner and acceptor and no additional acceptance
    gate appears.
- item_id: ri-14
  title: Add owned intent blocks with single-writer change control
  status: approved
  priority: 3
  effort: M
  depends_on:
  - ri-02
  - ri-09
  description: Give each proposal a structured intent block (goals, non-goals, constraints,
    done-means) with a declared owner, add a CI check that rejects non-owner edits
    lacking an accepted amendment, and have agents raise a principal-conflict escalation
    when they detect conflicting intents.
  rationale: Intent is a single-writer artifact (P3) and agents must never arbitrate
    between principals' intents; this turns the 'whose spec wins' argument into an
    owner decision.
  change_id: owned-intent-blocks
  acceptance_outcomes:
  - openspec validate accepts a proposal intent block whose owner resolves in the
    ownership map and rejects one whose owner does not.
  - A PR that edits another owner's intent block without an accepted amendment fails
    the intent-ownership check.
  - An agent encountering two principals' conflicting intents emits a conflict escalation
    naming both owners and makes no choice between them.
  - Proposals without an intent block, and repositories without owners.yaml, validate
    and merge exactly as before.
- item_id: ri-15
  title: File consumer-driven contract tests upstream
  status: approved
  priority: 3
  effort: L
  depends_on:
  - ri-11
  - ri-12
  description: When /plan-feature plans a change that consumes another change's contract,
    write the consumer's needs as executable contract tests and propose them to the
    upstream change via PR to its owner; upstream /validate-feature runs them, and
    a spec-split helper partitions requirements into consumer-tested kernel and ranked
    backlog.
  rationale: Concerns must be executable (P5) and dependents bind to contracts (P4);
    consumer tests define what the contract kernel must satisfy and supply the tests
    that reconciliation later unions.
  change_id: consumer-contract-tests
  acceptance_outcomes:
  - A consuming change's plan produces contract tests attributed to the consumer and
    proposed to the upstream change's owner.
  - Upstream /validate-feature reports per-consumer contract test results.
  - A spec-split helper partitions a capability's requirements into kernel (consumer-tested)
    and backlog (untested), preserving backlog rationale.
- item_id: ri-16
  title: Add the /reconcile skill for divergent branches and specs
  status: approved
  priority: 3
  effort: L
  depends_on:
  - ri-09
  - ri-14
  - ri-15
  description: Add a /reconcile skill that runs /audit-choices per branch, extracts
    contracts and concerns-as-tests, builds an agree / complementary / conflicting
    / unique matrix, routes each conflict to its owner as a typed decision, and emits
    an OpenSpec change for the reconciled contract plus the test union, reusing synthesize_variants().
  rationale: P6 reconciles insight rather than diffs; this is the direct fix for the
    competing-spec half of the motivating incident and lifts the existing /prototype-feature
    synthesis path to many principals.
  change_id: reconcile-skill
  acceptance_outcomes:
  - Given two branches, /reconcile produces a reconciliation matrix in which every
    conflicting item names an owner and a pending decision.
  - The output change validates with openspec validate --strict and includes the reconciled
    test union as acceptance tests.
  - Given two competing proposals for one capability, the workflow emits a kernel/backlog
    split with no requirement from either proposal silently dropped.
  - /reconcile runs with only the git remote available, and conflicts between principals'
    intents are escalated rather than resolved by the agent.
- item_id: ri-17
  title: Shape skill-authored PRs for reviewers
  status: approved
  priority: 4
  effort: M
  depends_on:
  - ri-02
  - ri-09
  description: Lead PRs created by /autopilot and /cleanup-feature with a ledger (decisions
    where the spec was silent, contracts changed, concerns-as-tests added, evidence)
    generated from choices.json and contract diffs, and add a configurable size budget
    that splits work or pauses at a contract checkpoint for review by a non-running
    owner.
  rationale: Reviewer throughput is the team bottleneck and rationale artifacts go
    unread (P6, P8); placing the ledger before the diff and bounding PR size keeps
    review proportional to agent output.
  change_id: reviewer-shaped-prs
  acceptance_outcomes:
  - PRs created by /autopilot and /cleanup-feature render a ledger section generated
    from choices.json and contract diffs.
  - A change exceeding the size budget pauses at a contract checkpoint requesting
    review from a non-running owner when one exists.
  - In solo mode the checkpoint is skipped and only the ledger section is added.
- item_id: ri-18
  title: Capture human interventions as labeled corrections
  status: approved
  priority: 4
  effort: M
  depends_on:
  - ri-04
  - ri-09
  description: Record human edits to agent output, overrides, rejections, reverts
    of autonomous actions, and unnecessary or missed escalations as correction records
    linked by causal ID to the producing trace, classified intent-level or execution-level,
    and feed them into the closed-loop-learning flywheel.
  rationale: Every human intervention is a signal (P9); corrections are the evidence
    trust calibration needs, and routing them into the existing flywheel avoids a
    parallel learning store.
  change_id: intervention-capture
  acceptance_outcomes:
  - A reverted or human-edited agent commit produces a correction record linked to
    its trace and classified intent vs execution.
  - Correction records are written into the closed-loop-learning store, and no new
    learning store is created.
  - Only artifacts in the shared repository and coordinator are captured; private
    session transcripts are excluded unless the principal opts in.
- item_id: ri-19
  title: Calibrate trust posture from correction rates
  status: approved
  priority: 5
  effort: M
  depends_on:
  - ri-18
  description: Compute per-gate and per-owner approve-unchanged and override rates
    from correction records over a window, and generate trust-posture change proposals
    when a gate crosses a configured threshold, gated to the posture owner and never
    self-applied.
  rationale: P9 calibrates trust from evidence and P8 reduces interruptions where
    humans consistently approve unchanged; owner-gated proposals keep authority with
    humans.
  change_id: trust-posture-calibration
  acceptance_outcomes:
  - A gate report shows approve-unchanged and override rates per gate and owner over
    a configurable window.
  - A trust-posture change proposal is generated when a gate crosses a configured
    threshold and requires the posture owner's approval to apply.
  - No trust-posture change is applied without a recorded decision by the posture
    owner.
- item_id: ri-20
  title: Stamp and check team toolkit consistency
  status: in_progress
  priority: 5
  effort: M
  depends_on: []
  description: Have install.sh stamp the installed toolkit version and payload hash
    into a tracked file in the consumer repository, add install.sh --check to report
    drift between the pinned version and local runtime copies, and support opt-in
    repository-scoped shared learnings.
  rationale: Installed skill versions drifting between developers makes team behavior
    inconsistent and keeps learning personal (P9); a pinned, checkable install lets
    improvements reach every teammate's agents.
  change_id: toolkit-consistency
  acceptance_outcomes:
  - A consumer repository records the installed toolkit version and payload hash in
    a tracked file registered in docs/guides/state-artifacts.md.
  - install.sh --check reports drift between the pinned version and the local runtime
    copy.
  - Repository-scoped learnings are opt-in and never include private transcript content.
  - Installed payloads contain no references to private coordinator source.
