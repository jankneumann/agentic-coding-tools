schema_version: 1
roadmap_id: roadmap-jev-system-one-integration-assessment
source_proposal: docs/proposals/jev-system-one-integration-assessment.md
status: approved
policy:
  default_action: wait_if_budget_exceeded
  max_switch_attempts_per_item: 2
items:
- item_id: ri-01
  title: Add the shared system_one decision helper, fallback-only
  status: completed
  priority: 1
  effort: M
  depends_on: []
  description: 'Create the installable package packages/system-one-decisions (importable
    as system_one_decisions) with the frozen Decision dataclass and both entry points,
    decide(state, questions, *, site) and decide_intent(state, intents, *, fallback,
    human_intent, act_floor, irreversible, approve_floor, site), implemented with
    no network call at all: every decision comes from the caller''s existing rule
    via fallback and is recorded to the caller''s event log with degraded=True and
    evidence_class "judgment". Declare it from every consuming runtime: a path dependency
    in skills/pyproject.toml, an optional "decisions" extra in packages/gen-eval/pyproject.toml,
    and a path dependency in agent-coordinator/pyproject.toml plus a COPY line in
    the coordinator Dockerfile beside the existing gen-eval and code-search copies.'
  rationale: 'Pilot step 0 of the proposal. Landing the helper fallback-only turns
    every existing rule decision in Group C into a recorded, replayable event before
    any model is consulted, and gives every later item a single seam to switch on.
    A package boundary rather than a skills/shared module is required because the
    three consumers (skills venv, gen-eval, coordinator image) do not share a dependency
    set: gen-eval is independently installable and the coordinator Dockerfile copies
    only skills/shared/github_classifier.py.'
  change_id: add-the-shared-system-one-decision-helper-fallback-only
  acceptance_outcomes:
  - packages/system-one-decisions exports Decision(intent, p, distribution, degraded,
    evidence_class="judgment"), decide and decide_intent, has no required dependencies,
    and imports no vendor SDK.
  - The package is importable from the skills venv, from a standalone `uv pip install
    packages/gen-eval[decisions]`, and inside the coordinator Docker image (docker-smoke-import
    covers `import system_one_decisions`).
  - With no TYPESAFE_API_KEY set, decide_intent returns fallback(state) with degraded=True
    and never raises, proven by a unit test for each of the four documented checks
    (unavailable, act_floor, irreversible/approve_floor, normal return).
  - A decide_intent call appends one event carrying intent, distribution and degraded
    to the caller's event log, asserted against a loop-state.json phase_history fixture.
  - Unit tests in packages/system-one-decisions/tests cover act_floor routing to human_intent
    and needs_approval flagging for intents in the irreversible set.
- item_id: ri-02
  title: Wire the live TypeSafe client, thresholds and telemetry
  status: completed
  priority: 1
  effort: M
  depends_on:
  - ri-01
  description: 'Add typesafe-sdk under a "live" optional extra of packages/system-one-decisions,
    have the package build the live client from TYPESAFE_API_KEY behind a token-budget
    guard, and give decide() an optional caller-supplied event_sink (mirroring decide_intent()''s
    existing one) that receives site, latency, usage_input_tokens and the answered
    probabilities on every completed call -- whether that reaches Langfuse is left
    to the caller. Establish the per-site threshold convention: thresholds live in
    a package-owned data file (packages/system-one-decisions/src/system_one_decisions/config/thresholds.json),
    loaded by the package itself, never as literals in a scoring module.'
  rationale: 'Turns the fallback-only seam into a working integration while honouring
    the integration-seam constraints: SDK imported in exactly one package, PyPI-only
    cloud harness network policy respected via an optional extra so the fallback-only
    install never needs it, no threshold literals in scoring modules per the context_eval
    convention, and every judgment-derived value carrying its probability.'
  change_id: wire-the-live-typesafe-client-thresholds-and-telemetry
  acceptance_outcomes:
  - packages/system-one-decisions declares a "live" extra containing typesafe-sdk;
    the default install of the package and of every consumer still succeeds without
    it.
  - typesafe_sdk is imported inside packages/system-one-decisions and nowhere else
    in the repository, enforced by a grep-style guard test.
  - decide returns None (never raises) when the live extra isn't installed, the key
    is absent, the network fails, or serialized state plus the longest question exceeds
    the 32K-token budget, with one test per branch (four branches).
  - Each completed call passes site, latency_ms, usage_input_tokens and the per-label
    probabilities to decide()'s optional event_sink, exactly once; whether a caller
    forwards that to Langfuse is that caller's own decision, made when it migrates
    a call site.
  - A guard test asserts no float threshold literal is introduced into the package;
    act_floor/approve_floor defaults resolve from a package-owned packages/system-one-decisions/src/system_one_decisions/config/thresholds.json.
- item_id: ri-03
  title: Add the adapter-backed test substitute and dry-run policy
  status: completed
  priority: 1
  effort: S
  depends_on:
  - ri-02
  description: 'Stand up the testing convention for every later site: system_one_decisions.testing
    exports reusable stub helpers for decide/decide_intent, behavioural wiring tests
    use system-one-adapter (Anthropic provider, llm_answer_mode="probabilities") with
    test names marking its probabilities uncalibrated, and decide()''s own dry_run
    parameter guarantees --dry-run paths make no API call.'
  rationale: The proposal's integration seam requires a CI substitute because the
    repo's convention is no network in dry-run and CI. Landing the substitute and
    the naming rule once keeps every Group A/B/C item from re-inventing it and prevents
    an adapter's self-reported probabilities from being mistaken for calibrated ones
    in test output.
  change_id: add-the-adapter-backed-test-substitute-and-dry-run-policy
  acceptance_outcomes:
  - system_one_decisions.testing exports reusable stub helpers (stub_decide, stub_decide_intent)
    for decide/decide_intent, exercised by at least one test that asserts the caller's
    fallback rule still runs when the stub returns None.
  - Adapter-backed behavioural tests are skipped unless both ANTHROPIC_API_KEY and
    SYSTEM_ONE_ADAPTER_TESTS=1 are set, and every such test name contains "uncalibrated".
  - decide() accepts an explicit dry_run parameter (default False, preserving existing
    behavior) that guarantees zero client construction when True, verified by a test
    asserting the client-construction seam is never reached -- the enforcement point
    a future call-site migration's own --dry-run flag threads into, since no system_one-consuming
    script exists yet to test end-to-end.
  learning_refs:
  - ri-02
- item_id: ri-04
  title: Replace the gen-eval semantic judge with a calibrated Noul
  status: approved
  priority: 1
  effort: M
  depends_on:
  - ri-03
  description: Rewrite gen_eval.semantic_judge.evaluate_semantic to ask one Noul("The
    actual output satisfies the criteria") over {criteria, actual_output}, using noul
    as the confidence that min_confidence already thresholds, and call the existing
    LLM prompt only on failures that need a human-readable reasoning string.
  rationale: 'Pilot step 1: the smallest surface in the proposal, already carrying
    skip semantics when the backend is unavailable. It is also the site where the
    active calibrate-llm-judge-against-human-labels change supplies a 40-item human-labelled
    set, so this item is where the kappa bar is first paid rather than assumed.'
  change_id: replace-the-gen-eval-semantic-judge-with-a-calibrated-noul
  acceptance_outcomes:
  - evaluate_semantic scores the 40-item human-labelled set from calibrate-llm-judge-against-human-labels
    and reaches Cohen's kappa >= 0.7 on the judged dimension; the measured kappa is
    recorded in the change's artifacts.
  - min_confidence gates on noul with no signature change, and existing semantic_judge
    tests pass unmodified.
  - When the decision helper returns None the module still returns its existing skip
    result, covered by a test.
  - Reasoning prose is produced by an LLM only for items that fail the threshold,
    asserted by a test counting LLM invocations on an all-pass batch (zero).
- item_id: ri-05
  title: Judge cross-vendor finding matching in consensus_synthesizer
  status: approved
  priority: 1
  effort: L
  depends_on:
  - ri-03
  - ri-04
  description: 'Add a judged path to consensus_synthesizer.match_score: for candidate
    pairs sharing axis and file, ask one Noul("Findings A and B describe the same
    underlying defect") per pair, batched as N questions over one shared per-file
    state, keeping the line-overlap and snippet bands as fast paths and the Jaccard
    bands as the fallback. A match established only by the judged path records match_basis
    "judged", and _consensus_evidence_class returns "judgment" for any consensus finding
    whose match basis is judged regardless of its contributors'' classes, so a probabilistic
    match can never raise the blocking count; its output feeds adjudication and disagreement
    routing. Move MATCH_THRESHOLD into config.'
  rationale: 'Pilot step 2 and the highest-value Group A site. The hand-tuned Jaccard
    bands produced match_score 0.0 on all 23 findings of PR #484 including two real
    defects phrased differently by two vendors. A calibrated same-defect probability
    is also the signal rescope-review-convergence-disagreement-routing needs to tell
    genuine disagreement from re-phrasing. Because _consensus_evidence_class today
    makes a consensus finding deterministic when any contributor is deterministic,
    the judged path must be kept out of the blocking count explicitly or it would
    let a probability block a merge.'
  change_id: judge-cross-vendor-finding-matching-in-consensus-synthesizer
  acceptance_outcomes:
  - Replaying openspec/changes/add-orchestrator-adjudication-review-gate/fixtures/pr484-consensus.json
    pairs the two real defects across vendors and routes them to adjudication rather
    than leaving them unconfirmed.
  - A consensus finding whose match basis is judged carries evidence_class "judgment"
    even when both contributing findings are deterministic, and blocking_count is
    unchanged by judged matches, asserted by a unit test on two deterministic scanner
    findings.
  - Routing precision on the seeded-defect set from measure-validator-recall-seeded-defects
    does not drop relative to the recorded band-only baseline, with both numbers in
    the change artifacts.
  - Pairs resolved by the line-overlap or identical-snippet fast paths issue no call,
    asserted by a call-count test.
  - MATCH_THRESHOLD is read from config by both consensus_synthesizer.py and review_ledger.py;
    no threshold float literal remains in the scoring path.
- item_id: ri-06
  title: Run the GATEKEEPER as a scored decision in shadow mode
  status: approved
  priority: 1
  effort: L
  depends_on:
  - ri-05
  description: 'Add shadow-mode recording to the autopilot loop and use it for _phase_gatekeeper:
    alongside the existing premium-tier judge, ask Score(verifiability, 4 levels),
    Score(risk, 4 levels) and Choice(verdict, {proceed, proceed_with_review, escalate})
    over gate_signals plus proposal.md, tasks.md and the work-packages summary, compute
    a candidate verdict in code from the two scores, and log it beside the acting
    verdict without acting on it.'
  rationale: 'Pilot step 3 and the cleanest fit in the repo: the rubric is already
    two named dimensions and the gate outcome should be computed in code rather than
    asserted by the judge, the pattern add-orchestrator-adjudication-review-gate prefers.
    Shadow mode buys the disagreement measurement before any behaviour change, and
    this item also lands the shadow plumbing C1 reuses.'
  change_id: run-the-gatekeeper-as-a-scored-decision-in-shadow-mode
  acceptance_outcomes:
  - A shadow record per gatekeeper run appends judged verdict, both score distributions
    and the acting verdict to loop-state.json phase_history, asserted against a fixture
    run.
  - The acting verdict is byte-identical to today's for every run in the shadow period,
    proven by a replay test over recorded gate_signals.
  - The code-computed verdict is derived from the two Score distributions with thresholds
    read from config; the Choice verdict is recorded only as a cross-check.
  - A reporting script emits the GATEKEEPER disagreement rate over the shadow period's
    runs.
  - --force and the scope-safety floor are untouched, covered by existing autopilot
    tests passing unmodified.
- item_id: ri-07
  title: Adjudicate phase outcomes in shadow mode
  status: approved
  priority: 1
  effort: L
  depends_on:
  - ri-06
  description: Insert a decision step between a phase sub-agent's return and apply_phase_outcome
    that asks Choice(outcome, the phase's allowed outcomes) and Noul("the evidence
    supports the claimed outcome") over the handoff record, expected_outcomes, worktree
    diff stat, test-output tail and the claimed outcome, recording judged versus claimed
    without changing the reducer.
  rationale: Pilot step 3's correctness half, from the companion note. Today the reducer
    trusts the label the actor chose for itself, so a fixer that says "fixed" costs
    a full review dispatch to disprove. Shadow mode measures how often claimed and
    judged disagree, and which side the next review round vindicated, before the reducer
    is allowed to act on the judgment.
  change_id: adjudicate-phase-outcomes-in-shadow-mode
  acceptance_outcomes:
  - Each phase transition appends a record with claimed outcome, judged outcome, the
    outcome distribution and the evidence Noul to loop-state.json phase_history.
  - transition(state, outcome) still runs on the claimed outcome for the whole shadow
    period, proven by a replay test showing identical phase sequences.
  - The disagreement report attributes each disagreement to the side the next review
    round vindicated, over at least one sprint of recorded autopilot runs.
  - A degraded decision (helper returns None) is recorded via record_degraded and
    leaves the existing behaviour unchanged, covered by a test.
- item_id: ri-08
  title: Promote shadow judgments to acting decisions
  status: approved
  priority: 2
  effort: M
  depends_on:
  - ri-06
  - ri-07
  description: 'Using the shadow-period measurements, flip both sites to act: the
    gate outcome is computed from the calibrated scores with operator-set thresholds,
    and phase-outcome adjudication applies the switch rule (agreement above act_floor
    proceeds; disagreement lets the judged label win above approve_floor, otherwise
    escalate with both labels in the evidence). Retire the premium-tier gatekeeper
    dispatch.'
  rationale: 'This is the item that realises the proposal''s two headline returns:
    the largest per-run cost saving (a premium-tier read-only judge replaced by a
    sub-cent call) and the largest correctness gain (a fixer''s self-report no longer
    trusted). Keeping it separate from the shadow items makes the flip an explicit,
    evidence-gated decision rather than a side effect.'
  change_id: promote-shadow-judgments-to-acting-decisions
  acceptance_outcomes:
  - Promotion is gated on the recorded shadow disagreement rate and vindication split,
    both cited in the change's rationale with the thresholds chosen from them.
  - A test asserts that claimed/judged disagreement below approve_floor transitions
    to escalate with both labels present in the escalation evidence.
  - The premium-tier GATEKEEPER archetype dispatch is removed from the autopilot run
    path and complexity_gate.default_gate_verdict remains the headless fallback, covered
    by a headless-run test.
  - Per-run judged-call cost for a reference autopilot run is recorded and is under
    one cent.
  - Every promoted decision reaching a report carries evidence_class "judgment" and
    its probability; no deterministic gate is bypassed, asserted by the scope-safety
    floor tests.
- item_id: ri-09
  title: Judge transcript struggle triage in collect-transcripts
  status: approved
  priority: 3
  effort: M
  depends_on:
  - ri-05
  description: Keep the four event-stream counters in triage.py as facts but replace
    the weighted sum and its 5/10 buckets with Choice(struggle_level, {none, low,
    medium, high}) plus Nouls for human redirection, out-of-scope work and whether
    the session warrants deep analysis, over a compacted transcript from normalize.py
    plus the counters.
  rationale: Pilot step 4. The weighted sum, the six-substring scope test and the
    "any user message after a tool error is a correction" rule are judgments dressed
    as arithmetic, and the sibling prompts/triage_v1.md shows the intent was always
    a judged call. deep_analyze stays an LLM because capability_gap is prose.
  change_id: judge-transcript-struggle-triage-in-collect-transcripts
  acceptance_outcomes:
  - flagged_for_deep_analysis is set from the corresponding Noul with a config-held
    threshold; the weighted sum and its 5/10 buckets remain as the fallback and are
    exercised by a test.
  - State sent for triage contains only assistant/user/tool-result text from normalize.py's
    compact event form, with a test asserting tool payloads are excluded and the state
    stays under the token budget.
  - The four counters are still computed deterministically and appear unchanged in
    the triage output schema.
  - Existing collect-transcripts triage tests pass with the helper stubbed to None.
- item_id: ri-10
  title: Judge implementation strategy selection in autopilot
  status: approved
  priority: 3
  effort: S
  depends_on:
  - ri-05
  description: Replace the four-criterion weighted sum in implementation_strategy_selector
    with Choice(strategy, {alternatives, lead_review}) over the package YAML and the
    matching design.md section, using the reserved design_path parameter, while keeping
    the vendor-count availability gate deterministic and falling back to lead_review
    when confidence is low.
  rationale: Pilot step 4. The selector's loc/alternatives/kind/vendors sum is a proxy
    for "are there two plausible designs worth comparing", and design_path is already
    documented as reserved for exactly this inference. Choosing alternatives costs
    three implementations, so a low-confidence answer must bias toward the cheap branch.
  change_id: judge-implementation-strategy-selection-in-autopilot
  acceptance_outcomes:
  - design_path is read and its matching design.md section forms part of the state,
    covered by a test using a package fixture.
  - Confidence below the config-held floor yields lead_review, asserted by a stubbed-decision
    test.
  - The vendor-count gate still forces lead_review when fewer than three vendors are
    available, regardless of the judged label.
  - The existing weighted-sum selector remains reachable as the fallback and its current
    tests pass unchanged.
- item_id: ri-11
  title: Judge multi-vendor review eligibility for pull requests
  status: approved
  priority: 3
  effort: M
  depends_on:
  - ri-05
  description: Replace the under-50-lines / under-3-files skip in vendor_review.check_review_eligibility
    with Noul("This PR warrants independent multi-vendor review") and Score(risk,
    ["docs/config only", "internal refactor", "behaviour change", "security or data
    path"]) over the PR title, body, file list and diff stat, keeping the size rule
    as the degraded path.
  rationale: Pilot step 4. A 40-line change to guardrails.py or a Cedar policy is
    "small" under the current rule while a 300-line docs move is "large", so the size
    threshold routes review effort by the wrong variable. Provenance-based skips are
    facts and stay deterministic.
  change_id: judge-multi-vendor-review-eligibility-for-pull-requests
  acceptance_outcomes:
  - A fixture PR of under 50 changed lines touching guardrails.py or a policy file
    is routed to multi-vendor review; a docs-only PR of over 300 lines is not.
  - The dependabot/renovate/Jules-subtype origin skip list still short-circuits before
    any decision call, asserted by a call-count test.
  - SMALL_PR_MAX_CHANGED_LINES and SMALL_PR_MAX_FILES move to config and remain the
    fallback when the helper returns None.
  - The eligibility record in the merge report carries evidence_class "judgment",
    the risk score and its probability.
- item_id: ri-12
  title: Judge decision-tag backfill in explore-feature
  status: approved
  priority: 4
  effort: S
  depends_on:
  - ri-05
  description: Replace the seven keyword lists in backfill_decision_tags with Choice(capability,
    the seven capability tags plus "none") over each decision's title and rationale,
    batched as many questions over one session-log phase as shared state, and feed
    ChoiceAnswer.probabilities into the existing 0.5/0.8 confidence buckets.
  rationale: 'Pilot step 4 and the textbook shape for this primitive: routing with
    a no-match option. The script already emits a confidence the report buckets, but
    keyword-derived confidence is not calibrated, so the report format needs no change
    while the number behind it becomes meaningful.'
  change_id: judge-decision-tag-backfill-in-explore-feature
  acceptance_outcomes:
  - The report's confidence field is populated from ChoiceAnswer.probabilities and
    the existing 0.5/0.8 bucketing code is unchanged, asserted by a test over a session-log
    fixture.
  - A decision matching no capability yields the "none" option and is excluded from
    proposed edits.
  - All decisions in one session-log phase are answered in a single batched call,
    asserted by a call-count test.
  - The keyword map remains as the fallback and the script still only proposes edits
    for agent review; no file is written by the script itself.
- item_id: ri-13
  title: Judge fix-tier classification in fix-scrub
  status: approved
  priority: 4
  effort: S
  depends_on:
  - ri-05
  description: Replace the two string tests in fix_scrub.classify with Noul("An agent
    could act on this marker without asking a human") and Noul("This finding includes
    a concrete, applicable fix"), keeping _is_ruff_fixable and source-based routing
    deterministic.
  rationale: Pilot step 4. "Ten characters follow the TODO" and "the text contains
    'proposed fix'" are judgments dressed as string tests, and they mis-tier both
    terse-but-actionable markers and verbose-but-useless ones. Tiers are a plan rather
    than an action, so the risk of a wrong label is bounded.
  change_id: judge-fix-tier-classification-in-fix-scrub
  acceptance_outcomes:
  - A ten-word TODO with no actionable content lands in the ask-a-human tier and a
    terse but actionable one does not, covered by fixtures in skills/tests/fix-scrub.
  - _is_ruff_fixable still classifies by ruff rule prefix with no decision call, asserted
    by a call-count test.
  - The character-count and substring rules remain the fallback and existing classify
    tests pass with the helper stubbed to None.
- item_id: ri-14
  title: Route review convergence on per-finding dispositions
  status: approved
  priority: 2
  effort: L
  depends_on:
  - ri-05
  description: In convergence_loop.converge, ask a round-level Noul("another fix round
    is likely to reduce blocking findings") and, per blocking finding, Choice(disposition,
    {fix_now, defer_to_followup, reject_out_of_scope, needs_human}) over the ledger
    trend, the last fix diff and each item's mark_addressed / reject_out_of_scope_fix
    history. Route fix_now to fix_callback, defer and reject through the existing
    ledger calls, and park needs_human.
  rationale: 'Pilot step 4 and the change that removes the most wasted fix dispatches:
    the current stall rule fires on a round that fixed three findings and surfaced
    two, and fails to fire when a fixer keeps re-addressing a finding reviewers keep
    rejecting. Classifying intent before the expensive action is the point.'
  change_id: route-review-convergence-on-per-finding-dispositions
  acceptance_outcomes:
  - max_rounds remains a hard ceiling that no judged answer can extend, asserted by
    a test where the round Noul stays high.
  - A replay over recorded ledger trends shows fewer fix dispatches than the stall
    rule for the same terminal blocking count, with both counts recorded.
  - defer_to_followup and reject_out_of_scope go through the existing park_item and
    reject_out_of_scope_fix paths, with no new ledger mutation surface.
  - needs_human parks the item as a disagreement rather than dispatching a fix, covered
    by a test.
  - With the helper returning None the stall rule trend[-1] >= trend[-stall_window]
    still governs, proven by existing convergence tests passing unchanged.
- item_id: ri-15
  title: Screen fact-check grounds with a first-stage judged pass
  status: approved
  priority: 3
  effort: L
  depends_on:
  - ri-05
  description: 'Split fact_check.run into two stages: stage one asks one Noul per
    finding for Ground A ("the code the finding describes is not in the subject file''s
    diff") and one Noul("a line in this diff directly contradicts the finding''s central
    claim") as a Ground-B screen; stage two runs the existing economy-tier LLM prompt
    only for findings whose Ground-B probability crosses a config-held threshold.'
  rationale: Pilot step 5. Ground B needs a quoted diff line that the code verifies
    literally via _evidence_line_in_subject_diff, which this primitive cannot produce,
    so the two-stage pattern is mandatory rather than optional. Most review batches
    would never reach stage two, removing a 90-line prompt from the common path.
  change_id: screen-fact-check-grounds-with-a-first-stage-judged-pass
  acceptance_outcomes:
  - A batch whose findings all screen below the Ground-B threshold makes zero stage-two
    LLM calls, asserted by a call-count test.
  - Ground-B verdicts still require a quoted diff line validated by _evidence_line_in_subject_diff;
    no finding is refuted on the screen alone, covered by a test.
  - Protected-subject vetoes are applied in code before any call, asserted by a fixture
    where a protected subject is never sent.
  - Ground-A refutations from stage one reproduce the existing prompt's labels on
    a recorded fact-check batch, with the agreement rate recorded.
- item_id: ri-16
  title: Add a judged first stage to coordinator audit triage
  status: approved
  priority: 3
  effort: M
  depends_on:
  - ri-05
  description: In audit_triage.drain_and_classify, ask per session batch Noul("This
    session shows a capability gap in the harness"), Choice(failure_type, the six
    enum values plus none) and Score(severity, [low, medium, high, critical]); run
    the current LLM prompt only for sessions above the recall-oriented threshold,
    seeded with the stage-one labels so its output is constrained.
  rationale: Pilot step 5. The prompt's own instruction to "prefer recall over precision"
    is a calibration statement that a threshold on a calibrated probability expresses
    directly. capability_gap is prose and must stay with an LLM, which makes this
    the two-stage shape; validate_finding and the hot-path ring buffer are untouched.
  change_id: add-a-judged-first-stage-to-coordinator-audit-triage
  acceptance_outcomes:
  - The recall-oriented threshold lives in config and a replay over recorded audit
    batches shows recall no lower than the current prompt's, with both numbers recorded.
  - Sessions below the threshold produce no LLM call, asserted by a call-count test
    over a clean-session fixture.
  - Stage-two findings are seeded with the stage-one failure_type and severity and
    still pass validate_finding unchanged.
  - The hot-path ring buffer write path is unmodified and its latency test is unchanged.
- item_id: ri-17
  title: Score supervise rubric stubs in one batched call
  status: approved
  priority: 4
  effort: M
  depends_on:
  - ri-05
  description: Replace the analyst-archetype rubric dispatch with up to 100 Score
    questions over one manifest state (five factors for up to 20 stubs) in a single
    call, and resolve the justification blocker by relaxing justification to optional
    in the rubric-score contract so the digest renders the Score legend level instead.
  rationale: "Pilot step 5. The current prompt runs under a 120-second timeout with\
    \ one retry and rejects \"missing, partial, invalid, or late output\" \u2014 a\
    \ description of the failure mode this primitive removes. The schema decision\
    \ must land with the change because rubric-score.schema.json marks justification\
    \ required per factor; the digest is deterministic by design, so this is a contract\
    \ change rather than an architecture change."
  change_id: score-supervise-rubric-stubs-in-one-batched-call
  acceptance_outcomes:
  - The rubric-score contract marks justification optional and the digest renders
    the Score legend level when it is absent, covered by a digest snapshot test.
  - Twenty stubs are scored on five factors in one call and the result validates against
    the updated schema, asserted over a manifest fixture.
  - Structural-error handling (missing, partial, invalid, late) is exercised by a
    test showing the analyst-archetype dispatch remains the fallback.
  - Scores over a recorded manifest agree with the archived analyst output above a
    recorded agreement rate, cited in the change artifacts.
- item_id: ri-18
  title: Extract the task routing profile as typed fields
  status: approved
  priority: 4
  effort: M
  depends_on:
  - ri-05
  description: Produce the task router's routing profile from a task description with
    Score(duration, [minutes, an hour, a day, longer]), Noul("needs interactive human
    input"), Noul("needs a secret or credential") and Choice(scope, {single_file,
    package, cross_package, repo_wide}), leaving the routing rules themselves deterministic
    and versioned.
  rationale: Pilot step 5 and factor 1, natural language to structured data. The active
    implement-the-task-router-vendor-x-location-x-model change is right that routing
    rules must stay deterministic and explainable; what produces the profile today
    is nothing or an LLM. This item must land after that change so the router never
    needs an LLM at all.
  change_id: extract-the-task-routing-profile-as-typed-fields
  acceptance_outcomes:
  - The router consumes only typed profile fields and its rule evaluation is unchanged,
    asserted by routing tests that pass a hand-written profile.
  - The routing audit event carries the probabilities for every profile field it was
    given.
  - With the helper returning None the router still resolves using its declared or
    default profile, covered by a test.
  - A fixture set of task descriptions yields the expected profile fields, with duration
    and scope agreement recorded.
- item_id: ri-19
  title: Route recoverable escalation actions on confidence
  status: approved
  priority: 4
  effort: M
  depends_on:
  - ri-05
  description: In EscalationHandler.handle, ask Choice(action, the EscalationAction
    values) over the escalation summary, impact set and attempt history, restricted
    to the recoverable actions for escalation types the existing table already treats
    as recoverable, with the prescribed mapping as the fallback.
  rationale: Pilot step 6 and companion section 3. The table's "no conversational
    decision-making" rule was correct against a chat model improvising; a calibrated
    choice constrained to the actions the table already permits keeps that guarantee
    while letting the recoverable cases pick the cheapest working recovery.
  change_id: route-recoverable-escalation-actions-on-confidence
  acceptance_outcomes:
  - Escalation types whose table entry is REQUIRE_HUMAN always return REQUIRE_HUMAN
    regardless of the distribution, asserted per type by a parametrised test.
  - The candidate action set passed for each type is a subset of that type's table-permitted
    recoverable actions, asserted by a test over every escalation type.
  - Below act_floor the handler routes to the human intent rather than the fallback
    action, covered by a test.
  - Every handled escalation records the chosen action, its distribution and degraded
    flag in the escalation record.
- item_id: ri-20
  title: Decide roadmap item failure handling on confidence
  status: approved
  priority: 4
  effort: M
  depends_on:
  - ri-05
  description: Replace the replan boolean derived from _normalize_outcome in orchestrator._handle_failure
    with Choice(next, {retry_same_vendor, retry_other_vendor, skip_item, request_replan,
    escalate}) over the failure reason, the item's acceptance outcomes and the attempt
    history.
  rationale: Pilot step 6 and companion section 4. The current path collapses a five-way
    decision into one boolean, so a transient vendor failure and a genuinely under-specified
    item are handled the same way. The decision only chooses which existing gate to
    reach for; request_replan still passes through the REPLAN_REQUIRED gate.
  change_id: decide-roadmap-item-failure-handling-on-confidence
  acceptance_outcomes:
  - request_replan still traverses the REPLAN_REQUIRED gate unchanged, asserted by
    an existing gate test passing unmodified.
  - Each decision and its distribution are appended to the roadmap checkpoint's event
    log.
  - The attempt-count ceiling still terminates retries regardless of the chosen label,
    covered by a test.
  - With the helper returning None, _normalize_outcome's replan boolean governs and
    current orchestrator failure tests pass unchanged.
- item_id: ri-21
  title: Triage merge review threads by required response
  status: approved
  priority: 5
  effort: M
  depends_on:
  - ri-05
  - ri-11
  description: In execute_plan's delegate_comments, classify each unresolved review
    thread with Choice({needs_code_change, needs_reply_only, already_addressed, outdated})
    over the thread text and the current diff of the file it points at, delegating
    only needs_code_change.
  rationale: Pilot step 6 and companion section 5. Today any unresolved thread triggers
    delegation, so threads already addressed by a later commit or made moot by a rewrite
    still cost a dispatch. The surrounding staleness, security and live-state gates
    are facts and stay deterministic.
  change_id: triage-merge-review-threads-by-required-response
  acceptance_outcomes:
  - A thread whose concern is visibly resolved in the current file diff is classified
    already_addressed and triggers no delegation, covered by a fixture in the execute_plan
    tests.
  - staleness_gate, security_gate and live_state_gate run before any decision call
    and their outcomes are unaffected, asserted by a call-ordering test.
  - Threads below act_floor fall through to delegation rather than being silently
    closed.
  - With the helper returning None every unresolved thread is delegated exactly as
    today, proven by existing execute_plan tests.
- item_id: ri-22
  title: Classify retries by sameness and transience
  status: approved
  priority: 4
  effort: M
  depends_on:
  - ri-05
  - ri-20
  description: In phase_fixer and the roadmap dispatcher, replace the consecutive-failure
    count as the sole retry signal with Noul("this error is the same failure as the
    previous attempt"), Noul("this error is transient and retrying without change
    is likely to succeed") and Choice(failure_type, the existing failure-type enum),
    stopping early when a failure is the same and not transient.
  rationale: Pilot step 6 and companion section 8, factor 9. Counting to N spends
    N attempts discovering what the first repeat already showed. The failure_type
    choice also compacts each error into the vocabulary the improve-harness pipeline
    already mines, so the labels arrive for free.
  change_id: classify-retries-by-sameness-and-transience
  acceptance_outcomes:
  - A same-and-not-transient failure stops retrying before the ceiling, asserted by
    a test that counts attempts against the current count-only baseline.
  - The retry ceiling is unchanged and still terminates, covered by a test where both
    Nouls are inconclusive.
  - The emitted failure_type uses the existing enum values consumed by improve-harness,
    validated against that consumer's schema.
  - With the helper returning None the consecutive-failure count governs and existing
    phase_fixer retry tests pass unchanged.
- item_id: ri-23
  title: Narrow deployable-surface fallout with a high-floor judgment
  status: approved
  priority: 6
  effort: M
  depends_on:
  - ri-05
  description: For the unknown bucket only in gate_logic.classify_deployable_surface,
    ask Noul("This change alters the behaviour of a running service") and accept non-deployable
    only when that probability is at or below a low config-held ceiling (about 0.1);
    any higher probability keeps failing closed to deployable. Declared frontmatter
    and the proven-non-deployable prefix set stay authoritative.
  rationale: 'Pilot step 7. This is a gate input, so it goes last and asymmetrically:
    the judgment may only skip container phases for changes it is very confident do
    not touch a running service, never add risk. The cost being removed is Docker-dependent
    smoke, security and E2E phases on changes that do not need them.'
  change_id: narrow-deployable-surface-fallout-with-a-high-floor-judgment
  acceptance_outcomes:
  - Changes with declared frontmatter or a prefix in the proven-non-deployable set
    never reach a decision call, asserted by a call-count test.
  - A probability of altering a running service above the configured ceiling still
    yields deployable (fail closed), covered by a parametrised test around the ceiling
    including a high-probability case that must remain deployable.
  - Every judged classification writes DEGRADED-style provenance ("derived by system_one,
    p(alters service)=0.04") into the validation report via record_degraded-equivalent
    plumbing, asserted on a report fixture.
  - A replay over recorded unknown-bucket changes shows no change previously classified
    deployable being downgraded unless its probability of altering a service is at
    or below the ceiling.
- item_id: ri-24
  title: Classify human reply intent behind the approval floor
  status: approved
  priority: 6
  effort: M
  depends_on:
  - ri-08
  description: Replace relay.parse_reply's first-word keyword match with Choice({approve,
    deny, resolved, skip, guidance}) over the reply text, keeping the sender allowlist,
    requiring distribution["approve"] >= 0.97 for an approval and mapping everything
    else to guidance.
  rationale: Pilot step 7 and the proposal's explicit security item. "Looks good,
    go ahead" falling to guidance is real brittleness, but this is a human authorization
    channel, so widening what counts as approved changes the trust model. It ships
    last, after live calibration has been demonstrated at the promoted sites, and
    as a security review rather than a quick win.
  change_id: classify-human-reply-intent-behind-the-approval-floor
  acceptance_outcomes:
  - Replies from senders outside the allowlist are rejected before any decision call,
    asserted by a call-count test.
  - approve is returned only when distribution["approve"] >= 0.97; every other case,
    including a degraded decision, returns guidance, covered by a parametrised test
    around 0.97.
  - A corpus of recorded replies shows no reply currently classified non-approve becoming
    approve without meeting the floor.
  - The change carries a security review recording the trust-model impact, and every
    classified reply logs its distribution alongside the sender.
